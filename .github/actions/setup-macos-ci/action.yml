name: Prepare self-hosted macOS CI
description: Expose Homebrew tools and check disk space on the Mac runner.

runs:
  using: composite
  steps:
    - name: Add Homebrew to PATH
      shell: bash
      run: |
        echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
        echo "/usr/local/bin" >> "$GITHUB_PATH"

    - uses: ./.github/actions/check-runner-disk
