name: Agent TLS interoperability

on:
  workflow_call:

permissions:
  contents: read

jobs:
  agent-tls-interop:
    name: Agent TLS client-certificate interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Match the console's OpenSSL 3.5 runtime, not the runner's older SSL.
    container: python:3.12-slim-trixie@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
    steps:
      - name: Install checkout dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run TLS interoperability regression
        run: |
          # The job container and checkout action can use different home paths.
          # Trust only this checkout so Go can read its VCS build metadata.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .github/scripts/test-agent-tls.py

