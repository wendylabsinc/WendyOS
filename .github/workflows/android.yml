name: Android companion
on:
  pull_request:
    paths: ['go/android/**', 'go/macos/backend/**', 'go/macos/vpn/**', 'go/internal/**', 'go/proto/**', 'go.mod', 'go.sum', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['go/android/**', 'go/macos/backend/**', 'go/macos/vpn/**', 'go/internal/**', 'go/proto/**', 'go.mod', 'go.sum', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-go-ci
        with:
          cache-name: android
      - name: Select Java and install Android toolchain
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build both ABIs, test Kotlin and run lint
        working-directory: go/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify native 16 KB alignment
        shell: bash
        run: |
          for abi in arm64-v8a x86_64; do
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -l "go/android/app/src/main/jniLibs/$abi/libwendy.so" | awk '/LOAD/ { count++; if ($NF != "0x4000") bad=1 } END { exit(count == 0 || bad) }'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wendy-android-debug
          path: go/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: wendy-android-reports
          path: go/android/app/build/reports/
