name: API Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Same-repository PR to validate without publishing"
        required: true
        type: string
      expected_head_sha:
        description: "Exact PR head SHA approved for this validation"
        required: true
        type: string

concurrency:
  # Title/body edits have no model work and must not cancel an active review.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.event.action != 'edited' || github.event.changes.base != null) && (github.event.pull_request.number || inputs.pr_number) || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-api-changes:
    name: Detect API surface changes
    # Repository secrets are unavailable to forks and Dependabot. Never execute
    # their PR code or give them a credentialed model-review fallback.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: runs-on,runner=2cpu-linux-x64
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      trusted_sha: ${{ steps.trusted-automation.outputs.sha }}
      artifact_id: ${{ steps.review-result.outputs.artifact-id }}
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CLAUDE_MODEL: claude-opus-4-8
    steps:
      - name: Resolve current trusted main automation
        id: trusted-automation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // SECURITY: PR base.sha can retain an old target snapshot. Select
            // only this repository's current main, never PR-controlled source.
            const {data} = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: "heads/main"
            });
            const sha = data.object?.sha;
            if (data.object?.type !== "commit" || typeof sha !== "string" || !/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error("Could not resolve an immutable trusted main commit");
            }
            core.info(`Trusted API automation commit: ${sha}`);
            core.setOutput("sha", sha);

      - name: Check out pinned trusted main review automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted-automation.outputs.sha }}
          fetch-depth: 0
          path: review-automation
          sparse-checkout: |
            .github/scripts
            .github/workflows/api-review.yml
            .github/workflows/docs-review.yml
            .github/workflows/integration-test-review.yml
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test API review automation
        run: |
          set -euo pipefail
          python3 review-automation/.github/scripts/api_review_test.py
          python3 review-automation/.github/scripts/api_review_comment_test.py
          python3 review-automation/.github/scripts/review_diff_test.py
          if [[ -f review-automation/.github/scripts/review_sources_test.py ]]; then
            python3 review-automation/.github/scripts/review_sources_test.py
          fi
          if [[ -f review-automation/.github/scripts/api_review_compatibility_test.py ]]; then
            python3 review-automation/.github/scripts/api_review_compatibility_test.py
          fi
          workflow_test="review-automation/.github/scripts/api_review_workflow_test.py"
          if [[ -f "$workflow_test" ]]; then
            python3 "$workflow_test"
          fi

      - name: Fetch complete PR metadata and diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata_tmp="$(mktemp)"
          diff_tmp="$(mktemp)"
          current_metadata_tmp="$(mktemp)"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$metadata_tmp"
          jq -e --arg head "$EXPECTED_HEAD_SHA" --arg base "$EXPECTED_BASE_SHA" \
            '.head.sha == $head and .base.sha == $base' "$metadata_tmp" > /dev/null
          # Removed lines in a PR diff belong to its merge base, which can
          # differ from the target branch tip used by the stale-run checks.
          diff_base_sha="$(git -C review-automation merge-base "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA")"
          if [[ ! "$diff_base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not identify the PR diff's immutable merge base."
            exit 1
          fi
          # The GitHub diff endpoint rejects PRs with more than 300 files.
          # Read immutable Git objects without checking out or executing PR code.
          git -C review-automation diff --no-ext-diff --no-textconv --find-renames \
            "$diff_base_sha" "$EXPECTED_HEAD_SHA" -- > "$diff_tmp"
          # The PR endpoint is live. Reject a revision change during fetching,
          # rather than reviewing a diff against mismatched metadata or links.
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$current_metadata_tmp"
          jq -e --arg head "$EXPECTED_HEAD_SHA" --arg base "$EXPECTED_BASE_SHA" \
            '.head.sha == $head and .base.sha == $base' "$current_metadata_tmp" > /dev/null
          jq --arg diff_base_sha "$diff_base_sha" '. + {diff_base_sha: $diff_base_sha}' \
            "$metadata_tmp" > "$RUNNER_TEMP/api-review-pr-meta.json"
          mv "$diff_tmp" "$RUNNER_TEMP/api-review-pr.diff"

      - name: Fetch previous API decision state
        env:
          # SECURITY: This isolated step reads only bot-owned comments. Fork PRs are rejected before token use.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comment_script="review-automation/.github/scripts/api_review_comment.py"
          if ! grep -q 'add_parser("fetch-state")' "$comment_script"; then
            echo "::notice::Stateful API review will activate after its trusted automation reaches the base branch."
            exit 0
          fi
          python3 "$comment_script" fetch-state \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --output "$RUNNER_TEMP/previous-api-review.json"

      - name: Install Anthropic SDK
        run: pip install --quiet anthropic==0.97.0

      - name: Test complete API review runs with pinned SDK
        run: |
          set -euo pipefail
          run_test="review-automation/.github/scripts/api_review_run_test.py"
          if [[ -f "$run_test" ]]; then
            # SECURITY: This file comes only from the resolved immutable main
            # checkout above, never the PR-head bootstrap file list. Forks are
            # rejected at job entry; this step receives no GH_TOKEN/model key.
            # Offline SDK transport and GitHub fixtures; no keys or model calls.
            python3 "$run_test"
          else
            echo "::notice::Full-run regression tests activate when trusted automation reaches the base branch."
          fi

      # Review the complete diff semantically. Snapshot or protobuf-file hashes
      # confuse comments/formatting with API decisions, and cannot find durable
      # contracts such as network constants, storage paths, or config formats.
      - name: Review API decisions and testing risk
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          previous_args=()
          if [[ -f "$RUNNER_TEMP/previous-api-review.json" ]]; then
            previous_args=(--previous "$RUNNER_TEMP/previous-api-review.json")
          fi
          review_script="review-automation/.github/scripts/api_review.py"
          context_args=()
          review_help="$(python3 "$review_script" review --help)"
          if [[ "$review_help" == *"--source-repository"* ]]; then
            context_args=(--source-repository review-automation)
          else
            notice="Compatibility guidance and unchanged-source context have not activated in trusted main automation. This run uses the trusted runner's existing diff-only review; no unchanged-source context was reviewed."
            echo "::notice::$notice"
            printf '%s\n' "$notice" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 "$review_script" review \
            --metadata "$RUNNER_TEMP/api-review-pr-meta.json" \
            --diff "$RUNNER_TEMP/api-review-pr.diff" \
            "${context_args[@]}" \
            "${previous_args[@]}" \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --output "$RUNNER_TEMP/api-review-result.json" \
            --model "$CLAUDE_MODEL"

      - name: Preserve complete API review result
        id: review-result
        if: always() && (steps.review.outcome == 'success' || steps.review.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/api-review-result.json
            ${{ runner.temp }}/api-review-pr.diff
          if-no-files-found: error
          retention-days: 14

  publish-api-review:
    name: Publish API report
    needs: detect-api-changes
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      needs.detect-api-changes.outputs.trusted_sha != '' &&
      needs.detect-api-changes.outputs.artifact_id != ''
    runs-on: runs-on,runner=2cpu-linux-x64
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out the same trusted publication code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect-api-changes.outputs.trusted_sha }}
          sparse-checkout: .github/scripts
          path: review-automation
          persist-credentials: false
      # Untrusted candidate tests share the run and can upload artifacts. Only
      # the trusted upload's immutable ID may select data for this publisher.
      - name: Download the trusted review artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.detect-api-changes.outputs.artifact_id }}
          path: ${{ runner.temp }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Publish incomplete reviews too, retaining the failed check and previous
      # accepted decisions. Checkboxes track the maintainer's API acceptance;
      # unchecked decisions are not an additional merge gate.
      - name: Publish API decision checklist and labels
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/api-review-result.json"
          if [[ ! -f "$result_file" ]]; then
            echo "::error::API review produced no result; no review comment or labels were changed."
            exit 1
          fi
          python3 review-automation/.github/scripts/api_review_comment.py publish \
            --result "$result_file" \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA"

  validate-candidate-tests:
    name: Test candidate API review without credentials
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: runs-on,runner=2cpu-linux-x64
    permissions:
      contents: read
    steps:
      # SECURITY: Candidate tests run without provider keys or write permissions.
      # Automatic review/publication jobs execute only pinned main code.
      - name: Check out candidate for offline tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned SDK and run all offline regressions
        run: |
          set -euo pipefail
          pip install --quiet anthropic==0.97.0
          python3 .github/scripts/api_review_test.py
          python3 .github/scripts/api_review_comment_test.py
          python3 .github/scripts/review_diff_test.py
          python3 .github/scripts/api_review_run_test.py
          python3 .github/scripts/review_sources_test.py
          python3 .github/scripts/api_review_workflow_test.py
          python3 .github/scripts/api_review_compatibility_test.py

  validate-candidate:
    name: Validate candidate API review without publication
    if: github.event_name == 'workflow_dispatch'
    needs: validate-candidate-tests
    runs-on: runs-on,runner=2cpu-linux-x64
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      CLAUDE_MODEL: claude-opus-4-8
    steps:
      # SECURITY: Manual dispatch is an explicit writer-authorized candidate
      # validation. Pin execution to the dispatched immutable commit; automatic
      # PR reviews above continue to execute only pinned trusted main code.
      - name: Check out dispatched candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned SDK
        run: pip install --quiet anthropic==0.97.0

      - name: Read immutable PR evidence and prior state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          metadata="$RUNNER_TEMP/api-review-pr-meta.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$metadata"
          jq -e --arg repo "$REPO" --arg head "$EXPECTED_HEAD_SHA" \
            '.head.repo.full_name == $repo and .head.sha == $head and .state == "open"' "$metadata" > /dev/null
          base_sha=$(jq -r '.base.sha' "$metadata")
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          diff_base_sha=$(git merge-base "$base_sha" "$EXPECTED_HEAD_SHA")
          [[ "$diff_base_sha" =~ ^[0-9a-f]{40}$ ]]
          git diff --no-ext-diff --no-textconv --find-renames \
            "$diff_base_sha" "$EXPECTED_HEAD_SHA" -- > "$RUNNER_TEMP/api-review-pr.diff"
          jq --arg diff_base_sha "$diff_base_sha" '. + {diff_base_sha: $diff_base_sha}' \
            "$metadata" > "$metadata.tmp"
          mv "$metadata.tmp" "$metadata"
          echo "EXPECTED_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          python3 .github/scripts/api_review_comment.py fetch-state \
            --repo "$REPO" --pr-number "$PR_NUMBER" \
            --output "$RUNNER_TEMP/previous-api-review.json"

      - name: Run candidate evidence review and reconciliation
        id: candidate
        env:
          # SECURITY: Model input is untrusted data; no GitHub token is exposed.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 .github/scripts/api_review.py review \
            --metadata "$RUNNER_TEMP/api-review-pr-meta.json" \
            --diff "$RUNNER_TEMP/api-review-pr.diff" \
            --source-repository . \
            --previous "$RUNNER_TEMP/previous-api-review.json" \
            --repo "$REPO" --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" --expected-base-sha "$EXPECTED_BASE_SHA" \
            --output "$RUNNER_TEMP/api-review-result.json" --model "$CLAUDE_MODEL"

      - name: Validate publication without mutations
        if: always() && (steps.candidate.outcome == 'success' || steps.candidate.outcome == 'failure')
        env:
          # SECURITY: Read-only token plus dry-run interception: no comments,
          # labels, reviewer requests, acceptance, or feature source are changed.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/api_review_comment.py publish --dry-run \
            --result "$RUNNER_TEMP/api-review-result.json" \
            --repo "$REPO" --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" --expected-base-sha "$EXPECTED_BASE_SHA" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preserve candidate result
        if: always() && (steps.candidate.outcome == 'success' || steps.candidate.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-review-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/api-review-result.json
          if-no-files-found: error
          retention-days: 14
