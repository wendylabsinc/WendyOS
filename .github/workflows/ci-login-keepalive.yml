name: CI login keepalive

# The seven-day reminder is intentionally stubbed until Auth and the CLI expose
# authoritative refresh-family absolute expiry. Certificate expiry (including
# certificate.expiringSoon) is not the sign-in deadline.
on:
  schedule:
    - cron: '17 0 * * *'

permissions: {}

# One stored login on this runner; never interrupt a rotating-token exchange.
concurrency:
  group: ci-login-wendy-developer-macos-26-01
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the Mac's stored CI login
    runs-on:
      group: wendy-developer
      labels: [self-hosted, macOS, ARM64, wendy-macos-26]
    permissions: {}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      # No checkout or build: use the runner's existing CLI and file store in
      # the same SSH localhost session as the hardware gate. Never print raw
      # refresh output, which can contain token-endpoint error responses.
      # Prerequisite: the wendy context is the manual ci@wendy.sh production
      # OIDC login. Select it explicitly before refreshing the current context.
      # The CLI has a legacy endpoint-substring fallback if that name is absent;
      # this does not strictly verify the context name or CI principal.
      - name: Select the stored wendy CI context
        timeout-minutes: 1
        run: >-
          ssh -o BatchMode=yes -o ConnectTimeout=10 localhost
          'env CI=true WENDY_SECRET_STORE=file WENDY_NO_UPDATE_CHECK=1
          /Users/wendy/.github/actions-runner/_work/WendyOS/WendyOS/go/bin/wendy
          auth use wendy --json' </dev/null >/dev/null 2>&1

      - name: Refresh certificates through the stored OIDC sign-in
        timeout-minutes: 2
        run: >-
          ssh -o BatchMode=yes -o ConnectTimeout=10 localhost
          'env CI=true WENDY_SECRET_STORE=file WENDY_NO_UPDATE_CHECK=1
          /Users/wendy/.github/actions-runner/_work/WendyOS/WendyOS/go/bin/wendy
          auth refresh-certs --json' </dev/null >/dev/null 2>&1

      - name: 'STUB: seven-day sign-in reminder (not wired)'
        if: ${{ false }}
        # Intentionally inert; no deadline estimate or reminder is emitted.
        run: ':'

      - name: Explain the failure without credential output
        if: ${{ failure() }}
        run: >-
          echo '::error::CI login context selection or refresh failed.
          Sign-in needs attention.
          Check SSH, network, Auth and PKI availability. If sign-in is
          expired or refused, use the runner login session to run
          WENDY_SECRET_STORE=file wendy auth login as ci@wendy.sh, then
          WENDY_SECRET_STORE=file wendy auth use wendy.'

  alarm:
    name: Report keepalive failure to CI
    needs: refresh
    # Also reports runner failures, once GitHub terminates the queued job.
    if: ${{ always() && needs.refresh.result != 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    env:
      CI_SLACK_CHANNEL: C0C7Z1SJXJ7
    steps:
      - name: 'Post the failure to #ci'
        # Vendor release and tag SHA verified through GitHub on 2026-11-13.
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "${{ env.CI_SLACK_CHANNEL }}"
            text: |
              *CI login keepalive needs attention* WendyOS run ${{ github.run_id }}
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              The keepalive on wendy-developer-macos-26-01 did not complete successfully (${{ needs.refresh.result }}).
              Check the failed step and SSH, network, Auth and PKI availability.
              If sign-in is expired or refused, in the runner login session run `WENDY_SECRET_STORE=file wendy auth login` as ci@wendy.sh, then `WENDY_SECRET_STORE=file wendy auth use wendy`.
