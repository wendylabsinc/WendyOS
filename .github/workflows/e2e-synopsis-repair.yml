name: Draft E2E Synopsis Repair

on:
  workflow_run:
    workflows: ['Swift E2E Tests']
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - '.github/scripts/e2e_synopsis_repair.py'
      - '.github/scripts/tests/test_e2e_synopsis_repair.py'
      - '.github/workflows/e2e-synopsis-repair.yml'

permissions: {}

jobs:
  fixtures:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts/tests -p test_e2e_synopsis_repair.py -v

  prepare:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'failure' &&
      vars.E2E_SYNOPSIS_REPAIRS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      # workflow_run's github.sha is trusted default-branch code, not artifact code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Correlate synopsis and first failing merge
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          WRITER_CONFIGURED: ${{ secrets.E2E_FIX_BOT_TOKEN != '' }}
        run: |
          if [ "$WRITER_CONFIGURED" != true ]; then
            echo 'E2E_FIX_BOT_TOKEN is missing; repairs are disabled.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 .github/scripts/e2e_synopsis_repair.py prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.candidate == 'true'
        with:
          name: synopsis-proposal-${{ github.run_attempt }}
          path: proposal.json
          retention-days: 14
          if-no-files-found: error

  verify:
    needs: prepare
    if: needs.prepare.outputs.candidate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synopsis-proposal-${{ github.run_attempt }}
          path: evidence
      - name: Apply the one literal edit
        id: edit
        run: python3 control/.github/scripts/e2e_synopsis_repair.py apply --source source --proposal evidence/proposal.json
      - name: Verify the actual failed test without publication credentials
        working-directory: source
        env:
          TEST_FILTER: ${{ steps.edit.outputs.filter }}
          WENDY_E2E_RUN_ID: synopsis-verification
          WENDY_E2E_CLI_OS: linux
          WENDY_E2E_AGENT_OS: linux
          WENDY_E2E_TRANSPORT: local
          # No writer, Slack or model secrets; checkout credentials are not persisted.
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libusb-1.0-0-dev
          bash swift/Scripts/E2ESetup.sh
          export PATH="$HOME/.local/share/swiftly/bin:$HOME/.swiftly/bin:$PATH"
          bash swift/Scripts/E2ETest.sh --managed-agent --device-address 127.0.0.1:50051 \
            --filter "$TEST_FILTER" --output-dir "$RUNNER_TEMP/verification"
          python3 ../control/.github/scripts/e2e_synopsis_repair.py check \
            --proposal ../evidence/proposal.json \
            --proof ../evidence/verification.json \
            --results "$RUNNER_TEMP/verification/synopsis-verification/test-results.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synopsis-verification-${{ github.run_attempt }}
          path: evidence/verification.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: e2e-synopsis-publisher
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synopsis-proposal-${{ github.run_attempt }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synopsis-verification-${{ github.run_attempt }}
      - name: Recheck evidence and create draft once
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_FIX_BOT_TOKEN: ${{ secrets.E2E_FIX_BOT_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          E2E_SLACK_AUTHORS: ${{ vars.E2E_SLACK_AUTHORS || '{}' }}
          SLACK_CHANNEL: ${{ vars.FEED_E2E_SLACK_CHANNEL }}
          SLACK_READY: ${{ secrets.CI_SLACK_BOT_TOKEN != '' }}
        run: python3 .github/scripts/e2e_synopsis_repair.py publish
      - name: Notify feed-e2e once
        if: steps.publish.outputs.notify == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload-file-path: slack-payload.json
          errors: true
          retries: 0
