name: Go Tests

on:
  # Populate caches on the default branch so new PRs can reuse them.
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/dependabot.yml'
      # Read by go/internal/cli/commands/docs_command_contract_test.go.
      - 'README.md'
      - 'Examples/NvidiaPAIR/README.md'
      - 'go/**'
      - 'web-client/public/**'
      - 'web-client/package.json'
      - 'web-client/package-lock.json'
      - 'web-client/tests/**'
      - 'web-client/lib/**'
      - 'web-client/electron/**'
      - 'web-client/desktop/**'
      - 'web-client/components/**'
      - 'web-client/scripts/build-wasm.mjs'
      - 'go/simulator/go2/go2_sim/**'
      - 'Proto/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'
      - '.github/actions/setup-go-ci/**'
      - '.github/actions/release-priority/**'
      - '.github/actions/check-runner-disk/**'
      - '.github/scripts/**'
      - '.github/ci-tests/memory-budget/**'
      - '.github/ci-tests/host-sensor-loopback/**'
      - '.github/ci-tests/python-gpu/**'
      - '.github/ci-tests/python-onnx-gpu/**'
      - '.github/regression-coverage/manual/**'
      - 'plugins/**'
      - 'scripts/sync-agent-skills.py'
      - 'scripts/package-chatgpt-plugin.py'
      - 'scripts/test-package-chatgpt-plugin.py'
      - 'scripts/pin-cli.sh'
      - 'scripts/test/plugin-launcher/**'
      - 'packaging/linux/**'
      - 'swift/Scripts/SetupSigningCI.sh'
      - 'swift/Scripts/Build.sh'
      - 'swift/WendyAgentMac/RuntimeGuest/**'
      - 'swift/WendyAgentCore/Tests/WendyAgentTests/CaptureFormatChoiceTests.swift'
      - 'Examples/SO101Reader/**'
      - 'Examples/G1CokeDemo/**'
      - 'Examples/WendyNotify/**'
      - 'Examples/ThermalNotify/**'
      - 'evals/**'
      - 'Examples/WendyDataModelApp/**'
      - 'swift/WendyAgentCore/**'
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/dependabot.yml'
      # Read by go/internal/cli/commands/docs_command_contract_test.go.
      - 'README.md'
      - 'Examples/NvidiaPAIR/README.md'
      - 'go/**'
      - 'web-client/public/**'
      - 'web-client/package.json'
      - 'web-client/package-lock.json'
      - 'web-client/tests/**'
      - 'web-client/lib/**'
      - 'web-client/electron/**'
      - 'web-client/desktop/**'
      - 'web-client/components/**'
      - 'web-client/scripts/build-wasm.mjs'
      - 'go/simulator/go2/go2_sim/**'
      - 'Proto/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'
      - '.github/actions/setup-go-ci/**'
      - '.github/actions/release-priority/**'
      - '.github/actions/check-runner-disk/**'
      - '.github/scripts/**'
      - '.github/ci-tests/memory-budget/**'
      - '.github/ci-tests/host-sensor-loopback/**'
      - '.github/ci-tests/python-gpu/**'
      - '.github/ci-tests/python-onnx-gpu/**'
      - '.github/regression-coverage/manual/**'
      - 'plugins/**'
      - 'scripts/sync-agent-skills.py'
      - 'scripts/package-chatgpt-plugin.py'
      - 'scripts/test-package-chatgpt-plugin.py'
      - 'scripts/pin-cli.sh'
      - 'scripts/test/plugin-launcher/**'
      - 'packaging/linux/**'
      - 'swift/Scripts/SetupSigningCI.sh'
      - 'swift/Scripts/Build.sh'
      - 'swift/WendyAgentMac/RuntimeGuest/**'
      - 'swift/WendyAgentCore/Tests/WendyAgentTests/CaptureFormatChoiceTests.swift'
      - 'Examples/SO101Reader/**'
      - 'Examples/G1CokeDemo/**'
      - 'Examples/WendyNotify/**'
      - 'Examples/ThermalNotify/**'
      - 'evals/**'
      - 'Examples/WendyDataModelApp/**'
      - 'swift/WendyAgentCore/**'

concurrency:
  group: go-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-launcher:
    uses: ./.github/workflows/plugin-launcher.yml

  dependency-security:
    uses: ./.github/workflows/security.yml

  automation-regressions:
    name: Offline automation regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Install the review SDK and fixture dependencies
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y libarchive-tools
          python -m pip install -r .github/scripts/requirements-regression-tests.txt
      - name: Exercise review, event and failure contracts without publishing
        run: python .github/scripts/run-automation-regressions.py
      - name: Require eval accounting, tool guards and process deadlines
        run: python .github/scripts/run-eval-regressions.py

  shared-grpc-api-contracts:
    name: Shared gRPC API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify shared contract pin is on service-protos master
        run: |
          source Proto/shared-grpc-api-contracts.sh
          check_shared_grpc_api_contracts_ancestry
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: '1.75.0'
          setup_only: true
          pr_comment: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '34.0'
          repo-token: ${{ github.token }}
      - name: Install pinned Go generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Check shared gRPC API contracts
        run: bash go/scripts/generate-proto.sh --check-shared-grpc-api-contracts

  babel:
    name: Babel tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go/babel
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Use the repository's maintained compiler; Babel's module keeps its
          # own minimum language version for library consumers.
          go-version-file: go.mod
          cache: false

      # Babel is a nested module, so the parent module's ./... skips it.
      - name: Run Babel race tests
        run: go test -race -count=1 -timeout 300s ./...

      - name: Vet Babel
        run: go vet ./...

  unit-tests:
    name: Race tests
    runs-on: runs-on,runner=2cpu-linux-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: ./.github/actions/setup-go-ci
        with:
          cache-name: race

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libusb-1.0-0-dev iproute2 dnsmasq-base busybox

      - name: Run tests
        working-directory: go
        # Keep the compiler's per-package concurrency workaround for race
        # builds, but let Go build and test packages in parallel. Vet has its
        # own required job, so do not repeat it in every race build.
        # -timeout is per package: internal/cli/commands alone took 296.146s
        # of the former 300s under -race on main 08a9cb01 (2026-11-11).
        run: go test -gcflags=all=-c=1 ./... -race -vet=off -count=1 -timeout 600s

      - name: Test bounded physical thermal capture helper
        run: go test -race ./.github/scripts/fixtures/topdon-physical-capture -count=1 -timeout=60s

      - name: Require authenticated BLE transport after interval refusal
        run: python3 .github/scripts/test-ble-interval-transport.py "$RUNNER_TEMP/ble-interval-transport"
      - name: Retain BLE interval transport evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ble-interval-transport
          path: ${{ runner.temp }}/ble-interval-transport
          if-no-files-found: ignore
          retention-days: 7

      - name: Require actual serial disconnect and retry classification
        timeout-minutes: 10
        env:
          GOFLAGS: '-gcflags=all=-c=1 -vet=off'
        run: python3 .github/scripts/test-serial-disconnect.py "$RUNNER_TEMP/serial-disconnect"
      - name: Require sensor tenant identity and certificate policy over real TLS
        timeout-minutes: 7
        env:
          GOFLAGS: '-gcflags=all=-c=1 -vet=off'
        run: |
          python3 .github/scripts/test-sensor-asset-identity.py "$RUNNER_TEMP/sensor-asset-identity"
          python3 .github/scripts/test-mldsa-policy-transport.py "$RUNNER_TEMP/mldsa-policy-transport"
      - name: Retain serial disconnect evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: serial-and-sensor-transport
          path: |
            ${{ runner.temp }}/serial-disconnect/*.log
            ${{ runner.temp }}/serial-disconnect/sources.json
            ${{ runner.temp }}/sensor-asset-identity/*.log
            ${{ runner.temp }}/sensor-asset-identity/evidence.json
            ${{ runner.temp }}/mldsa-policy-transport/*.log
            ${{ runner.temp }}/mldsa-policy-transport/evidence.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Require first-boot driver reconnect and target guards
        run: python3 .github/scripts/test-firstboot-driver-transport.py --output "$RUNNER_TEMP/firstboot-driver-transport"
      - name: Retain first-boot driver transport evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firstboot-driver-transport
          path: ${{ runner.temp }}/firstboot-driver-transport
          if-no-files-found: ignore
          retention-days: 7

      - name: Require delayed first-boot enrollment and its regression control
        run: python3 .github/scripts/test-firstboot-enrollment.py --output "$RUNNER_TEMP/firstboot-enrollment"

      - name: Retain first-boot enrollment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firstboot-enrollment
          path: ${{ runner.temp }}/firstboot-enrollment
          if-no-files-found: ignore
          retention-days: 7

      - name: Require bounded job supervision and transport recovery
        run: bash .github/scripts/test-job-supervisor-lifetime.sh "$RUNNER_TEMP/job-supervisor-lifetime"

      - name: Fuzz stream boundaries and sparse flash ranges
        run: |
          go test ./go/internal/episodeexport -run '^$' -fuzz '^FuzzH264ChunkBoundaries$' -fuzztime=10s -parallel=2
          go test ./go/internal/cli/tegraflash/t234 -run '^$' -fuzz '^FuzzStaleExtentsPreserveWrittenBytes$' -fuzztime=10s -parallel=2

      - name: Check camera DHCP lifecycle and migration
        # Privileged kernel fixtures run only for repository-owned branches.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: go
        run: |
          go test -c -o "$RUNNER_TEMP/ipcam.test" ./internal/agent/ipcam
          sudo unshare --mount --net --propagation private sh -eu -c '
            # Carrier reads must see the interfaces in this network namespace.
            mount -t sysfs -o ro,nosuid,nodev,noexec sysfs /sys
            # Packet fixtures put both veth ends in this disposable namespace.
            sysctl -qw net.ipv4.conf.all.accept_local=1 \
              net.ipv4.conf.all.rp_filter=0 net.ipv4.conf.default.rp_filter=0
            export WENDY_TEST_NETNS=1
            exec "$1" -test.run "^TestDHCPLinux" -test.v -test.timeout 120s
          ' sh "$RUNNER_TEMP/ipcam.test"

      - name: Check runtime skill packaging
        run: python3 scripts/sync-agent-skills.py --check

      - name: Check public ChatGPT package
        run: |
          python3 scripts/test-package-chatgpt-plugin.py
          python3 scripts/package-chatgpt-plugin.py --check

  containerd-regressions:
    name: Containerd lifecycle, DNS and resource regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-go-ci
        with:
          cache-name: containerd-regressions
      - name: Compile integration tests
        env:
          CGO_ENABLED: '0'
        run: |
          go test -c -o "$RUNNER_TEMP/containerd.test" ./go/internal/agent/containerd
          go test -c -o "$RUNNER_TEMP/rtps.test" ./go/internal/rtps
          go build -trimpath -o "$RUNNER_TEMP/memory-workload" ./.github/ci-tests/memory-budget
      - name: Compile CDI provisioning and restart negative controls
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('go/internal/agent/containerd/client.go').resolve()
          text = source.read_text()
          root = Path(os.environ['RUNNER_TEMP'])
          changes = {
              'cdi-display-omitted': ('return appCfg.HasEntitlement(appconfig.EntitlementDisplay) && boardDetect().IsJetson()', 'return false'),
              'cdi-refresh-omitted': ('c.refreshNvidiaCDIForStart(ctx, container, appName, containerLabels)', '// regression mutation: retain stale driver mounts'),
              'device-refresh-omitted': ('refresh := localoci.RefreshHostDeviceNumbers(&spec)', 'refresh := localoci.DeviceRefresh{}'),
          }
          for name, (old, new) in changes.items():
              assert text.count(old) == 1, name
              mutation = root / (name + '.go')
              mutation.write_text(text.replace(old, new))
              (root / (name + '.json')).write_text(json.dumps({'Replace': {str(source): str(mutation)}}))
          PY
          for mutation in cdi-display-omitted cdi-refresh-omitted device-refresh-omitted; do
            go test -overlay "$RUNNER_TEMP/$mutation.json" -c -o "$RUNNER_TEMP/$mutation.test" ./go/internal/agent/containerd
          done
      - name: Compile the uncapped-swap negative control
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('go/internal/agent/oci/resources.go').resolve()
          text = source.read_text()
          needle = 'Limit: memBytes, Swap: memBytes'
          assert text.count(needle) == 1
          root = Path(os.environ['RUNNER_TEMP'])
          mutation = root / 'memory-uncapped.go'
          mutation.write_text(text.replace(needle, 'Limit: memBytes'))
          (root / 'memory-overlay.json').write_text(json.dumps({'Replace': {str(source): str(mutation)}}))
          PY
          go test -overlay "$RUNNER_TEMP/memory-overlay.json" -c -o "$RUNNER_TEMP/memory-uncapped.test" ./go/internal/agent/containerd
      - name: Compile the pinned-upstream negative control
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('go/internal/agent/containerd/host_dns.go').resolve()
          text = source.read_text()
          old = 'nameserver 127.0.0.53'
          assert text.count(old) == 1
          root = Path(os.environ['RUNNER_TEMP'])
          mutation = root / 'host_dns_pinned.go'
          mutation.write_text(text.replace(old, 'nameserver 192.0.2.53'))
          (root / 'host-dns-overlay.json').write_text(json.dumps({'Replace': {str(source): str(mutation)}}))
          PY
          go test -overlay "$RUNNER_TEMP/host-dns-overlay.json" -c -o "$RUNNER_TEMP/host-dns-pinned.test" ./go/internal/agent/containerd
      - name: Extract both runtimes without replacing the runner daemon
        id: runtimes
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update --error-on=any
          sudo apt-get install -y systemd-resolved dbus iproute2 util-linux libusb-1.0-0-dev libasound2-dev pkg-config qemu-system-x86 qemu-utils e2fsprogs
          root="$RUNNER_TEMP/wendy-runtime"
          mkdir -p "$root/common"
          (
            cd "$root/common"
            apt-get download runc busybox-static
            for package in ./*.deb; do dpkg-deb --extract "$package" root; done
          )
          for runtime_version in 1.7 current; do
            package=containerd
            if [[ "$runtime_version" == 1.7 ]]; then package=containerd=1.7.12-0ubuntu4; fi
            mkdir -p "$root/$runtime_version"
            (
              cd "$root/$runtime_version"
              apt-get download "$package"
              for archive in ./*.deb; do dpkg-deb --extract "$archive" root; done
            )
          done
      - name: Require lifecycle, DNS, DDS and memory checks on both runtimes
        run: bash .github/scripts/test-containerd-versions.sh
      - name: Require real Compose watch sessions and regression controls
        timeout-minutes: 15
        run: |
          bash .github/scripts/prepare-watch-container.sh "$RUNNER_TEMP/watch-container"
          bash .github/scripts/prepare-multiapp-lifecycle.sh "$RUNNER_TEMP/watch-container"
          runtime="$RUNNER_TEMP/wendy-runtime/current/root"
          common="$RUNNER_TEMP/wendy-runtime/common/root"
          runtime_path="$runtime/usr/bin:$runtime/usr/sbin:$runtime/bin:$runtime/sbin:$common/usr/bin:$common/usr/sbin:$common/bin:$common/sbin:$PATH"
          for case_name in normal forced-detach restart-sibling multiapp-normal early-readiness ignored-service-env retained-isolation; do
            sudo env PATH="$runtime_path" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
              bash .github/scripts/test-watch-container.sh "$RUNNER_TEMP/containerd.test" "$RUNNER_TEMP/watch-container" "$case_name"
          done
      - name: Preserve Compose watch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: watch-container
          path: ${{ runner.temp }}/watch-container/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare real ROS scope image and regression controls
        run: |
          python3 .github/scripts/ros_scope_runtime_test.py
          python3 .github/scripts/prepare-ros-scope-runtime.py --output "$RUNNER_TEMP/ros-scopes"
      - name: Require actual DDS visibility for network and peripheral scopes
        run: |
          runtime="$RUNNER_TEMP/wendy-runtime/current/root"
          common="$RUNNER_TEMP/wendy-runtime/common/root"
          runtime_path="$runtime/usr/bin:$runtime/usr/sbin:$runtime/bin:$runtime/sbin:$common/usr/bin:$common/usr/sbin:$common/bin:$common/sbin:$PATH"
          for case_name in normal old-loopback fail-open-routes; do
            binary="$RUNNER_TEMP/ros-scopes/$case_name.test"
            if [[ $case_name == normal ]]; then binary="$RUNNER_TEMP/containerd.test"; fi
            sudo env PATH="$runtime_path" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
              bash .github/scripts/test-ros-scope-runtime.sh "$binary" "$RUNNER_TEMP/ros-scopes" "$case_name"
          done
      - name: Preserve ROS scope visibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ros-scope-runtime
          path: |
            ${{ runner.temp }}/ros-scopes/*.log
            ${{ runner.temp }}/ros-scopes/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove exported ROS fixture image and controls
        if: always()
        run: rm -f "$RUNNER_TEMP/ros-scopes/ros-image.tar" "$RUNNER_TEMP/ros-scopes/old-loopback.test" "$RUNNER_TEMP/ros-scopes/fail-open-routes.test"
      - name: Require real kernel driver install, replacement, rollback and reboot
        if: ${{ !cancelled() && steps.runtimes.outcome == 'success' }}
        timeout-minutes: 30
        run: python3 .github/scripts/test-driver-lifecycle-vm.py --work-parent "$RUNNER_TEMP" --output "$RUNNER_TEMP/driver-lifecycle-vm"
      - name: Preserve driver lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: driver-lifecycle-vm
          path: ${{ runner.temp }}/driver-lifecycle-vm
          if-no-files-found: ignore
          retention-days: 7
      - name: Require rootful ESP-IDF generated-file ownership
        timeout-minutes: 35
        run: python3 .github/scripts/test-esp-idf-ownership.py --output "$RUNNER_TEMP/esp-idf-ownership"
      - name: Preserve ESP-IDF ownership evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: esp-idf-ownership
          path: ${{ runner.temp }}/esp-idf-ownership
          if-no-files-found: ignore
          retention-days: 7

  linux-install-host:
    name: Linux install safety
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-go-ci
        with:
          cache-name: install-host
      - name: Install disposable block-device tools
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y dosfstools e2fsprogs parted util-linux udev libasound2-dev libusb-1.0-0-dev pkg-config musl-tools ruby ruby-dev build-essential rpm cpio libarchive-tools systemd-container curl bzip2 python3-yaml
          sudo gem install fpm -v 1.18.0 --no-document
      - name: Verify native Make VERSION in the built CLI
        run: python3 .github/scripts/test-native-make-version.py --retain-binary "$RUNNER_TEMP/wendy-stagefile-cli"
      - name: Build and execute inherited Stagefiles with both packaged backends
        run: python3 .github/scripts/test-stagefile-images.py "$RUNNER_TEMP/wendy-stagefile-cli" --output "$RUNNER_TEMP/stagefile-images"
      - name: Preserve Stagefile execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stagefile-images-pr
          path: ${{ runner.temp }}/stagefile-images
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove retained fixture CLI
        if: always()
        run: rm -f "$RUNNER_TEMP/wendy-stagefile-cli"
      - name: Compile host fixtures
        run: |
          go test -c -o "$RUNNER_TEMP/install.test" ./go/internal/cli/commands
          go test -c -o "$RUNNER_TEMP/t234.test" ./go/internal/cli/tegraflash/t234
      - name: Require loop-device and actual sudo ownership regressions
        shell: bash
        env:
          WENDY_INSTALL_HOST_TESTS: '1'
        run: |
          "$RUNNER_TEMP/install.test" -test.run '^(TestInstallLoopRetriesDelayedPartitionDiscovery|TestInstallLoopReconnectNeverWritesReplacementDisk|TestSudoHandBackRealOwnership)$' -test.v -test.count=1 -test.timeout=180s | tee "$RUNNER_TEMP/install-host.log"
          for test in TestInstallLoopRetriesDelayedPartitionDiscovery TestInstallLoopReconnectNeverWritesReplacementDisk TestSudoHandBackRealOwnership; do
            grep -q "^--- PASS: $test " "$RUNNER_TEMP/install-host.log"
          done
      - name: Require exclusive recovery writer access on a mounted loop disk
        shell: bash
        run: |
          sudo env WENDY_TEST_LOOP_DEVICES=1 "$RUNNER_TEMP/t234.test" -test.run '^TestRawWriterExclusiveMountedPartition$' -test.v -test.count=1 -test.timeout=120s | tee "$RUNNER_TEMP/recovery-host.log"
          grep -q '^--- PASS: TestRawWriterExclusiveMountedPartition ' "$RUNNER_TEMP/recovery-host.log"
      - name: Verify package artifact and guest cleanup controls
        run: |
          python3 .github/scripts/installed_linux_packages_test.py
          python3 .github/scripts/installed_linux_package_guests_test.py
      - name: Require a clean native runtime guest build and executable tools
        run: python3 .github/scripts/test-runtime-guest-bootstrap.py --output "$RUNNER_TEMP/runtime-bootstrap"
      - name: Preserve runtime bootstrap evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-bootstrap-pr
          path: ${{ runner.temp }}/runtime-bootstrap
          if-no-files-found: ignore
          retention-days: 7
      - name: Require native Agent package upgrades on Ubuntu and Fedora
        run: bash .github/scripts/test-linux-packages-pr.sh "$RUNNER_TEMP/package-regressions"
      - name: Preserve package upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installed-linux-packages-pr
          path: ${{ runner.temp }}/package-regressions
          if-no-files-found: ignore
          retention-days: 7

  network-regressions:
    name: Linux network regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-go-ci
        with:
          cache-name: network-regressions
      - name: Install network fixture dependencies
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y avahi-daemon iproute2 iptables dnsmasq-base iputils-ping util-linux libasound2-dev libusb-1.0-0-dev pkg-config lsof
      - name: Install USB profile dependencies with isolated service policy
        run: sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 .github/scripts/install-usb-profile-dependencies.py "$RUNNER_TEMP/usb-profile-dependencies"
      - name: Require stale Bluetooth bond recovery over private D-Bus
        run: bash .github/scripts/test-stale-bond-dbus.sh "$RUNNER_TEMP/stale-bond-dbus"
      - name: Require GATT disconnect wakeup and connection ownership
        run: bash .github/scripts/test-gatt-disconnect-dbus.sh "$RUNNER_TEMP/gatt-disconnect-dbus"
      - name: Preserve GATT disconnect evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gatt-disconnect-dbus
          path: ${{ runner.temp }}/gatt-disconnect-dbus/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Require native Linux SO-101 reader regressions
        run: python3 .github/scripts/run-so101-reader-regressions.py
      - name: Compile both packet backends with the race detector
        run: go test -race -c -o "$RUNNER_TEMP/packet-backends.test" ./go/internal/cli/netmesh
      - name: Require identical tenant and route behavior
        shell: bash
        run: |
          set -o pipefail
          sudo .github/scripts/test-packet-backends.sh "$RUNNER_TEMP/packet-backends.test" | tee "$RUNNER_TEMP/packet-backends.log"
          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/packet-backends.log"; then exit 1; fi
          for backend in userspace kernel; do
            grep -q -- "--- PASS: TestPacketBackendContract/$backend " "$RUNNER_TEMP/packet-backends.log"
          done
      - name: Prove tenant admission and route withdrawal assertions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          kernel = Path('go/internal/agent/localmesh/kernel_linux.go').resolve()
          guard = '\tif !peer.IsValid() || peer.Tenant() != k.device.Tenant() {\n\t\treturn nil, errors.New("mesh peer is outside the network tenant")\n\t}\n'
          text = kernel.read_text()
          assert text.count(guard) == 1
          variants = [('tenant', kernel, text.replace(guard, ''))]
          userspace = Path('go/internal/cli/netmesh/network.go').resolve()
          text = userspace.read_text()
          needle = '\tn.routes = next\n'
          assert text.count(needle) == 1
          retain = '\tfor address, id := range n.routes { if _, ok := next[address]; !ok { next[address] = id } }\n'
          variants.append(('withdrawal', userspace, text.replace(needle, retain + needle)))
          for name, source, text in variants:
              mutated = root / (name + '-mutation.go')
              mutated.write_text(text)
              (root / (name + '-overlay.json')).write_text(json.dumps({'Replace': {str(source): str(mutated)}}))
          PY
          for mutation in tenant withdrawal; do
            go test -race -overlay="$RUNNER_TEMP/$mutation-overlay.json" -c -o "$RUNNER_TEMP/$mutation.test" ./go/internal/cli/netmesh
            if sudo .github/scripts/test-packet-backends.sh "$RUNNER_TEMP/$mutation.test" 2>&1 | tee "$RUNNER_TEMP/$mutation.log"; then
              echo "$mutation mutation unexpectedly passed" >&2
              exit 1
            fi
          done
          grep -q 'foreign tenant acquired a packet port' "$RUNNER_TEMP/tenant.log"
          grep -q 'unrouted packet reached carrier: withdrawn' "$RUNNER_TEMP/withdrawal.log"

      - name: Compile real multicast receiver with the race detector
        run: go test -race -c -o "$RUNNER_TEMP/multicast.test" ./go/internal/agent/timesync
      - name: Require delivery across interface hotplug and removal
        shell: bash
        run: |
          set -o pipefail
          sudo .github/scripts/test-multicast-interfaces.sh "$RUNNER_TEMP/multicast.test" | tee "$RUNNER_TEMP/multicast.log"
          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/multicast.log"; then exit 1; fi
          grep -q '^--- PASS: TestMulticastInterfaceLifecycle ' "$RUNNER_TEMP/multicast.log"
      - name: Prove the fixture rejects startup-only subscriptions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('go/internal/agent/timesync/multicast.go').resolve()
          text = source.read_text()
          needle = 'func (m *Manager) refreshMulticast(conn multicastPacketConn, group net.Addr, joined map[int]net.Interface) {'
          assert text.count(needle) == 1
          mutated = Path(os.environ['RUNNER_TEMP']) / 'multicast-startup-only.go'
          mutated.write_text(text.replace(needle, needle + '\nif len(joined) > 0 { return }'))
          overlay = Path(os.environ['RUNNER_TEMP']) / 'multicast-overlay.json'
          overlay.write_text(json.dumps({'Replace': {str(source): str(mutated)}}))
          PY
          go test -race -overlay="$RUNNER_TEMP/multicast-overlay.json" -c -o "$RUNNER_TEMP/multicast-startup-only.test" ./go/internal/agent/timesync
          if sudo .github/scripts/test-multicast-interfaces.sh "$RUNNER_TEMP/multicast-startup-only.test" 2>&1 | tee "$RUNNER_TEMP/multicast-startup-only.log"; then
            echo 'Startup-only multicast subscriptions unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'multicast proof never arrived on time2' "$RUNNER_TEMP/multicast-startup-only.log"
          grep -q '^--- FAIL: TestMulticastInterfaceLifecycle ' "$RUNNER_TEMP/multicast-startup-only.log"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Main immediately before #2579. Compile its real ownership and
          # cleanup paths unchanged to prove warm rollback compatibility.
          ref: ceef5cfa15f6739b04559a365a617e1dd287ae47
          path: .ci/operator-baseline
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Original rollback baseline documented with the kernel fixture.
          ref: 581bff3a8aeb368680f346a9785934eef14848d7
          path: .ci/operator-original-baseline
          persist-credentials: false
      - name: Compile current and pre-operator agent paths
        run: |
          test "$(git -C .ci/operator-baseline rev-parse HEAD)" = ceef5cfa15f6739b04559a365a617e1dd287ae47
          test "$(git -C .ci/operator-original-baseline rev-parse HEAD)" = 581bff3a8aeb368680f346a9785934eef14848d7
          go test -c -o "$RUNNER_TEMP/operator-current.test" ./go/internal/agent/localmesh
          for baseline in operator-baseline operator-original-baseline; do
            (
              cd ".ci/$baseline"
              go test -c -o "$RUNNER_TEMP/$baseline.test" ./go/internal/agent/localmesh
              test -z "$(git status --porcelain)"
            )
          done
      - name: Require live registry and management connection lifetimes
        run: bash .github/scripts/test-management-lifetime.sh "$RUNNER_TEMP/management-lifetime"
      - name: Require Cloud notification identity, retry and redaction contracts
        run: bash .github/scripts/test-cloud-notification-contract.sh
      - name: Require live relay traffic through stalled renewal and path changes
        run: bash .github/scripts/test-relay-path-traffic.sh "$RUNNER_TEMP/relay-path-traffic"
      - name: Require explicit disconnect intent across native process restarts
        run: bash .github/scripts/test-operator-native-restart.sh "$RUNNER_TEMP/operator-native-restart"
      - name: Require cold broker recovery and retained spare carrier traffic
        run: bash .github/scripts/test-operator-spare-recovery.sh "$RUNNER_TEMP/operator-spare-recovery"
      - name: Require persisted clock trust and packet expiry across restarts
        run: bash .github/scripts/test-clock-packet-restart.sh "$RUNNER_TEMP/clock-packet-restart"
      - name: Require service publication recovery through renewed identities
        run: bash .github/scripts/test-service-packet-recovery.sh "$RUNNER_TEMP/service-packet-recovery"
      - name: Preserve service publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: service-packet-recovery
          path: ${{ runner.temp }}/service-packet-recovery
          if-no-files-found: ignore
          retention-days: 7
      - name: Require publication-loss recovery through an alternate supplier
        run: bash .github/scripts/test-publication-loss-packets.sh "$RUNNER_TEMP/publication-loss-packets"
      - name: Preserve alternate publication recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publication-loss-packets
          path: ${{ runner.temp }}/publication-loss-packets
          if-no-files-found: ignore
          retention-days: 7
      - name: Require full-duration chunk stall recovery over TCP and disk
        run: bash .github/scripts/test-chunk-stall-transport.sh "$RUNNER_TEMP/chunk-stall-transport"
      - name: Require elevated cache and session broker ownership boundaries
        run: bash .github/scripts/test-chunk-stall-ownership.sh "$RUNNER_TEMP/chunk-stall-ownership"
      - name: Require link-local traffic across competing interface routes
        run: bash .github/scripts/test-linklocal-multi-interface.sh "$RUNNER_TEMP/linklocal-multi-interface"
      - name: Require USB profile migration across recreated interfaces
        run: bash .github/scripts/test-usb-profile-namespace.sh "$RUNNER_TEMP/usb-profile-namespace"
      - name: Require broker uplink migration after active sessions drain
        run: bash .github/scripts/test-broker-uplink-namespace.sh "$RUNNER_TEMP/broker-uplink"
      - name: Preserve transfer and interface recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: transfer-interface-recovery
          path: |
            ${{ runner.temp }}/stale-bond-dbus/*.log
            ${{ runner.temp }}/chunk-stall-transport/*.log
            ${{ runner.temp }}/chunk-stall-ownership/*.log
            ${{ runner.temp }}/linklocal-multi-interface/*.log
            ${{ runner.temp }}/broker-uplink/*.log
            ${{ runner.temp }}/usb-profile-namespace/**/*.log
            ${{ runner.temp }}/usb-profile-namespace/**/*.json
            ${{ runner.temp }}/usb-profile-dependencies/*.log
            ${{ runner.temp }}/usb-profile-dependencies/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Require slow gateway lease continuation through controller steps
        timeout-minutes: 10
        run: |
          python3 .github/scripts/prepare-sharing-slow-lease.py "$RUNNER_TEMP/sharing-slow-lease"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT .github/scripts/test-sharing-slow-lease.sh "$RUNNER_TEMP/sharing-slow-lease/normal.test" "$RUNNER_TEMP/sharing-slow-lease/control.test" "$RUNNER_TEMP/sharing-slow-lease"
      - name: Retain slow gateway lease evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sharing-slow-lease
          path: |
            ${{ runner.temp }}/sharing-slow-lease/*.log
            ${{ runner.temp }}/sharing-slow-lease/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Require RTPS packets to stay on joined interfaces
        timeout-minutes: 5
        run: bash .github/scripts/test-rtps-multicast-isolation.sh "$RUNNER_TEMP/rtps-multicast-isolation"
      - name: Retain RTPS interface packet evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rtps-multicast-isolation
          path: |
            ${{ runner.temp }}/rtps-multicast-isolation/*.log
            ${{ runner.temp }}/rtps-multicast-isolation/source.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Require wired-only automatic ROS discovery
        run: bash .github/scripts/test-ros-discovery-policy.sh "$RUNNER_TEMP/ros-discovery-policy"
      - name: Require TLS UDP admission and recovery under a stalled stream
        run: bash .github/scripts/test-tls-udp-admission.sh "$RUNNER_TEMP/tls-udp-admission"
      - name: Require duplicate rejection with an incumbent forwarding route
        shell: bash
        run: |
          set -o pipefail
          sudo .github/scripts/test-packet-backends.sh "$RUNNER_TEMP/operator-current.test" TestDuplicateCarrierPreservesLiveRoute | tee "$RUNNER_TEMP/duplicate-route.log"
          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/duplicate-route.log"; then exit 1; fi
          grep -q '^--- PASS: TestDuplicateCarrierPreservesLiveRoute ' "$RUNNER_TEMP/duplicate-route.log"
      - name: Prove rejection happens before routing publication
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          source = Path('go/internal/agent/localmesh/node.go').resolve()
          text = source.read_text()
          guard = '\tif !connectionReadyForCarrier(ctx, peer, cost, func() { _ = link.Close() }) {\n\t\treturn nil\n\t}\n'
          bind = '\tBindConnectionLink(ctx, p.id, p.cost, p.signalCapacityRetire)\n'
          assert text.count(guard) == 1 and text.count(bind) == 1
          # Reproduce the original ordering: publish a link before arbitration.
          mutated = root / 'duplicate-late-admission.go'
          mutated.write_text(text.replace(guard, '').replace(bind, guard + bind))
          (root / 'duplicate-late-admission.json').write_text(json.dumps({'Replace': {str(source): str(mutated)}}))
          PYCODE
          go test -overlay="$RUNNER_TEMP/duplicate-late-admission.json" -c -o "$RUNNER_TEMP/duplicate-late-admission.test" ./go/internal/agent/localmesh
          if sudo .github/scripts/test-packet-backends.sh "$RUNNER_TEMP/duplicate-late-admission.test" TestDuplicateCarrierPreservesLiveRoute 2>&1 | tee "$RUNNER_TEMP/duplicate-late-admission.log"; then
            echo 'Late duplicate arbitration unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'rejected duplicate published a routing link' "$RUNNER_TEMP/duplicate-late-admission.log"
          grep -q '^--- FAIL: TestDuplicateCarrierPreservesLiveRoute ' "$RUNNER_TEMP/duplicate-late-admission.log"
      - name: Require operator routing, warm rollback and DNS cleanup
        shell: bash
        run: |
          set -o pipefail
          for baseline in operator-baseline operator-original-baseline; do
            sudo .github/scripts/test-operator-policy.sh "$RUNNER_TEMP/operator-current.test" "$RUNNER_TEMP/$baseline.test" | tee "$RUNNER_TEMP/$baseline.log"
            if grep -q -- '--- SKIP:' "$RUNNER_TEMP/$baseline.log"; then
              echo 'Required operator policy coverage skipped a case' >&2
              exit 1
            fi
            for name in TestKernelOperatorPolicyIsolatedNamespace TestKernelOperatorWarmRollbackIsolatedNamespace TestHostDNSPolicyCleanupAcrossMountNamespace; do
              grep -q "^--- PASS: $name " "$RUNNER_TEMP/$baseline.log"
            done
          done

      - name: Require real native TLS listener drain and Lite carrier attachment
        shell: bash
        run: |
          set -o pipefail
          for name in TestNormalNativeTLSListenerAttachmentAndDrain TestNormalNativeTLSLANDialsLitePeer; do
            sudo .github/scripts/test-packet-backends.sh "$RUNNER_TEMP/operator-current.test" "$name" | tee "$RUNNER_TEMP/$name.log"
            if grep -q -- '--- SKIP:' "$RUNNER_TEMP/$name.log"; then exit 1; fi
            grep -q "^--- PASS: $name " "$RUNNER_TEMP/$name.log"
          done
      - name: Retain native carrier attachment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-carrier-attachment
          path: ${{ runner.temp }}/TestNormalNativeTLS*.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wendylabsinc/WendyOS-Builder
          ref: 954d4e8680c3e5ef6c5fc7b6179902149cebd830
          path: .ci/hostname-builder
          persist-credentials: false
      - name: Compile the actual rename and startup paths
        run: go test -c -o "$RUNNER_TEMP/hostname.test" ./go/internal/agent/configpartition
      - name: Require hostname and wire advertisement after process restart
        shell: bash
        run: |
          set -o pipefail
          sudo .github/scripts/test-hostname-restart.sh "$RUNNER_TEMP/hostname.test" "$PWD/.ci/hostname-builder" | tee "$RUNNER_TEMP/hostname-restart.log"
          grep -q '^--- PASS: TestDeviceNameRestartIntegration ' "$RUNNER_TEMP/hostname-restart.log"

  darwin-install-host:
    name: macOS CLI and device regressions
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require native macOS SO-101 reader regressions
        run: python3 .github/scripts/run-so101-reader-regressions.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test direct and nested USB disk discovery
        shell: bash
        run: |
          go test ./go/internal/cli/tegraflash/t234 -v -count=1 -timeout 120s | tee "$RUNNER_TEMP/disk-discovery.log"
          grep -q '^--- PASS: TestParseUMSDisksNestedHub ' "$RUNNER_TEMP/disk-discovery.log"
          grep -q '^--- PASS: TestParseUMSDisksDirect ' "$RUNNER_TEMP/disk-discovery.log"
      - name: Install CLI native dependencies
        run: brew install libusb pkg-config
      - name: Verify native Make VERSION in the built CLI
        run: python3 .github/scripts/test-native-make-version.py
      - name: Compile raw-device and target-scoped preparation tests
        run: go test -c -o "$RUNNER_TEMP/install.test" ./go/internal/cli/commands
      - name: Require disposable disk image regressions
        shell: bash
        run: |
          sudo env WENDY_E2E_DISKIMAGE=1 "$RUNNER_TEMP/install.test" -test.run '^(TestRelocateGPTDarwinRawDiskImage|TestMarkFATVolumes_DiskImage|TestStopTargetIndexing|TestStopTargetIndexingNoMountedFAT|TestUnmountDarwinDisk)$' -test.v -test.count=1 -test.timeout=180s | tee "$RUNNER_TEMP/install-host.log"
          for test in TestRelocateGPTDarwinRawDiskImage TestMarkFATVolumes_DiskImage TestStopTargetIndexing TestStopTargetIndexingNoMountedFAT TestUnmountDarwinDisk; do
            grep -q "^--- PASS: $test " "$RUNNER_TEMP/install-host.log"
          done
      - name: Require native resolver and stale discovery cache regressions
        run: bash .github/scripts/test-darwin-discovery.sh

  native-app-regressions:
    name: Native app regressions (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.5'
      - name: Install native build dependencies
        run: brew install xcodegen pkg-config libusb cmake ninja
      - name: Build and test native app
        env:
          APP_PLATFORM: ${{ matrix.platform }}
        run: bash .github/scripts/test-native-app.sh "$APP_PLATFORM"
      - name: Require CLI enrollment through production Mac provisioning
        if: matrix.platform == 'macos'
        timeout-minutes: 25
        run: |
          python3 .github/scripts/run-owned-media-test.py --timeout 600 -- go build -o "$RUNNER_TEMP/mac-enrollment-cli" ./go/cmd/wendy
          bash .github/scripts/test-mac-enrollment.sh "$RUNNER_TEMP/mac-enrollment" "$RUNNER_TEMP/mac-enrollment-swift-core" "$RUNNER_TEMP/mac-enrollment-cli"
      - name: Retain Mac enrollment evidence
        if: always() && matrix.platform == 'macos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mac-enrollment
          path: |
            ${{ runner.temp }}/mac-enrollment/build.log
            ${{ runner.temp }}/mac-enrollment/runtime.log
            ${{ runner.temp }}/mac-enrollment/evidence.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise WendyNotify HTTP and private notification socket
        if: matrix.platform == 'macos'
        timeout-minutes: 15
        run: swift test --package-path Examples/WendyNotify
      - name: Exercise thermal metadata, freshness and notification thresholds
        if: matrix.platform == 'macos'
        timeout-minutes: 15
        run: swift test --package-path Examples/ThermalNotify --force-resolved-versions
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-app-results-${{ matrix.platform }}
          path: go/macos/Build/RegressionResults.xcresult
          if-no-files-found: warn

  media-regressions:
    name: Linux media regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-go-ci
        with:
          cache-name: media-regressions
      - name: Install camera and GStreamer fixture dependencies
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y "linux-headers-$(uname -r)" build-essential libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools strace libasound2-dev libusb-1.0-0-dev libegl-dev libgles-dev alsa-utils pipewire-bin libspa-0.2-modules patch libelf-dev gcc-13 python3-venv
          python3 .github/scripts/prepare-hosted-audio-modules.py
          grep -qx 'WENDY_HOSTED_AUDIO=unavailable' "$GITHUB_ENV" || modinfo snd-aloop
          gst-inspect-1.0 fakesrc
          gst-inspect-1.0 fdsink
      - name: Compile the physical EGL probe and reject software fallback
        shell: bash
        run: |
          gcc -std=c11 -Wall -Wextra -Werror .github/regression-coverage/manual/fixtures/jetson-display/main.c -o "$RUNNER_TEMP/display-probe" -lEGL -lGLESv2
          if timeout 20 "$RUNNER_TEMP/display-probe" > "$RUNNER_TEMP/display-probe.log" 2>&1; then
            echo 'CPU-only runner unexpectedly passed NVIDIA EGL verification' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/display-probe.log"
          grep -q '^Starting display-only NVIDIA EGL probe$' "$RUNNER_TEMP/display-probe.log"
          grep -Eq '^FAIL: (no EGL devices|no NVIDIA EGL display)' "$RUNNER_TEMP/display-probe.log"
          if grep -q '^PASS:' "$RUNNER_TEMP/display-probe.log"; then exit 1; fi
      # Match the WendyOS 0.15.4 ABI; Ubuntu's older package has different ioctls.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: v4l2loopback/v4l2loopback
          ref: 0f9ee86760b7f2bea174b7e3e7a1d38845da0ab4
          path: .ci-v4l2loopback
          persist-credentials: false
      - name: Check out the exact Builder module candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wendylabsinc/WendyOS-Builder
          ref: 4828717a29aa3e7d3b183c6683155337957af39f
          path: .ci-loopback-builder
          sparse-checkout: recipes-kernel/v4l2loopback
          persist-credentials: false
      - name: Build and load WendyOS loopback ABI
        id: loopback-module
        run: |
          set -euo pipefail
          loopback_revision="$(git -C .ci-v4l2loopback rev-parse HEAD)"
          if [[ "$loopback_revision" != 0f9ee86760b7f2bea174b7e3e7a1d38845da0ab4 ]]; then
            echo "::error::Unexpected v4l2loopback source revision: $loopback_revision"
            exit 1
          fi
          git -C .ci-v4l2loopback diff --exit-code HEAD --
          # The pinned release's Git checkout includes this development marker.
          # It makes MODULE_VERSION a git-describe snapshot instead of
          # the canonical 0.15.4 header version. Remove only the marker, as in
          # upstream's release tarball; keep the exact source and ABI guard.
          rm -- .ci-v4l2loopback/.gitversion
          make -C .ci-v4l2loopback
          loopback_version="$(modinfo -F version .ci-v4l2loopback/v4l2loopback.ko)"
          if [[ "$loopback_version" != 0.15.4 ]]; then
            echo "::error::Expected built v4l2loopback version 0.15.4; got <$loopback_version>"
            exit 1
          fi
          sudo modprobe videodev
          sudo insmod .ci-v4l2loopback/v4l2loopback.ko devices=0 exclusive_caps=1
          echo 'loaded=true' >> "$GITHUB_OUTPUT"
          sudo udevadm settle
          test -c /dev/v4l2loopback
      - name: Require original failure and Builder candidate queue recovery
        timeout-minutes: 8
        env:
          WENDY_LOOPBACK_JOB_OWNED: ${{ steps.loopback-module.outputs.loaded == 'true' && '1' || '0' }}
        run: bash .github/scripts/test-v4l2-output-queue-module.sh .ci-v4l2loopback .ci-loopback-builder
      - name: Preserve module comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: v4l2-output-queue
          path: |
            ${{ runner.temp }}/wendy-output-queue.*/*.log
            ${{ runner.temp }}/wendy-output-queue.*/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Decode authenticated Lite camera frames through the kernel node
        run: bash .github/scripts/test-lite-camera-loopback.sh
      - name: Exercise the remove ioctl and require execution
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          go test -c -o "$RUNNER_TEMP/ipcam.test" ./go/internal/agent/ipcam
          sudo "$RUNNER_TEMP/ipcam.test" -test.run '^TestLoopbackNodeRemoveDeletesTheNode$' -test.v -test.count=1 -test.timeout=60s | tee "$RUNNER_TEMP/loopback.log"
          grep -q '^--- PASS: TestLoopbackNodeRemoveDeletesTheNode ' "$RUNNER_TEMP/loopback.log"

      - name: Decode H264 without a producer parser and require regression controls
        run: bash .github/scripts/test-gstreamer-no-parser.sh
      - name: Require camera pairing before ONVIF and RTSP connections
        run: bash .github/scripts/test-camera-pairing-admission.sh
      - name: Preserve 16-bit thermal samples through the real raw tap
        run: bash .github/scripts/test-thermal-raw-capture.sh
      - name: Decode shared SensorLink capture and reject loopback opens
        run: bash .github/scripts/test-sensorlink-capture.sh
      - name: Decode shared app-owned camera capture and reject camera reopens
        run: bash .github/scripts/test-shared-camera-capture.sh

      - name: Record distinct SensorLink microphones through ALSA with live PipeWire
        if: env.WENDY_HOSTED_AUDIO != 'unavailable'
        run: bash .github/scripts/test-sensorlink-audio-loopback.sh
      - name: Preserve SensorLink audio execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sensorlink-audio-loopback
          path: |
            ${{ runner.temp }}/wendy-sensorlink-audio.*/*.log
            ${{ runner.temp }}/wendy-lite-camera.*/*.log
            ${{ runner.temp }}/wendy-source-restart.*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Require actual pipeline output and shutdown
        shell: bash
        run: |
          go test -race ./go/internal/agent/services -run '^TestGStreamerInProcessRunner(_Cancellation)?$' -v -count=1 -timeout 90s | tee "$RUNNER_TEMP/gstreamer.log"
          grep -q '^--- PASS: TestGStreamerInProcessRunner ' "$RUNNER_TEMP/gstreamer.log"
          grep -q '^--- PASS: TestGStreamerInProcessRunner_Cancellation ' "$RUNNER_TEMP/gstreamer.log"

      - name: Require Go2 H264 decoding through the kernel and a camera-entitled container
        timeout-minutes: 15
        run: |
          root="$RUNNER_TEMP/go2-runtime"
          mkdir "$root"
          (
            cd "$root"
            apt-get download containerd runc busybox-static
            for archive in ./*.deb; do dpkg-deb --extract "$archive" root; done
          )
          runtime_path="$root/root/usr/bin:$root/root/usr/sbin:$root/root/bin:$root/root/sbin:$PATH"
          env PATH="$runtime_path" bash .github/scripts/test-go2-h264-loopback.sh
      - name: Preserve Go2 H264 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go2-h264-loopback
          path: ${{ runner.temp }}/wendy-go2-h264.*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Require kernel camera sample identity through model recording
        timeout-minutes: 10
        run: bash .github/scripts/test-v4l2-sample-ledger.sh
      - name: Retain kernel camera sample identity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: v4l2-sample-ledger
          path: ${{ runner.temp }}/wendy-v4l2-ledger.*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Require authenticated IP-camera pump consumer lifecycle
        run: bash .github/scripts/test-ipcam-loopback-lifecycle.sh
      - name: Preserve IP-camera lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ipcam-loopback-lifecycle
          path: ${{ runner.temp }}/wendy-ipcam-lifecycle.*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the owned fixture loopback module
        if: always() && steps.loopback-module.outputs.loaded == 'true'
        run: |
          if test -d /sys/module/v4l2loopback; then
            sudo rmmod v4l2loopback
          fi

  windows:
    name: Windows CLI
    runs-on: runs-on,runner=2cpu-linux-x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: ./.github/actions/setup-go-ci
        with:
          cache-name: windows

      # Compile the Windows-shipping CLI packages so //go:build windows files
      # (e.g. wifi_scan_windows.go) are at least type-checked in PR CI. The
      # Linux runner can't execute Windows tests, but cross-compiling them
      # catches build breaks that would otherwise only surface in the
      # release workflow. The agent intentionally is not cross-compiled —
      # it uses Linux-only syscalls and only the CLI ships to Windows.
      - name: Cross-compile Windows CLI packages
        working-directory: go
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build ./internal/cli/... ./cmd/wendy/
          go test -c -o /dev/null ./internal/cli/commands

  wasm:
    name: Browser WASM
    runs-on: runs-on,runner=2cpu-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go and Node
        uses: ./.github/actions/setup-go-ci
        with:
          cache-name: wasm

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Build browser WASM assets
        run: npm --prefix web-client run build:wasm

      # These suites use local protocol and process fixtures. They do not launch
      # Electron or contact live devices, so native install scripts are unnecessary.
      - name: Run browser bridge tests
        run: |
          npm --prefix web-client ci --ignore-scripts --no-audit --no-fund
          node --test web-client/tests/*.test.mjs

      - name: Build the web client with its resolved tooling
        working-directory: web-client
        run: npx --no-install vinext build

      - name: Run WASM tests in Node
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: '0'
        run: go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./go/cmd/wendy-web ./go/internal/cli/browserauth ./go/internal/shared/flock -count=1 -timeout 120s

  windows-telemetry:
    name: Windows native regressions
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install GNU Make for the native Windows recipe
        shell: pwsh
        run: choco install make --yes --no-progress
      - name: Verify native Make VERSION in the built CLI
        run: python .github/scripts/test-native-make-version.py

      # Native execution covers Windows identity files and process shutdown,
      # including CLI/MCP identity sharing across WENDY_CONFIG_DIR overrides.
      # Delivery tests redirect requests to local HTTP receivers.
      - name: Test portable state, schema, export and flash invariants on Windows
        run: go test ./go/internal/shared/atomicfile ./go/internal/shared/appconfig ./go/internal/episodeexport ./go/internal/cli/tegraflash/t234 -count=1 -timeout 120s

      - name: Test analytics
        working-directory: go
        run: go test ./internal/cli/analytics -count=1 -timeout 120s

      # Cross-compilation cannot catch shared file-offset corruption. Use the
      # actual Windows handle writer against a temporary image, never a drive.
      - name: Test concurrent Windows NVMe writes
        shell: bash
        run: |
          go test ./go/internal/cli/commands -run '^TestHandleWriterAtConcurrentWrites$' -v -count=3 -timeout 120s | tee "$RUNNER_TEMP/disk-writes.log"
          test "$(grep -c '^--- PASS: TestHandleWriterAtConcurrentWrites ' "$RUNNER_TEMP/disk-writes.log")" = 3

      - name: Test analytics preferences with shared identity
        working-directory: go
        run: go test ./internal/cli/commands -run '^TestAnalytics' -count=1 -timeout 120s

      - name: Test CLI and MCP telemetry delivery and shared identity
        working-directory: go
        run: go test ./cmd/wendy -run '^(TestInvocationAnalytics|TestEnablingAnalyticsReportsTheCurrentInvocation|TestHelpDoesNotCountAsProductUse)' -v -count=1 -timeout 120s

      - name: Test Windows VM setup
        working-directory: go
        shell: pwsh
        run: |
          go test ./internal/cli/vm -run '^(TestCreateWindowsDiskAndVarsAreSparse|TestFindQEMUOnWindows|TestWindowsFirmwareFollowsQEMUInstallation|TestSpecUsesWindowsQEMUPath|TestBinaryIsTheAArch64SystemEmulator)$' -v -count=1 -timeout 120s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/cli/commands -run '^(TestEnsureQEMUOnWindows|TestSimulatorWithoutDetachedSupport|TestDiscoverKeepsScanningWhenSimulatorNeedsForegroundStart|TestDiscoverSimulatorGuidanceFitsPopulatedTerminal|TestVMStorage|TestVMImageSpace|TestVMCreate)' -v -count=1 -timeout 120s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Boot packaged Windows QEMU and connect through the CLI
        shell: pwsh
        timeout-minutes: 26
        run: python .github/scripts/test-windows-vm-boot.py "$env:RUNNER_TEMP/windows-vm-boot"
      - name: Preserve Windows VM boot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-vm-boot
          path: |
            ${{ runner.temp }}/windows-vm-boot/*.log
            ${{ runner.temp }}/windows-vm-boot/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Test pending Windows serial I/O and close races
        shell: bash
        run: |
          go test ./go/internal/cli/vm -run '^TestWindowsSerial(PendingIO|CloseCancelsPendingIO)$' -v -count=3 -timeout 120s | tee "$RUNNER_TEMP/serial.log"
          test "$(grep -c '^--- PASS: TestWindowsSerialPendingIO ' "$RUNNER_TEMP/serial.log")" = 3
          test "$(grep -c '^--- PASS: TestWindowsSerialCloseCancelsPendingIO ' "$RUNNER_TEMP/serial.log")" = 3

      - name: Test USB driver helpers and EDL framing without hardware
        shell: bash
        run: |
          go test ./go/internal/cli/commands -run '^TestUSBDriver' -v -count=1 -timeout 120s | tee "$RUNNER_TEMP/usb-helpers.log"
          grep -q '^--- PASS: TestUSBDriverSetupPreservesTargetAndVerifiesHelperResult ' "$RUNNER_TEMP/usb-helpers.log"
          grep -q '^--- PASS: TestUSBDriverHelperRegistration ' "$RUNNER_TEMP/usb-helpers.log"
          go test ./go/internal/cli/tegraflash/winusb ./go/internal/cli/qdl -run '^Test(Windows|Signing|Usable|Driver|Compatible|Version|Parse|Instance)' -v -count=1 -timeout 120s

      - name: Require Windows link-local binding across competing routes
        shell: pwsh
        run: python .github/scripts/test-linklocal-windows.py "$env:RUNNER_TEMP/linklocal-windows"
      - name: Preserve Windows interface recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-linklocal-recovery
          path: |
            ${{ runner.temp }}/linklocal-windows/**/*.log
            ${{ runner.temp }}/linklocal-windows/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Rebuild embedded skill tests from a CRLF checkout
        shell: bash
        run: |
          git -c core.autocrlf=true -c core.eol=crlf checkout-index --force --all
          python -c "from pathlib import Path; p=Path('go/internal/cli/mcp/skills_test.go'); assert b'\r\n' in p.read_bytes(), 'checkout did not exercise CRLF'"
          go test ./go/internal/cli/mcp -run '^Test(SkillFrontmatter.*|BundledSkill.*|SkillsImportOverStdio)$' -v -count=1 -timeout 120s | tee "$RUNNER_TEMP/skill-lines.log"
          for test in TestSkillFrontmatterWindowsLineEndings TestSkillFrontmatterPreservesAllFields TestSkillFrontmatterLineEndingsPreserveResourceBytes TestSkillsImportOverStdio; do
            grep -q "^--- PASS: $test " "$RUNNER_TEMP/skill-lines.log"
          done

  # The agent embeds this Python worker and runs it on devices for campaign
  # inference. Its unit tests need no GPU: TensorRT and CUDA are faked.
  inference-worker:
    name: Inference worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go/internal/agent/inference
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The uv the agent installs on devices (uvVersion in runtime.go).
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: go/internal/agent/inference/uv.lock

      # The same locked environment the agent builds on a device.
      - name: Run worker unit tests
        run: uv run --frozen --no-dev --managed-python --python 3.12 python -m unittest -v

      - name: Set up Go for camera campaign runtime
        uses: ./.github/actions/setup-go-ci
        with:
          cache-name: camera-campaign-runtime
      - name: Install camera campaign compile dependencies
        working-directory: .
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y pkg-config libasound2-dev libusb-1.0-0-dev
      - name: Require YAML campaigns through the actual managed HF worker
        working-directory: .
        timeout-minutes: 12
        run: python3 .github/scripts/test-camera-campaign-runtime.py --output "$RUNNER_TEMP/camera-campaign-runtime"
      - name: Preserve camera campaign runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: camera-campaign-runtime
          path: |
            ${{ runner.temp }}/camera-campaign-runtime/*.log
            ${{ runner.temp }}/camera-campaign-runtime/*.json
            ${{ runner.temp }}/camera-campaign-runtime/fixture/fixture.json
          if-no-files-found: ignore
          retention-days: 7

  simulator-python310:
    name: ROS Humble simulator dependencies (${{ matrix.robot }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.robot == 'go2' && 40 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        robot: [go2, g1]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.9'
      - name: Install the shipped requirements on Python 3.10
        env:
          ROBOT: ${{ matrix.robot }}
        run: |
          uv venv --managed-python --python 3.10 .venv
          uv pip install --python .venv/bin/python -r "go/simulator/$ROBOT/requirements.txt"
          uv pip check --python .venv/bin/python
          .venv/bin/python .github/scripts/test-simulator-dependencies.py
      - name: Require Coke HTTP and inference lifecycle regressions
        if: matrix.robot == 'g1'
        timeout-minutes: 18
        run: |
          .venv/bin/python .github/scripts/test-g1-coke-transports.py --output "$RUNNER_TEMP/coke-transports"
          uv run --project Examples/G1CokeDemo --frozen --group dev --managed-python --python 3.12 python .github/scripts/test-g1-coke-review.py --output "$RUNNER_TEMP/coke-review"
      - name: Require pinned DLA package extraction and existing-library control
        if: matrix.robot == 'g1'
        timeout-minutes: 4
        run: python3 .github/scripts/test-coke-dla-package.py --output "$RUNNER_TEMP/coke-dla"
      - name: Preserve Coke regression evidence
        if: always() && matrix.robot == 'g1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coke-regressions
          path: |
            ${{ runner.temp }}/coke-transports/**/*.log
            ${{ runner.temp }}/coke-transports/**/*.json
            ${{ runner.temp }}/coke-review/*.log
            ${{ runner.temp }}/coke-review/*.json
            ${{ runner.temp }}/coke-review/junit.xml
            ${{ runner.temp }}/coke-dla/*.log
            ${{ runner.temp }}/coke-dla/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Set up Go for the Go2 bridge deadline fixture
        if: matrix.robot == 'go2'
        uses: ./.github/actions/setup-go-ci
        with:
          cache-name: go2-bridge-deadlines
      - name: Require ROS callbacks and robot transport deadlines
        if: matrix.robot == 'go2'
        run: python3 .github/scripts/test-go2-bridge-deadlines.py --output "$RUNNER_TEMP/go2-bridge-deadlines"
      - name: Preserve Go2 bridge deadline evidence
        if: always() && matrix.robot == 'go2'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go2-bridge-deadlines
          path: |
            ${{ runner.temp }}/go2-bridge-deadlines/*.json
            ${{ runner.temp }}/go2-bridge-deadlines/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare isolated Foxglove runtime tools
        if: matrix.robot == 'go2'
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y pkg-config libusb-1.0-0-dev util-linux iproute2
          runtime="$RUNNER_TEMP/foxglove-runtime-tools"
          mkdir -p "$runtime"
          (
            cd "$runtime"
            apt-get download containerd runc
            for archive in ./*.deb; do dpkg-deb --extract "$archive" root; done
          )
      - name: Require generated Foxglove deployment and real ROS forwarding
        if: matrix.robot == 'go2'
        timeout-minutes: 25
        run: |
          runtime="$RUNNER_TEMP/foxglove-runtime-tools/root"
          env PATH="$runtime/usr/bin:$runtime/usr/sbin:$runtime/bin:$runtime/sbin:$PATH" \
            python3 .github/scripts/test-foxglove-runtime.py --output "$RUNNER_TEMP/foxglove-runtime"
      - name: Preserve Foxglove deployment evidence
        if: always() && matrix.robot == 'go2'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: foxglove-runtime
          path: |
            ${{ runner.temp }}/foxglove-runtime/*.log
            ${{ runner.temp }}/foxglove-runtime/*.json
            ${{ runner.temp }}/foxglove-runtime/*/Dockerfile
            ${{ runner.temp }}/foxglove-runtime/*/wendy.json
            ${{ runner.temp }}/foxglove-runtime/*/image-digest.txt
            ${{ runner.temp }}/foxglove-runtime/*/installed-packages.txt
            ${{ runner.temp }}/foxglove-runtime/*/containerd.log
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing required "Test" check after splitting its work.
  test:
    name: Test
    if: ${{ always() }}
    needs: [shared-grpc-api-contracts, babel, unit-tests, windows, windows-telemetry, wasm, vet, agent-startup, inference-worker, containerd-regressions, media-regressions, simulator-python310, native-app-regressions, automation-regressions, dependency-security, linux-install-host, darwin-install-host, network-regressions, plugin-launcher]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          SHARED_GRPC_API_CONTRACTS_RESULT: ${{ needs.shared-grpc-api-contracts.result }}
          BABEL_RESULT: ${{ needs.babel.result }}
          RACE_RESULT: ${{ needs.unit-tests.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          WINDOWS_TELEMETRY_RESULT: ${{ needs.windows-telemetry.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
          VET_RESULT: ${{ needs.vet.result }}
          STARTUP_RESULT: ${{ needs.agent-startup.result }}
          MEDIA_RESULT: ${{ needs.media-regressions.result }}
          SIMULATOR_PYTHON_RESULT: ${{ needs.simulator-python310.result }}
          NATIVE_APP_RESULT: ${{ needs.native-app-regressions.result }}
          AUTOMATION_RESULT: ${{ needs.automation-regressions.result }}
          DEPENDENCY_SECURITY_RESULT: ${{ needs.dependency-security.result }}
          NETWORK_RESULT: ${{ needs.network-regressions.result }}
          LINUX_INSTALL_RESULT: ${{ needs.linux-install-host.result }}
          DARWIN_INSTALL_RESULT: ${{ needs.darwin-install-host.result }}
          PLUGIN_LAUNCHER_RESULT: ${{ needs.plugin-launcher.result }}
          CONTAINERD_RESULT: ${{ needs.containerd-regressions.result }}
          INFERENCE_WORKER_RESULT: ${{ needs.inference-worker.result }}
        run: |
          test "$SHARED_GRPC_API_CONTRACTS_RESULT" = success
          test "$BABEL_RESULT" = success
          test "$RACE_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$WINDOWS_TELEMETRY_RESULT" = success
          test "$WASM_RESULT" = success
          test "$VET_RESULT" = success
          test "$STARTUP_RESULT" = success
          test "$INFERENCE_WORKER_RESULT" = success
          test "$CONTAINERD_RESULT" = success
          test "$MEDIA_RESULT" = success
          test "$SIMULATOR_PYTHON_RESULT" = success
          test "$NATIVE_APP_RESULT" = success
          test "$AUTOMATION_RESULT" = success
          test "$DEPENDENCY_SECURITY_RESULT" = success
          test "$NETWORK_RESULT" = success
          test "$LINUX_INSTALL_RESULT" = success
          test "$DARWIN_INSTALL_RESULT" = success
          test "$PLUGIN_LAUNCHER_RESULT" = success

  agent-startup:
    name: Agent setup startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: ./.github/actions/setup-go-ci
        with:
          cache-name: agent-startup
      - name: Build Linux agent
        run: CGO_ENABLED=0 go build -o /tmp/wendy-agent ./go/cmd/wendy-agent
      - name: Check setup startup and Avahi failures
        run: python3 .github/scripts/integration-agent-startup.py --agent /tmp/wendy-agent
      - name: Test resource benchmark accounting and comparisons
        run: python3 -m unittest discover -s go/benchmarks/agent -p 'test_*.py' -v
      - name: Exercise resource benchmarks against the Linux agent
        run: python3 go/benchmarks/agent/smoke.py --agent /tmp/wendy-agent --output /tmp/agent-performance-smoke
      - name: Upload benchmark smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-performance-smoke
          path: /tmp/agent-performance-smoke
          retention-days: 7
      - name: Reject unknown own scope before exposing Agent mTLS
        run: |
          python3 .github/scripts/agent_own_scope_test.py
          python3 .github/scripts/test-agent-own-scope.py --agent /tmp/wendy-agent --output "$RUNNER_TEMP/agent-own-scope"
      - name: Retain actual Agent scope startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-own-scope-startup
          path: |
            ${{ runner.temp }}/agent-own-scope/*.log
            ${{ runner.temp }}/agent-own-scope/*.json
          if-no-files-found: ignore
          retention-days: 7

  vet:
    name: Vet
    runs-on: runs-on,runner=2cpu-linux-x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: ./.github/actions/setup-go-ci
        with:
          cache-name: vet

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libusb-1.0-0-dev

      - name: Run go vet
        working-directory: go
        run: go vet ./...

      - name: Build and execute the API detector
        run: python3 .github/scripts/api-snapshot-smoke.py

  format:
    name: Format Check
    runs-on: runs-on,runner=2cpu-linux-x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        working-directory: go
        run: |
          UNFORMATTED=$(gofmt -l -s .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files need formatting:"
            echo "$UNFORMATTED"
            echo ""
            echo "Run 'gofmt -w -s .' to fix."
            exit 1
          fi

  shell-tests:
    name: Install script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: shellcheck install scripts
        run: shellcheck go/internal/cli/assets/docs/agent.sh go/internal/cli/assets/docs/cli.sh
      - name: shellcheck agent package scripts
        run: shellcheck packaging/linux/fpm/wendy-agent-*.sh .github/scripts/agent-package-scripts_test.sh
      - name: resolver + deferral tests
        run: bash .github/scripts/install-scripts_test.sh
      - name: agent access choice tests
        run: bash .github/scripts/agent-network-access_test.sh
      - name: Test package discovery identity
        run: bash .github/scripts/agent-mdns_test.sh
      - name: manifest merge tests
        run: bash .github/scripts/install-manifest-merge_test.sh
      - name: agent package script tests
        run: bash .github/scripts/agent-package-scripts_test.sh
      - name: integration device selection tests
        run: python3 .github/scripts/integration-discover_test.py
      - name: gate credential refresh tests
        run: python3 .github/scripts/refresh-gate-auth_test.py
      - name: host sensor loopback CI tests
        run: |
          sh -n .github/ci-tests/host-sensor-loopback/check.sh
          bash -n go/scripts/test-ci.sh
          python3 .github/ci-tests/host-sensor-loopback/check_test.py
      - name: release priority tests
        run: node --test .github/scripts/release-priority.test.cjs
