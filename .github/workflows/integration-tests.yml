name: Hardware Integration Tests

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Device hostname (empty = auto-discover via mDNS)'
        required: false
        default: ''
      tests:
        description: 'Comma-separated test names (empty = all applicable)'
        required: false
        default: ''
      jobs:
        description: 'Jobs to run: all, discover, integration, inference (default: all)'
        required: false
        default: 'all'
      platform:
        description: 'Platform to run integration tests on: all, macos, linux (default: all)'
        required: false
        default: 'all'
  workflow_call:
    inputs:
      hostname:
        type: string
        required: false
        default: ''
      tests:
        type: string
        required: false
        default: ''
      jobs:
        type: string
        required: false
        default: 'all'
      platform:
        type: string
        required: false
        default: 'all'

permissions:
  contents: read

# The self-hosted macOS runners execute as a LaunchAgent, whose session cannot
# authorize the login Keychain: security(1) exits 152 ("Unable to obtain
# authorization for this operation") for every read, so a dehydrated credential
# is unreadable here. Keep this runner's credentials inline in config.json
# instead. Covers steps that run the CLI directly; commands sent through
# `ssh localhost` start a fresh session and export it again themselves.
env:
  WENDY_SECRET_STORE: file

jobs:
  discover:
    name: Discover (${{ matrix.runner.name }})
    if: inputs.jobs == 'all' || inputs.jobs == 'discover' || inputs.jobs == 'integration'
    runs-on:
      group: wendy-developer
      labels: [self-hosted, '${{ matrix.runner.os }}', '${{ matrix.runner.arch }}', '${{ matrix.runner.wendy_label }}']
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.explicit.outputs.matrix || steps.scan.outputs.matrix || '[]' }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - { name: macOS, os: macOS, arch: ARM64, wendy_label: wendy-macos-26 }
    steps:
      - name: Resolve explicit device
        id: explicit
        if: inputs.hostname != ''
        env:
          INPUT_HOSTNAME: ${{ inputs.hostname }}
        run: |
          set -euo pipefail
          hostname="$INPUT_HOSTNAME"
          validate_device_hostname() {
            local value="$1"
            if [[ -z "$value" || ${#value} -gt 253 ]]; then
              return 1
            fi
            if [[ "$value" == *:* ]]; then
              [[ "$value" =~ ^[0-9A-Fa-f:.]+$ ]]
            else
              [[ "$value" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*\.?$ ]]
            fi
          }
          if ! validate_device_hostname "$hostname"; then
            echo "ERROR: invalid device hostname: $hostname" >&2
            exit 1
          fi
          # Match test-ci.sh normalization for bare mDNS hostnames.
          if [[ "$hostname" != *.local && "$hostname" != *.* && "$hostname" != *:* ]]; then
            hostname="${hostname}.local"
          fi
          matrix=$(jq -cn --arg h "$hostname" '[$h]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Using explicit device: $hostname"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'

      - uses: ./.github/actions/check-runner-disk
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'

      - name: Set up Go
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare macOS build dependencies
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          missing=()
          if ! command -v pkg-config >/dev/null 2>&1; then
            missing+=(pkg-config)
          fi
          if ! pkg-config --exists libusb-1.0 >/dev/null 2>&1; then
            missing+=(libusb)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            brew install "${missing[@]}"
          fi

      - name: Build CLI
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'
        working-directory: go
        run: make build-cli

      - name: Refresh CI login before device discovery
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'
        timeout-minutes: 4
        run: |
          set -euo pipefail
          # Match the gate's SSH login session; use this checkout's fresh CLI.
          printf -v remote_command '%q ' env CI=true WENDY_SECRET_STORE=file \
            python3 "$PWD/.github/scripts/refresh-gate-auth.py" --wendy "$PWD/go/bin/wendy"
          if ! ssh -o BatchMode=yes localhost "$remote_command" </dev/null 2>/dev/null; then
            echo "::error::CI login refresh did not complete. In the runner login session, run WENDY_SECRET_STORE=file wendy auth login as ci@wendy.sh, then WENDY_SECRET_STORE=file wendy auth use wendy."
            exit 1
          fi

      - name: Run wendy discover
        id: scan
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'
        env:
          INPUT_HOSTNAME: ${{ inputs.hostname }}
          INPUT_JOBS: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          # Use the same SSH login session as the integration jobs for macOS
          # Local Network permission and the runner's file-backed credentials.
          args=(python3 "$PWD/.github/scripts/integration-discover.py"
                --wendy "$PWD/go/bin/wendy")
          if [[ -z "$INPUT_HOSTNAME" && "$INPUT_JOBS" != discover ]]; then
            args+=(--require-platforms)
          fi
          printf -v remote_command '%q ' env WENDY_SECRET_STORE=file "${args[@]}"
          MATRIX=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no localhost "$remote_command")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "### Accessible integration devices"
              echo
              echo "$MATRIX" | jq -r '.[] | "- " + .'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  integration-test-macos:
    name: Integration (macOS → ${{ matrix.hostname }})
    needs: discover
    if: >-
      needs.discover.outputs.matrix != '[]' &&
      (inputs.jobs == 'all' || inputs.jobs == 'integration') &&
      (inputs.platform == 'all' || inputs.platform == 'macos')
    runs-on:
      group: wendy-developer
      labels: [self-hosted, macOS, ARM64, wendy-macos-26]
    concurrency:
      group: device-${{ matrix.hostname }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        hostname: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      INPUT_HOSTNAME: ${{ matrix.hostname }}
      INPUT_TESTS: ${{ inputs.tests }}
      # Keep the CLI's build caches well below its 100 GiB default; the runner
      # also holds Docker Desktop and a Tart VM (WDY-3837).
      WENDY_BUILD_CACHE_MAX_BYTES: '32212254720' # 30 GiB
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/check-runner-disk

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare macOS build dependencies
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          missing=()
          if ! command -v pkg-config >/dev/null 2>&1; then
            missing+=(pkg-config)
          fi
          if ! pkg-config --exists libusb-1.0 >/dev/null 2>&1; then
            missing+=(libusb)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            brew install "${missing[@]}"
          fi

      - name: Build CLI
        working-directory: go
        run: make build-cli

      - name: Refresh CI login before device tests
        timeout-minutes: 4
        run: |
          set -euo pipefail
          printf -v remote_command '%q ' env CI=true WENDY_SECRET_STORE=file \
            python3 "$PWD/.github/scripts/refresh-gate-auth.py" --wendy "$PWD/go/bin/wendy"
          if ! ssh -o BatchMode=yes localhost "$remote_command" </dev/null 2>/dev/null; then
            echo "::error::CI login refresh did not complete. In the runner login session, run WENDY_SECRET_STORE=file wendy auth login as ci@wendy.sh, then WENDY_SECRET_STORE=file wendy auth use wendy."
            exit 1
          fi

      - name: Prepare Docker
        id: prepare-docker
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          DOCKER_READY=false
          if docker info >/dev/null 2>&1; then
            echo "Docker already available"
            DOCKER_READY=true
          elif [ -d "/Applications/Docker.app" ]; then
            echo "Starting Docker Desktop..."
            open -a Docker
            for attempt in $(seq 1 30); do
              echo "Waiting for Docker Desktop ($attempt/30)..."
              if docker info >/dev/null 2>&1; then DOCKER_READY=true; break; fi
              sleep 5
            done
          elif command -v colima >/dev/null 2>&1; then
            echo "Starting Colima..."
            colima start
            until docker info >/dev/null 2>&1; do sleep 2; done
            DOCKER_READY=true
          else
            echo "WARNING: Neither Docker Desktop nor Colima found; integration tests will be skipped"
          fi
          echo "docker_ready=$DOCKER_READY" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        if: steps.prepare-docker.outputs.docker_ready == 'true'
        run: |
          # All wendy CLI calls below run via SSH to localhost rather than
          # directly. The self-hosted runner runs as a macOS LaunchAgent which
          # does not hold the Local Network TCC permission that macOS requires
          # for mDNS (.local) resolution and link-local connections. An SSH
          # session to localhost runs under the logged-in user, which has that
          # permission. See nightly-os-update.yml for the same pattern.
          WORKDIR="$(pwd)"
          SSH=(ssh -o StrictHostKeyChecking=no localhost)

          TEST_ARGS=(-w "$WORKDIR/go/bin/wendy")

          if [[ -n "$INPUT_TESTS" ]]; then
            HAS_TESTS=false
            IFS=',' read -ra TEST_ARRAY <<< "$INPUT_TESTS"
            for t in "${TEST_ARRAY[@]}"; do
              t="$(echo "$t" | xargs)"
              if [[ ! "$t" =~ ^[A-Za-z0-9_.-]+$ ]]; then
                echo "ERROR: invalid test name: $t" >&2
                exit 1
              fi
              TEST_ARGS+=(-t "$t")
              HAS_TESTS=true
            done
            if [[ "$HAS_TESTS" == false ]]; then
              echo "No applicable tests requested, skipping."
              exit 0
            fi
          else
            for t in swift-hello swift-start-detach swift-network swift-bluetooth swift-resources python-hello python-network python-gpu python-onnx-gpu python-bluetooth python-audio python-notifications python-no-notifications python-no-network python-no-bluetooth python-no-ptrace python-no-unshare python-no-kexec-module python-network-host-admin python-no-net-admin python-resources python-multiservice python-multiservice-resources python-servicename python-env python-env-flag python-multiservice-env python-device-top otel-localhost-only; do
              TEST_ARGS+=(-t "$t")
            done
          fi
          # No else branch: with no -t the harness runs its own ALL_TESTS, so a
          # newly added test cannot be registered there and silently never run.

          builder_slug="$(printf '%s' "$INPUT_HOSTNAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//')"
          BUILDER="wendy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${builder_slug}"
          BUILDER="${BUILDER:0:128}"
          # Wendy appends -oci to WENDY_BUILDX_BUILDER for chunk-diff exports and
          # -mtls for mTLS registries. Remove those actual builders too; cleaning
          # only the unsuffixed name leaked one buildkitd container per
          # integration run until the runner exhausted memory.
          cleanup_builders() {
            docker buildx rm "${BUILDER}-oci" --force 2>/dev/null || true
            docker buildx rm "${BUILDER}-mtls" --force 2>/dev/null || true
            docker buildx rm "$BUILDER" --force 2>/dev/null || true
          }
          .github/scripts/remove-stale-ci-builders.sh
          cleanup_builders
          trap cleanup_builders EXIT

          echo "==> Starting tests on $INPUT_HOSTNAME (builder: $BUILDER)"
          # DOCKER_HOST is often unset here. ssh re-joins its arguments into one
          # string for the remote shell, so an empty argument disappears and every
          # positional after it shifts down — which silently handed test-ci.sh a
          # nonsense argument list. Send a sentinel instead of an empty word; it
          # must contain no shell metacharacters, since the remote shell parses
          # that string. The cache cap must be a plain number for the same reason.
          [[ "$WENDY_BUILD_CACHE_MAX_BYTES" =~ ^[0-9]+$ ]] || { echo "::error::WENDY_BUILD_CACHE_MAX_BYTES must be a whole number of bytes."; exit 1; }
          if "${SSH[@]}" env "WENDY_BUILD_CACHE_MAX_BYTES=$WENDY_BUILD_CACHE_MAX_BYTES" bash -s -- "$WORKDIR" "$BUILDER" "${DOCKER_HOST:-__unset__}" "$INPUT_HOSTNAME" "${TEST_ARGS[@]}" <<'REMOTE'
          set -euo pipefail
          WORKDIR="$1"; shift
          BUILDER="$1"; shift
          DOCKER_HOST_VALUE="$1"; shift
          [[ "$DOCKER_HOST_VALUE" == "__unset__" ]] && DOCKER_HOST_VALUE=""
          HOSTNAME="$1"; shift
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$HOME/bin:$PATH"
          export DOCKER_HOST="$DOCKER_HOST_VALUE"
          export WENDY_BUILDX_BUILDER="$BUILDER"
          # ssh starts a fresh session, so the workflow-level env does not reach
          # here — see the note on WENDY_SECRET_STORE at the top of this file.
          export WENDY_SECRET_STORE=file
          cd "$WORKDIR"
          exec go/scripts/test-ci.sh "$@" -h "$HOSTNAME"
          REMOTE
          then
            exit 0
          else
            exit $?
          fi

  integration-test-linux:
    name: Integration (Linux → ${{ matrix.hostname }})
    needs: discover
    if: >-
      needs.discover.outputs.matrix != '[]' &&
      (inputs.jobs == 'all' || inputs.jobs == 'integration') &&
      (inputs.platform == 'all' || inputs.platform == 'linux')
    runs-on:
      group: wendy-developer
      labels: [self-hosted, Linux]
    concurrency:
      group: device-${{ matrix.hostname }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        hostname: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      INPUT_HOSTNAME: ${{ matrix.hostname }}
      INPUT_TESTS: ${{ inputs.tests }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      # The Linux CLI links libusb via cgo (Thor flashing), so the self-hosted
      # runner needs the dev headers before `make build-cli`.
      - name: Prepare Linux build dependencies
        run: |
          set -euo pipefail
          if ! pkg-config --exists libusb-1.0 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y pkg-config libusb-1.0-0-dev
          fi

      - name: Build CLI
        working-directory: go
        run: make build-cli

      - name: Prepare Docker
        id: prepare-docker
        run: |
          DOCKER_READY=false
          if docker info >/dev/null 2>&1; then
            echo "Docker already available"
            DOCKER_READY=true
          else
            echo "WARNING: Docker not available; integration tests will be skipped"
          fi
          echo "docker_ready=$DOCKER_READY" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        if: steps.prepare-docker.outputs.docker_ready == 'true'
        env:
          # The harness launches the CLI as subprocesses; keep the token scoped to
          # this integration step so release checks inherit it without SSH forwarding.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          WORKDIR="$(pwd)"

          TEST_ARGS=(-w "$WORKDIR/go/bin/wendy")

          if [[ -n "$INPUT_TESTS" ]]; then
            HAS_TESTS=false
            IFS=',' read -ra TEST_ARRAY <<< "$INPUT_TESTS"
            for t in "${TEST_ARRAY[@]}"; do
              t="$(echo "$t" | xargs)"
              if [[ ! "$t" =~ ^[A-Za-z0-9_.-]+$ ]]; then
                echo "ERROR: invalid test name: $t" >&2
                exit 1
              fi
              TEST_ARGS+=(-t "$t")
              HAS_TESTS=true
            done
            if [[ "$HAS_TESTS" == false ]]; then
              echo "No applicable tests requested, skipping."
              exit 0
            fi
          else
            for t in python-hello python-network python-gpu python-onnx-gpu python-bluetooth python-audio python-notifications python-no-notifications python-no-network python-no-bluetooth python-no-ptrace python-no-unshare python-no-kexec-module python-network-host-admin python-no-net-admin python-resources python-multiservice python-multiservice-resources python-servicename python-env python-env-flag python-multiservice-env python-device-top otel-localhost-only; do
              TEST_ARGS+=(-t "$t")
            done
          fi
          # No else branch: with no -t the harness runs its own ALL_TESTS and
          # skips the Swift tests itself when the host has no Swift toolchain.
          # Keeping a second copy of the list here is how a registered test came
          # to never run in CI.

          builder_slug="$(printf '%s' "$INPUT_HOSTNAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//')"
          BUILDER="wendy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${builder_slug}"
          BUILDER="${BUILDER:0:128}"
          # The CLI creates ${BUILDER}-oci for chunk-diff exports and
          # ${BUILDER}-mtls for mTLS registries; clean every name so a buildkitd
          # container is not leaked after every CI run.
          cleanup_builders() {
            docker buildx rm "${BUILDER}-oci" --force 2>/dev/null || true
            docker buildx rm "${BUILDER}-mtls" --force 2>/dev/null || true
            docker buildx rm "$BUILDER" --force 2>/dev/null || true
          }
          cleanup_builders
          trap cleanup_builders EXIT

          echo "==> Starting tests on $INPUT_HOSTNAME (builder: $BUILDER)"
          WENDY_BUILDX_BUILDER="$BUILDER" go/scripts/test-ci.sh "${TEST_ARGS[@]}" -h "$INPUT_HOSTNAME"

  inference:
    name: PAIR prompt through Wendy Cloud
    if: github.event_name == 'workflow_dispatch' && inputs.jobs == 'inference'
    runs-on:
      group: wendy-developer
      labels: [self-hosted, macOS, ARM64, wendy-macos-26]
    permissions: {}
    timeout-minutes: 12
    concurrency:
      group: ci-login-wendy-developer-macos-26-01
      cancel-in-progress: false
    steps:
      # Reuse the runner's existing sign-in in its login session, as the
      # keepalive job does. No checkout, build, credential copy or device change.
      - name: Open the app tunnel and execute a prompt
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME"
          ssh -o BatchMode=yes -o ConnectTimeout=10 localhost \
            'env CI=true WENDY_SECRET_STORE=file WENDY_NO_UPDATE_CHECK=1 python3 -' <<'PYTHON'
          import json
          import socket
          import signal
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.request

          def interrupted(signum, frame):
              raise SystemExit(128 + signum)

          for signum in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
              signal.signal(signum, interrupted)

          cli = '/Users/wendy/.github/actions-runner/_work/WendyOS/WendyOS/go/bin/wendy'
          device = 'cloud://api.wendy.dev:443/tenant/5c9e14bb-49c0-4178-9cc5-493a151f9885/asset/51809f3d-084d-4014-9b4e-dc03dd8cd6f5'
          model = 'qwen3.8-flash-next:iq4_nl'
          base = 'http://127.0.0.1:18081/v1'

          def auth(*args):
              result = subprocess.run([cli, '--json', 'auth', *args], capture_output=True, timeout=60)
              if result.returncode:
                  raise RuntimeError('Stored CI Wendy login failed; inspect its login/keepalive session. Raw credential output withheld.')
              return json.loads(result.stdout) if args == ('status',) else None

          sessions = auth('status').get('sessions', [])
          if not any(s.get('context') == 'wendy' and s.get('cloudGrpc') == 'api.wendy.dev:443' for s in sessions):
              raise RuntimeError('Runner has no exact wendy production login; sign in through its existing CI login session.')
          auth('use', 'wendy')
          auth('refresh-certs')
          current = next((s for s in auth('status').get('sessions', []) if s.get('current')), {})
          expected = 'spiffe://wendy.sh/tenant/5c9e14bb-49c0-4178-9cc5-493a151f9885/operator/'
          if current.get('context') != 'wendy' or not current.get('principalUri', '').startswith(expected):
              raise RuntimeError('Current login is not a Wendy Labs production operator.')
          if current.get('certificate', {}).get('expired', True):
              raise RuntimeError('CI operator certificate is expired or absent.')
          print('Host:', socket.gethostname(), flush=True)
          print('Verified Wendy Labs production operator login', flush=True)
          with socket.socket() as probe:
              probe.bind(('127.0.0.1', 18081))

          # Keep raw CLI output private: authentication failures may contain
          # sensitive details. The temporary log is deleted on every exit.
          with tempfile.TemporaryFile() as log:
              forward = subprocess.Popen([cli, '--json', 'net', 'forward', '18081:18080', '--device', device], stdout=log, stderr=log)
              try:
                  deadline = time.monotonic() + 90
                  while True:
                      if forward.poll() is not None:
                          raise RuntimeError('Wendy forward exited before readiness; raw CLI output withheld.')
                      try:
                          with urllib.request.urlopen(base + '/models', timeout=5) as response:
                              models = json.load(response)
                          if not any(item.get('id') == model for item in models.get('data', [])):
                              raise RuntimeError('Flash model is absent from the gateway inventory.')
                          break
                      except (urllib.error.URLError, TimeoutError):
                          if time.monotonic() >= deadline:
                              raise RuntimeError('Wendy Cloud app tunnel did not become ready within 90 seconds.') from None
                          time.sleep(1)
                  body = {'model': model, 'messages': [{'role': 'user', 'content': 'Reply with exactly CI_PAIR_READY'}],
                          'reasoning_effort': 'none', 'max_tokens': 32, 'temperature': 0, 'stream': False}
                  request = urllib.request.Request(base + '/chat/completions', data=json.dumps(body).encode(), headers={'Content-Type': 'application/json'})
                  started = time.monotonic()
                  with urllib.request.urlopen(request, timeout=150) as response:
                      result = json.load(response)
                  text = result['choices'][0]['message']['content'].strip()
                  if text != 'CI_PAIR_READY':
                      raise RuntimeError('Inference response did not match the requested CI_PAIR_READY marker.')
                  print(json.dumps({'model': model, 'response': text, 'seconds': round(time.monotonic() - started, 3)}), flush=True)
              finally:
                  forward.terminate()
                  try:
                      forward.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      forward.kill()
                      forward.wait(timeout=5)
                  print('Owned Wendy forward stopped', flush=True)
          PYTHON
