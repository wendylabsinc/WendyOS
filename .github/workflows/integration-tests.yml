name: Hardware Integration Tests

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Device hostname (empty = auto-discover via mDNS)'
        required: false
        default: ''
      tests:
        description: 'Comma-separated test names (empty = all applicable)'
        required: false
        default: ''
      jobs:
        description: 'Jobs to run: all, discover, integration (default: all)'
        required: false
        default: 'all'
      platform:
        description: 'Platform to run integration tests on: all, macos, linux (default: all)'
        required: false
        default: 'all'
  workflow_call:
    inputs:
      hostname:
        type: string
        required: false
        default: ''
      tests:
        type: string
        required: false
        default: ''
      jobs:
        type: string
        required: false
        default: 'all'
      platform:
        type: string
        required: false
        default: 'all'

permissions:
  contents: read

# The self-hosted macOS runners execute as a LaunchAgent, whose session cannot
# authorize the login Keychain: security(1) exits 152 ("Unable to obtain
# authorization for this operation") for every read, so a dehydrated credential
# is unreadable here. Keep this runner's credentials inline in config.json
# instead. Covers steps that run the CLI directly; commands sent through
# `ssh localhost` start a fresh session and export it again themselves.
env:
  WENDY_SECRET_STORE: file

jobs:
  discover:
    name: Discover (${{ matrix.runner.name }})
    if: inputs.jobs == 'all' || inputs.jobs == 'discover' || inputs.jobs == 'integration'
    runs-on:
      group: wendy-developer
      labels: [self-hosted, '${{ matrix.runner.os }}', '${{ matrix.runner.arch }}', '${{ matrix.runner.wendy_label }}']
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.explicit.outputs.matrix || steps.scan.outputs.matrix || '[]' }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - { name: macOS, os: macOS, arch: ARM64, wendy_label: wendy-macos-26 }
    steps:
      - name: Resolve explicit device
        id: explicit
        if: inputs.hostname != ''
        env:
          INPUT_HOSTNAME: ${{ inputs.hostname }}
        run: |
          set -euo pipefail
          hostname="$INPUT_HOSTNAME"
          validate_device_hostname() {
            local value="$1"
            if [[ -z "$value" || ${#value} -gt 253 ]]; then
              return 1
            fi
            if [[ "$value" == *:* ]]; then
              [[ "$value" =~ ^[0-9A-Fa-f:.]+$ ]]
            else
              [[ "$value" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*\.?$ ]]
            fi
          }
          if ! validate_device_hostname "$hostname"; then
            echo "ERROR: invalid device hostname: $hostname" >&2
            exit 1
          fi
          # Match test-ci.sh normalization for bare mDNS hostnames.
          if [[ "$hostname" != *.local && "$hostname" != *.* && "$hostname" != *:* ]]; then
            hostname="${hostname}.local"
          fi
          matrix=$(jq -cn --arg h "$hostname" '[$h]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Using explicit device: $hostname"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'

      - name: Set up Go
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build embedded MCP app
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'
        uses: ./.github/actions/build-mcp-app

      - name: Prepare macOS build dependencies
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          missing=()
          if ! command -v pkg-config >/dev/null 2>&1; then
            missing+=(pkg-config)
          fi
          if ! pkg-config --exists libusb-1.0 >/dev/null 2>&1; then
            missing+=(libusb)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            brew install "${missing[@]}"
          fi

      - name: Build CLI
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'
        working-directory: go
        run: make build-cli

      - name: Run wendy discover
        id: scan
        if: inputs.hostname == '' || inputs.jobs == 'all' || inputs.jobs == 'discover'
        env:
          INPUT_HOSTNAME: ${{ inputs.hostname }}
          INPUT_JOBS: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          # Use the same SSH login session as the integration jobs for macOS
          # Local Network permission and the runner's file-backed credentials.
          args=(python3 "$PWD/.github/scripts/integration-discover.py"
                --wendy "$PWD/go/bin/wendy")
          if [[ -z "$INPUT_HOSTNAME" && "$INPUT_JOBS" != discover ]]; then
            args+=(--require-platforms)
          fi
          printf -v remote_command '%q ' env WENDY_SECRET_STORE=file "${args[@]}"
          MATRIX=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no localhost "$remote_command")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "### Accessible integration devices"
              echo
              echo "$MATRIX" | jq -r '.[] | "- " + .'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  integration-test-macos:
    name: Integration (macOS → ${{ matrix.hostname }})
    needs: discover
    if: >-
      needs.discover.outputs.matrix != '[]' &&
      (inputs.jobs == 'all' || inputs.jobs == 'integration') &&
      (inputs.platform == 'all' || inputs.platform == 'macos')
    runs-on:
      group: wendy-developer
      labels: [self-hosted, macOS, ARM64, wendy-macos-26]
    concurrency:
      group: device-${{ matrix.hostname }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        hostname: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      INPUT_HOSTNAME: ${{ matrix.hostname }}
      INPUT_TESTS: ${{ inputs.tests }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build embedded MCP app
        uses: ./.github/actions/build-mcp-app

      - name: Prepare macOS build dependencies
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          missing=()
          if ! command -v pkg-config >/dev/null 2>&1; then
            missing+=(pkg-config)
          fi
          if ! pkg-config --exists libusb-1.0 >/dev/null 2>&1; then
            missing+=(libusb)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            brew install "${missing[@]}"
          fi

      - name: Build CLI
        working-directory: go
        run: make build-cli

      - name: Prepare Docker
        id: prepare-docker
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          DOCKER_READY=false
          if docker info >/dev/null 2>&1; then
            echo "Docker already available"
            DOCKER_READY=true
          elif [ -d "/Applications/Docker.app" ]; then
            echo "Starting Docker Desktop..."
            open -a Docker
            for attempt in $(seq 1 30); do
              echo "Waiting for Docker Desktop ($attempt/30)..."
              if docker info >/dev/null 2>&1; then DOCKER_READY=true; break; fi
              sleep 5
            done
          elif command -v colima >/dev/null 2>&1; then
            echo "Starting Colima..."
            colima start
            until docker info >/dev/null 2>&1; do sleep 2; done
            DOCKER_READY=true
          else
            echo "WARNING: Neither Docker Desktop nor Colima found; integration tests will be skipped"
          fi
          echo "docker_ready=$DOCKER_READY" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        if: steps.prepare-docker.outputs.docker_ready == 'true'
        run: |
          # All wendy CLI calls below run via SSH to localhost rather than
          # directly. The self-hosted runner runs as a macOS LaunchAgent which
          # does not hold the Local Network TCC permission that macOS requires
          # for mDNS (.local) resolution and link-local connections. An SSH
          # session to localhost runs under the logged-in user, which has that
          # permission. See nightly-os-update.yml for the same pattern.
          WORKDIR="$(pwd)"
          SSH=(ssh -o StrictHostKeyChecking=no localhost)

          TEST_ARGS=(-w "$WORKDIR/go/bin/wendy")

          if [[ -n "$INPUT_TESTS" ]]; then
            HAS_TESTS=false
            IFS=',' read -ra TEST_ARRAY <<< "$INPUT_TESTS"
            for t in "${TEST_ARRAY[@]}"; do
              t="$(echo "$t" | xargs)"
              if [[ ! "$t" =~ ^[A-Za-z0-9_.-]+$ ]]; then
                echo "ERROR: invalid test name: $t" >&2
                exit 1
              fi
              TEST_ARGS+=(-t "$t")
              HAS_TESTS=true
            done
            if [[ "$HAS_TESTS" == false ]]; then
              echo "No applicable tests requested, skipping."
              exit 0
            fi
          else
            for t in swift-hello swift-start-detach swift-network swift-bluetooth swift-resources python-hello python-network python-gpu python-onnx-gpu python-bluetooth python-audio python-notifications python-no-notifications python-no-network python-no-bluetooth python-no-ptrace python-no-unshare python-no-kexec-module python-network-host-admin python-no-net-admin python-resources python-multiservice python-multiservice-resources python-servicename python-env python-env-flag python-multiservice-env python-device-top otel-localhost-only; do
              TEST_ARGS+=(-t "$t")
            done
          fi
          # No else branch: with no -t the harness runs its own ALL_TESTS, so a
          # newly added test cannot be registered there and silently never run.

          builder_slug="$(printf '%s' "$INPUT_HOSTNAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//')"
          BUILDER="wendy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${builder_slug}"
          BUILDER="${BUILDER:0:128}"
          # Wendy appends -oci to WENDY_BUILDX_BUILDER for chunk-diff exports.
          # Remove that actual builder too; cleaning only the unsuffixed name
          # leaked one buildkitd container per integration run until the runner
          # exhausted memory.
          cleanup_builders() {
            docker buildx rm "${BUILDER}-oci" --force 2>/dev/null || true
            docker buildx rm "$BUILDER" --force 2>/dev/null || true
          }
          cleanup_builders
          trap cleanup_builders EXIT

          echo "==> Starting tests on $INPUT_HOSTNAME (builder: $BUILDER)"
          # DOCKER_HOST is often unset here. ssh re-joins its arguments into one
          # string for the remote shell, so an empty argument disappears and every
          # positional after it shifts down — which silently handed test-ci.sh a
          # nonsense argument list. Send a sentinel instead of an empty word; it
          # must contain no shell metacharacters, since the remote shell parses
          # that string.
          if "${SSH[@]}" bash -s -- "$WORKDIR" "$BUILDER" "${DOCKER_HOST:-__unset__}" "$INPUT_HOSTNAME" "${TEST_ARGS[@]}" <<'REMOTE'
          set -euo pipefail
          WORKDIR="$1"; shift
          BUILDER="$1"; shift
          DOCKER_HOST_VALUE="$1"; shift
          [[ "$DOCKER_HOST_VALUE" == "__unset__" ]] && DOCKER_HOST_VALUE=""
          HOSTNAME="$1"; shift
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$HOME/bin:$PATH"
          export DOCKER_HOST="$DOCKER_HOST_VALUE"
          export WENDY_BUILDX_BUILDER="$BUILDER"
          # ssh starts a fresh session, so the workflow-level env does not reach
          # here — see the note on WENDY_SECRET_STORE at the top of this file.
          export WENDY_SECRET_STORE=file
          cd "$WORKDIR"
          exec go/scripts/test-ci.sh "$@" -h "$HOSTNAME"
          REMOTE
          then
            exit 0
          else
            exit $?
          fi

  integration-test-linux:
    name: Integration (Linux → ${{ matrix.hostname }})
    needs: discover
    if: >-
      needs.discover.outputs.matrix != '[]' &&
      (inputs.jobs == 'all' || inputs.jobs == 'integration') &&
      (inputs.platform == 'all' || inputs.platform == 'linux')
    runs-on:
      group: wendy-developer
      labels: [self-hosted, Linux]
    concurrency:
      group: device-${{ matrix.hostname }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        hostname: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      INPUT_HOSTNAME: ${{ matrix.hostname }}
      INPUT_TESTS: ${{ inputs.tests }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build embedded MCP app
        uses: ./.github/actions/build-mcp-app

      # The Linux CLI links libusb via cgo (Thor flashing), so the self-hosted
      # runner needs the dev headers before `make build-cli`.
      - name: Prepare Linux build dependencies
        run: |
          set -euo pipefail
          if ! pkg-config --exists libusb-1.0 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y pkg-config libusb-1.0-0-dev
          fi

      - name: Build CLI
        working-directory: go
        run: make build-cli

      - name: Prepare Docker
        id: prepare-docker
        run: |
          DOCKER_READY=false
          if docker info >/dev/null 2>&1; then
            echo "Docker already available"
            DOCKER_READY=true
          else
            echo "WARNING: Docker not available; integration tests will be skipped"
          fi
          echo "docker_ready=$DOCKER_READY" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        if: steps.prepare-docker.outputs.docker_ready == 'true'
        env:
          # The harness launches the CLI as subprocesses; keep the token scoped to
          # this integration step so release checks inherit it without SSH forwarding.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          WORKDIR="$(pwd)"

          TEST_ARGS=(-w "$WORKDIR/go/bin/wendy")

          if [[ -n "$INPUT_TESTS" ]]; then
            HAS_TESTS=false
            IFS=',' read -ra TEST_ARRAY <<< "$INPUT_TESTS"
            for t in "${TEST_ARRAY[@]}"; do
              t="$(echo "$t" | xargs)"
              if [[ ! "$t" =~ ^[A-Za-z0-9_.-]+$ ]]; then
                echo "ERROR: invalid test name: $t" >&2
                exit 1
              fi
              TEST_ARGS+=(-t "$t")
              HAS_TESTS=true
            done
            if [[ "$HAS_TESTS" == false ]]; then
              echo "No applicable tests requested, skipping."
              exit 0
            fi
          else
            for t in python-hello python-network python-gpu python-onnx-gpu python-bluetooth python-audio python-notifications python-no-notifications python-no-network python-no-bluetooth python-no-ptrace python-no-unshare python-no-kexec-module python-network-host-admin python-no-net-admin python-resources python-multiservice python-multiservice-resources python-servicename python-env python-env-flag python-multiservice-env python-device-top otel-localhost-only; do
              TEST_ARGS+=(-t "$t")
            done
          fi
          # No else branch: with no -t the harness runs its own ALL_TESTS and
          # skips the Swift tests itself when the host has no Swift toolchain.
          # Keeping a second copy of the list here is how a registered test came
          # to never run in CI.

          builder_slug="$(printf '%s' "$INPUT_HOSTNAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//')"
          BUILDER="wendy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${builder_slug}"
          BUILDER="${BUILDER:0:128}"
          # The CLI creates ${BUILDER}-oci for chunk-diff exports; clean both
          # names so a buildkitd container is not leaked after every CI run.
          cleanup_builders() {
            docker buildx rm "${BUILDER}-oci" --force 2>/dev/null || true
            docker buildx rm "$BUILDER" --force 2>/dev/null || true
          }
          cleanup_builders
          trap cleanup_builders EXIT

          echo "==> Starting tests on $INPUT_HOSTNAME (builder: $BUILDER)"
          WENDY_BUILDX_BUILDER="$BUILDER" go/scripts/test-ci.sh "${TEST_ARGS[@]}" -h "$INPUT_HOSTNAME"
