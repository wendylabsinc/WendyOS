name: Hardware Integration Tests

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Device hostname (empty = required rack matrix)'
        default: ''
      tests:
        description: 'Comma-separated tests (empty = every applicable fixture)'
        default: ''
      jobs:
        description: 'all, discover, or integration'
        default: 'all'
      platform:
        description: 'all, macos, or linux'
        default: 'all'
  workflow_call:
    inputs:
      hostname:
        type: string
        default: ''
      tests:
        type: string
        default: ''
      jobs:
        type: string
        default: 'all'
      platform:
        type: string
        default: 'all'
      source_ref:
        description: Exact WendyOS source revision, required for external callers
        type: string
        default: ''
      candidate_version:
        description: Exact CLI and agent archive version in this workflow run
        type: string
        default: ''
      os_candidate_version:
        type: string
        default: ''
      os_candidate_sha:
        type: string
        default: ''
      os_candidate_repository:
        type: string
        default: ''
      os_candidate_run_id:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  WENDY_SECRET_STORE: file

jobs:
  discover:
    name: Discover (macOS)
    runs-on:
      group: wendy-developer
      labels: [self-hosted, macOS, ARM64, wendy-macos-26]
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      source_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wendylabsinc/wendyos
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Validate qualification inputs
        env:
          INPUT_JOBS: ${{ inputs.jobs }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          SOURCE_REF: ${{ inputs.source_ref }}
          OS_VERSION: ${{ inputs.os_candidate_version }}
          OS_SHA: ${{ inputs.os_candidate_sha }}
          OS_REPO: ${{ inputs.os_candidate_repository }}
          OS_RUN: ${{ inputs.os_candidate_run_id }}
          INPUT_HOST: ${{ inputs.hostname }}
          INPUT_TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          # Bash 3.2 on macOS does not reliably apply errexit to [[ ... ]].
          [[ "$INPUT_JOBS" =~ ^(all|discover|integration)$ ]] || exit 1
          [[ "$INPUT_PLATFORM" =~ ^(all|macos|linux)$ ]] || exit 1
          repository_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [[ "$repository_lower" != wendylabsinc/wendyos && ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'External callers must pin source_ref to a WendyOS commit' >&2
            exit 1
          fi
          if [[ -n "$OS_VERSION$OS_SHA$OS_REPO$OS_RUN" ]]; then
            [[ "$OS_VERSION" =~ ^[A-Za-z0-9._-]+$ && "$OS_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$OS_REPO" == "$GITHUB_REPOSITORY" && "$OS_RUN" == "$GITHUB_RUN_ID" ]] || exit 1
            [[ -z "$INPUT_HOST$INPUT_TESTS" && "$INPUT_JOBS" != discover ]] || exit 1
          fi
      - uses: ./.github/actions/integration-candidate
        id: candidate
        with:
          version: ${{ inputs.candidate_version }}
          agents: 'false'
      - name: Download exact OS candidate metadata
        if: inputs.os_candidate_version != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: manifest-entry-*
          merge-multiple: true
          path: .ci-os-candidate
      - name: Resolve and probe rack
        id: scan
        env:
          INPUT_HOSTNAME: ${{ inputs.hostname }}
          INPUT_JOBS: ${{ inputs.jobs }}
          OS_VERSION: ${{ inputs.os_candidate_version }}
          OS_SHA: ${{ inputs.os_candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p .ci-evidence/discovery
          # Shell quoting is explicit: ssh joins arguments before remote parsing.
          python3 - <<'PYREMOTE'
          import json, os, pathlib, re, shlex, subprocess
          root = pathlib.Path.cwd()
          cli = str(root / 'go/bin/wendy')
          def remote(args):
              return subprocess.run(['ssh', '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=no',
                                     'localhost', shlex.join(['env', 'WENDY_SECRET_STORE=file', *args])],
                                    check=True, stdout=subprocess.PIPE, text=True, timeout=600).stdout
          host = os.environ['INPUT_HOSTNAME']
          if host:
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.:-]{0,252}', host):
                  raise SystemExit('Invalid device hostname')
              if '.' not in host and ':' not in host:
                  host += '.local'
              matrix = json.dumps([host])
          else:
              args = ['python3', str(root / '.github/scripts/integration-discover.py'), '--wendy', cli,
                      '--evidence', str(root / '.ci-evidence/discovery/inventory.json')]
              if os.environ['INPUT_JOBS'] != 'discover':
                  args.append('--require-platforms')
                  if os.environ['OS_VERSION']:
                      args.append('--defer-runtime-coverage')
              matrix = remote(args).strip()
          if os.environ['OS_VERSION']:
              matrix = remote(['python3', str(root / '.github/scripts/integration-prepare-os.py'),
                  '--wendy', cli, '--metadata-dir', str(root / '.ci-os-candidate'),
                  '--expected-version', os.environ['OS_VERSION'], '--expected-commit', os.environ['OS_SHA'],
                  '--plan', '--devices-json', matrix,
                  '--evidence', str(root / '.ci-evidence/discovery/os-plan.json')]).strip()
          hosts = json.loads(matrix)
          if not hosts and os.environ['INPUT_JOBS'] != 'discover':
              raise SystemExit('No qualified rack devices')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps(hosts) + '\n')
          PYREMOTE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: hardware-discovery-${{ github.run_attempt }}
          path: .ci-evidence/discovery
          include-hidden-files: true
          if-no-files-found: warn

  integration-test-macos:
    name: Integration (macOS → ${{ matrix.hostname }})
    needs: discover
    if: >-
      needs.discover.outputs.matrix != '[]' &&
      (inputs.jobs == 'all' || inputs.jobs == 'integration') &&
      (inputs.platform == 'all' || inputs.platform == 'macos')
    runs-on:
      group: wendy-developer
      labels: [self-hosted, macOS, ARM64, wendy-macos-26]
    concurrency:
      group: device-${{ matrix.hostname }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        hostname: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wendylabsinc/wendyos
          ref: ${{ needs.discover.outputs.source_sha }}
      - uses: ./.github/actions/integration-candidate
        id: candidate
        with:
          version: ${{ inputs.candidate_version }}
      - name: Download exact OS candidate metadata
        if: inputs.os_candidate_version != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: manifest-entry-*
          merge-multiple: true
          path: .ci-os-candidate
      - name: Require runner prerequisites
        env:
          INPUT_TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$HOME/bin:$PATH"
          docker info >/dev/null
          command -v python3
          command -v jq
          if [[ "$RUNNER_OS" == macOS && -z "$INPUT_TESTS" ]]; then
            command -v swiftly || { echo 'Required Swift toolchain is missing' >&2; exit 1; }
          fi
      - name: Install candidate and run hardware tests
        env:
          INPUT_HOSTNAME: ${{ matrix.hostname }}
          INPUT_TESTS: ${{ inputs.tests }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
          OS_VERSION: ${{ inputs.os_candidate_version }}
          OS_SHA: ${{ inputs.os_candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$HOME/bin:$PATH"
          builder_slug="$(printf '%s' "$INPUT_HOSTNAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')"
          export WENDY_BUILDX_BUILDER="wendy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${builder_slug}"
          cleanup_builders() {
            docker buildx rm "${WENDY_BUILDX_BUILDER}-oci" --force 2>/dev/null || true
            docker buildx rm "$WENDY_BUILDX_BUILDER" --force 2>/dev/null || true
          }
          trap cleanup_builders EXIT
          cleanup_builders
          python3 - <<'PYREMOTE'
          import os, pathlib, shlex, subprocess
          root = pathlib.Path.cwd()
          marker = str(root / '.ci-evidence/device/lease-releasable')
          args = ['python3', str(root / '.github/scripts/integration-run.py'),
                  '--wendy', str(root / 'go/bin/wendy'), '--device', os.environ['INPUT_HOSTNAME'],
                  '--agents', str(root / '.ci-candidate/agents'), '--source-sha', os.environ['SOURCE_SHA'],
                  '--version', os.environ['CANDIDATE_VERSION'], '--tests', os.environ['INPUT_TESTS'],
                  '--evidence', str(root / '.ci-evidence/device'), '--release-marker', marker]
          if os.environ['OS_VERSION']:
              args += ['--os-metadata', str(root / '.ci-os-candidate'),
                       '--os-version', os.environ['OS_VERSION'], '--os-sha', os.environ['OS_SHA']]
          owner = '/'.join(os.environ[key] for key in ('GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB'))
          args = ['python3', str(root / '.github/scripts/integration-lease.py'),
                  '--wendy', str(root / 'go/bin/wendy'), '--device', os.environ['INPUT_HOSTNAME'],
                  '--owner', owner, '--release-marker', marker, '--'] + args
          if os.environ['RUNNER_OS'] == 'macOS':
              forwarded = ['PATH', 'DOCKER_HOST', 'WENDY_BUILDX_BUILDER', 'RUNNER_OS']
              env = ['env', 'WENDY_SECRET_STORE=file']
              env += [key + '=' + os.environ[key] for key in forwarded if key in os.environ]
              args = ['ssh', '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=no',
                      'localhost', shlex.join(env + args)]
          subprocess.run(args, check=True)
          PYREMOTE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: hardware-result-macos-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-evidence/device
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  integration-test-linux:
    name: Integration (Linux → ${{ matrix.hostname }})
    needs: discover
    if: >-
      needs.discover.outputs.matrix != '[]' &&
      (inputs.jobs == 'all' || inputs.jobs == 'integration') &&
      (inputs.platform == 'all' || inputs.platform == 'linux')
    runs-on:
      group: wendy-developer
      labels: [self-hosted, Linux, X64]
    concurrency:
      group: device-${{ matrix.hostname }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        hostname: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wendylabsinc/wendyos
          ref: ${{ needs.discover.outputs.source_sha }}
      - uses: ./.github/actions/integration-candidate
        id: candidate
        with:
          version: ${{ inputs.candidate_version }}
      - name: Download exact OS candidate metadata
        if: inputs.os_candidate_version != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: manifest-entry-*
          merge-multiple: true
          path: .ci-os-candidate
      - name: Require runner prerequisites
        env:
          INPUT_TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$HOME/bin:$PATH"
          docker info >/dev/null
          command -v python3
          command -v jq
          if [[ "$RUNNER_OS" == macOS && -z "$INPUT_TESTS" ]]; then
            command -v swiftly || { echo 'Required Swift toolchain is missing' >&2; exit 1; }
          fi
      - name: Install candidate and run hardware tests
        env:
          INPUT_HOSTNAME: ${{ matrix.hostname }}
          INPUT_TESTS: ${{ inputs.tests }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
          OS_VERSION: ${{ inputs.os_candidate_version }}
          OS_SHA: ${{ inputs.os_candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$HOME/bin:$PATH"
          builder_slug="$(printf '%s' "$INPUT_HOSTNAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')"
          export WENDY_BUILDX_BUILDER="wendy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${builder_slug}"
          cleanup_builders() {
            docker buildx rm "${WENDY_BUILDX_BUILDER}-oci" --force 2>/dev/null || true
            docker buildx rm "$WENDY_BUILDX_BUILDER" --force 2>/dev/null || true
          }
          trap cleanup_builders EXIT
          cleanup_builders
          python3 - <<'PYREMOTE'
          import os, pathlib, shlex, subprocess
          root = pathlib.Path.cwd()
          marker = str(root / '.ci-evidence/device/lease-releasable')
          args = ['python3', str(root / '.github/scripts/integration-run.py'),
                  '--wendy', str(root / 'go/bin/wendy'), '--device', os.environ['INPUT_HOSTNAME'],
                  '--agents', str(root / '.ci-candidate/agents'), '--source-sha', os.environ['SOURCE_SHA'],
                  '--version', os.environ['CANDIDATE_VERSION'], '--tests', os.environ['INPUT_TESTS'],
                  '--evidence', str(root / '.ci-evidence/device'), '--release-marker', marker]
          if os.environ['OS_VERSION']:
              args += ['--os-metadata', str(root / '.ci-os-candidate'),
                       '--os-version', os.environ['OS_VERSION'], '--os-sha', os.environ['OS_SHA']]
          owner = '/'.join(os.environ[key] for key in ('GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB'))
          args = ['python3', str(root / '.github/scripts/integration-lease.py'),
                  '--wendy', str(root / 'go/bin/wendy'), '--device', os.environ['INPUT_HOSTNAME'],
                  '--owner', owner, '--release-marker', marker, '--'] + args
          if os.environ['RUNNER_OS'] == 'macOS':
              forwarded = ['PATH', 'DOCKER_HOST', 'WENDY_BUILDX_BUILDER', 'RUNNER_OS']
              env = ['env', 'WENDY_SECRET_STORE=file']
              env += [key + '=' + os.environ[key] for key in forwarded if key in os.environ]
              args = ['ssh', '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=no',
                      'localhost', shlex.join(env + args)]
          subprocess.run(args, check=True)
          PYREMOTE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: hardware-result-linux-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-evidence/device
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  qualification:
    name: Hardware qualification
    needs: [discover, integration-test-macos, integration-test-linux]
    if: always() && inputs.jobs != 'discover'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected jobs
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          MACOS_RESULT: ${{ needs.integration-test-macos.result }}
          LINUX_RESULT: ${{ needs.integration-test-linux.result }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          [[ "$DISCOVER_RESULT" == success ]] || exit 1
          if [[ "$PLATFORM" != linux ]]; then [[ "$MACOS_RESULT" == success ]] || exit 1; fi
          if [[ "$PLATFORM" != macos ]]; then [[ "$LINUX_RESULT" == success ]] || exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wendylabsinc/wendyos
          ref: ${{ needs.discover.outputs.source_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: hardware-result-*-${{ github.run_attempt }}
          path: .ci-results
      - name: Verify complete candidate coverage
        env:
          HOSTS: ${{ needs.discover.outputs.matrix }}
          PLATFORM: ${{ inputs.platform }}
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
          INPUT_HOSTNAME: ${{ inputs.hostname }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          OS_VERSION: ${{ inputs.os_candidate_version }}
          OS_SHA: ${{ inputs.os_candidate_sha }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos) platforms=macOS ;;
            linux) platforms=Linux ;;
            all) platforms=macOS,Linux ;;
          esac
          args=(--results .ci-results --hosts "$HOSTS" --platforms "$platforms" --source-sha "$SOURCE_SHA")
          [[ -n "$INPUT_HOSTNAME" ]] || args+=(--require-matrix)
          python3 .github/scripts/integration-results.py "${args[@]}" --candidate-version "$CANDIDATE_VERSION" --os-version "$OS_VERSION" --os-sha "$OS_SHA"
