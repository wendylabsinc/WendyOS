name: Plugin launcher

on:
  # Go validation calls this workflow before release and requires this result.
  # Keep one invocation of each Linux/macOS/Windows launcher check per source.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix:
    name: POSIX (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: '{"labels":"ubuntu-latest"}'
          - os: macOS
            runner: '{"group":"wendy-mac","labels":["self-hosted","macOS","ARM64"]}'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-macos-ci
        if: runner.os == 'macOS'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh plugins/wendy/scripts/wendy scripts/pin-cli.sh scripts/test/plugin-launcher/run.sh
      - name: Launcher tests (sh)
        run: sh scripts/test/plugin-launcher/run.sh
      - name: Launcher tests (dash)
        if: runner.os == 'Linux'
        run: dash scripts/test/plugin-launcher/run.sh

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Launcher tests (cmd + PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test\plugin-launcher\run.ps1
