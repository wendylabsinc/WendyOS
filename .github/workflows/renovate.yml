---
# Self-hosted Renovate, the same shape as wendy-auth's, pki-core's and cloud's.
# Dependabot (.github/dependabot.yml) keeps the action, Go, npm and pip updates;
# renovate.json5 limits Renovate to what Dependabot cannot update. Nothing here
# automerges.
#
# Schedule and manual dispatch only: no pull_request trigger, so PR code never runs
# next to the app credential, and the repository guard keeps forks from running it.
name: Renovate

on:
  schedule:
    - cron: "17 3 * * 1"          # Monday, outside the working day
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (log what would be opened, open nothing)"
        type: boolean
        default: false
      logLevel:
        description: "Renovate log level"
        default: "info"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    if: github.repository == 'wendylabsinc/WendyOS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Skip, do not fail, until the app credential is visible to this repo: a scheduled
      # job that reds main every Monday teaches people to ignore it. Both halves are
      # checked, so an ID without its key skips here instead of failing in the token step.
      - name: Check for credentials
        id: gate
        env:
          APP_ID: ${{ secrets.RENOVATE_APP_ID }}
          APP_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$APP_ID" ] || missing="$missing RENOVATE_APP_ID"
          [ -n "$APP_KEY" ] || missing="$missing RENOVATE_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "Renovate credential missing:$missing -- not visible to this repo yet. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate app token
        if: steps.gate.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Only what Renovate uses here: branches and commits (workflow files included),
          # its PRs, the Dependency Dashboard issue, and reading PR check results.
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-statuses: read

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Renovate
        if: steps.gate.outputs.ready == 'true'
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || '' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # auto|disabled|enabled; "enabled" commits through the API, so commits are
          # signed and verified as the app.
          RENOVATE_PLATFORM_COMMIT: "enabled"
        with:
          token: ${{ steps.app-token.outputs.token }}
