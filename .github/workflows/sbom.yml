name: SBOM tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: sbom-tests-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sbom-tests:
    name: SBOM script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.18.1

      # The integration test compiles the wendy CLI, which links libusb via cgo
      # (gousb, for Thor USB recovery flashing). Provide the libusb dev headers
      # and pkg-config so CGO_ENABLED=1 `go build ./cmd/wendy` resolves
      # `#cgo pkg-config: libusb-1.0`.
      - name: Install libusb (cgo dependency of the CLI)
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Unit tests (fake syft)
        run: bash scripts/test/generate-sbom.test.sh

      - name: Integration test (real syft)
        run: bash scripts/test/generate-sbom.integration.sh
