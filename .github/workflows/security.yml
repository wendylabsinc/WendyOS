name: Security

on:
  # Go Tests calls this for every affected PR and gates its Test result on it.
  # A second pull_request trigger repeats all three scans for the same source.
  workflow_call:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [go/internal/cli/assets/docs, web-client]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Audit the complete resolved dependency graph
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only --audit-level=high

  govulncheck:
    name: govulncheck
    # Keep the security scan independent of self-hosted runner shutdowns.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMEMLIMIT: 5GiB
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libusb-1.0-0-dev

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        working-directory: go
        run: /usr/bin/time -v govulncheck ./...
