name: Spare compute worker
on:
  pull_request:
    paths:
      - scripts/spare-compute/**
      - .github/workflows/spare-compute.yml
  push:
    branches: [main]
    paths:
      - scripts/spare-compute/**
      - .github/workflows/spare-compute.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/spare-compute -p 'test_*.py' -v
      - name: Validate Compose configuration
        env:
          SOURCE_ARCHIVE: /tmp/source.tar
          MODEL_CACHE: /tmp/models
        run: docker compose -f scripts/spare-compute/compose.yaml -f scripts/spare-compute/compose.nvidia.yaml config --quiet
      - name: Build worker
        run: docker build -t wendy-spare-compute:local scripts/spare-compute
      - name: Exercise real Go workloads
        run: python3 scripts/spare-compute/smoke_test.py
