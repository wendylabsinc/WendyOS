name: AI Stability Review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open same-repository PR to investigate"
        required: true
        type: string
      mode:
        description: "Publication requires an explicit choice"
        type: choice
        options: [dry-run, publish]
        default: dry-run

permissions: {}
concurrency:
  group: stability-review-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  test:
    name: Test stability review without credentials
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/stability_review.py
            .github/scripts/stability_review_test.py
            .github/scripts/review_sources.py
            .github/scripts/review_diff.py
          sparse-checkout-cone-mode: false
      - run: python3 .github/scripts/stability_review_test.py

  investigate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.snapshot.outputs.head_sha }}
    steps:
      # Dispatching a ref is a writer's explicit choice of trusted automation.
      # Target PR files are checked out separately and never run as automation.
      - name: Check out dispatched automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts/stability_review.py
            .github/scripts/stability_review_test.py
            .github/scripts/review_sources.py
            .github/scripts/review_diff.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Test trusted review glue
        run: python3 .github/scripts/stability_review_test.py

      - name: Resolve PR and owned findings
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/stability_review.py prepare \
            --repo "$REPO" --pr-number "$PR_NUMBER" --actor "$ACTOR" \
            --directory "$RUNNER_TEMP/stability-review"

      - name: Check out immutable PR head with complete history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.snapshot.outputs.head_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      # The base action supplies the runner, not trust checks or a hard sandbox.
      # Safe/restricted modes disable repo customizations; dontAsk denies commands
      # outside these read-only tool permissions. No GitHub token enters reasoning.
      - name: Investigate stability with read-only tools
        id: agent
        uses: anthropics/claude-code-action/base-action@c84e279f859e2591391e95bd309286eb111c345f # v1
        env:
          NODE_VERSION: '24.x'
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          GIT_TERMINAL_PROMPT: '0'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: ${{ runner.temp }}/stability-review/prompt.txt
          claude_args: >-
            --safe-mode --restricted --strict-mcp-config --mcp-config '{"mcpServers":{}}'
            --permission-mode dontAsk --tools Read,Glob,Grep,Bash
            --allowedTools 'Read,Glob,Grep,Bash(git -C source diff --no-ext-diff --no-textconv *),Bash(git -C source show --no-ext-diff --no-textconv *),Bash(git -C source log --no-ext-diff --no-textconv *),Bash(git -C source ls-tree *),Bash(git -C source merge-base *),Bash(git -C source tag --list *),Bash(git -C source describe *),Bash(git -C source rev-list *),Bash(git -C source rev-parse *)'
            --disallowedTools 'Bash(git -C source *--output*),Bash(git -C source *--ext-diff*),Bash(git -C source *--textconv*)'
            --model claude-opus-5-5 --effort high --max-turns 40 --max-budget-usd 10
            --json-schema '${{ steps.snapshot.outputs.schema }}'

      - name: Validate anchors and preview without publication
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_RESULT: ${{ steps.agent.outputs.structured_output }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/stability_review.py finish --repo "$REPO" \
            --directory "$RUNNER_TEMP/stability-review" --source source
          cat "$RUNNER_TEMP/stability-review/review.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve review data and preview
        if: always() && steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stability-review-${{ github.run_id }}
          path: ${{ runner.temp }}/stability-review/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: investigate
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts/stability_review.py
            .github/scripts/review_sources.py
            .github/scripts/review_diff.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download this run's output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stability-review-${{ github.run_id }}
          path: ${{ runner.temp }}/stability-review
      - name: Fetch immutable source for independent anchor validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.investigate.outputs.head_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck freshness and publish advisory review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/stability_review.py finish --repo "$REPO" \
            --directory "$RUNNER_TEMP/stability-review" --source source --publish
