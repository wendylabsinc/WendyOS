name: Swift E2E Runtime Comparison

# Disposable diagnostic branch only. Product source is identical to 38dce1f34.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-runtime-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.ref == 'refs/heads/kb.e2e.17-runtime-20261125'
    name: 'Ubuntu 24 coverage=${{ matrix.coverage }}'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        coverage: [false, true]
    env:
      WENDY_E2E_PARALLEL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record runner and establish cold caches
        shell: bash
        env:
          COVERAGE: ${{ matrix.coverage }}
          GOCACHE: ${{ runner.temp }}/e2e-runtime-cache/go-build
          GOMODCACHE: ${{ runner.temp }}/e2e-runtime-cache/go-mod
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-comparison"
          git diff --exit-code 38dce1f3422acca274e5f463dbf2d654bdda586d HEAD -- . \
            ':!.github/workflows/swift-e2e-tests.yml' ':!.github/actions/swift-e2e-run/action.yml'
          jq -n --arg coverage "$COVERAGE" --arg sha "$GITHUB_SHA" \
            --arg base 38dce1f3422acca274e5f463dbf2d654bdda586d \
            --arg image_os "${ImageOS:-unknown}" --arg image_version "${ImageVersion:-unknown}" \
            --arg runner_os "$RUNNER_OS" --arg runner_arch "$RUNNER_ARCH" \
            --arg runner_name "$RUNNER_NAME" --argjson cpus "$(getconf _NPROCESSORS_ONLN)" \
            '{coverage:($coverage == "true"), revision:$sha, productBase:$base,
              imageOS:$image_os, imageVersion:$image_version, runnerOS:$runner_os,
              runnerArch:$runner_arch, runnerName:$runner_name, logicalCPUs:$cpus,
              dependencyCacheRestore:false, dependencyCacheSave:false,
              cachePolicy:"one cold-run pair; fresh build/dependency caches before setup"}' \
            > "$RUNNER_TEMP/runtime-comparison/runner.json"
          lscpu -J > "$RUNNER_TEMP/runtime-comparison/cpu.json"
          free -b > "$RUNNER_TEMP/runtime-comparison/memory.txt"
          df -B1 > "$RUNNER_TEMP/runtime-comparison/disk.txt"
          if [[ -f /sys/fs/cgroup/cpu.max ]]; then
            cat /sys/fs/cgroup/cpu.max > "$RUNNER_TEMP/runtime-comparison/cpu-quota.txt"
          fi
          # Only this fresh disposable hosted VM is affected. No cache action restores/saves.
          rm -rf -- swift/WendyE2ETests/.build "$GOCACHE" "$GOMODCACHE" \
            "$HOME/.cache/org.swift.swiftpm" "$HOME/Library/Caches/org.swift.swiftpm"
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          [[ -z "$(find "$GOCACHE" "$GOMODCACHE" -mindepth 1 -print -quit)" ]]
          [[ ! -e swift/WendyE2ETests/.build ]]
          printf 'GOCACHE=%s\nGOMODCACHE=%s\n' "$GOCACHE" "$GOMODCACHE" >> "$GITHUB_ENV"
          printf 'initialGoCacheEntries=0\ninitialSwiftBuild=absent\ncacheAction=skipped\n' > "$RUNNER_TEMP/runtime-comparison/cache-policy.txt"
          printf 'setup\tstart\t%s\n' "$(date --iso-8601=ns)" >> "$RUNNER_TEMP/runtime-comparison/timing.tsv"

      - name: Install libusb
        shell: bash
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update --error-on=any
          sudo apt-get install -y pkg-config libusb-1.0-0-dev

      - name: Run complete Swift E2E arm
        id: e2e
        continue-on-error: true
        uses: ./.github/actions/swift-e2e-run
        with:
          coverage: ${{ matrix.coverage }}
          tests: ''
          workflow_id: swift-e2e-runtime
          target_id: coverage-${{ matrix.coverage }}
          runner_id: ubuntu-24-04
          cli_os: linux
          device_address: 127.0.0.1:50051
          agent_os: linux
          transport: local
          setup: true
          managed_agent: true

      - name: Record arm result
        if: always()
        shell: bash
        env:
          ARM_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-comparison"
          printf '%s\n' "$ARM_OUTCOME" > "$RUNNER_TEMP/runtime-comparison/outcome.txt"

      - name: Upload runtime measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-measurements-coverage-${{ matrix.coverage }}
          path: ${{ runner.temp }}/runtime-comparison/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve failed arm status
        if: always() && steps.e2e.outcome != 'success'
        shell: bash
        run: exit 1
