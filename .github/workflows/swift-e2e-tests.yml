name: Swift E2E Tests

on:
  pull_request:
    paths:
      - 'swift/**'
      - 'Proto/**'
      - '.github/actions/swift-e2e-run/**'
      - '.github/workflows/swift-e2e-tests.yml'
      - '.github/scripts/restore-trusted-build-cache.sh'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tests:
        description: 'Comma-separated SwiftPM test filters (empty = WendyE2ETests)'
        required: false
        default: ''
      target_group:
        description: 'Swift E2E target group to run'
        required: false
        default: all
        type: choice
        options:
          - all
          - local
      diff_base_ref:
        description: 'Optional ref to diff against (empty = full review)'
        required: false
        default: ''
  workflow_call:
    inputs:
      tests:
        type: string
        required: false
        default: ''
      target_group:
        type: string
        required: false
        default: all
      diff_base_ref:
        type: string
        required: false
        default: ''
    secrets:
      WENDY_E2E_SLACK_WEBHOOK_URL:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

concurrency:
  group: swift-e2e-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  swift-e2e-local-macos:
    name: 'Local: macOS 26'
    if: ${{ inputs.target_group == '' || inputs.target_group == 'all' || inputs.target_group == 'local' }}
    runs-on: macos-26
    concurrency:
      group: device-local-macos-hosted
      cancel-in-progress: false
      queue: max
    timeout-minutes: 120
    env:
      # Keep Go's build cache inside the workspace so it can be archived.
      GOCACHE: ${{ github.workspace }}/swift/Build/Go/cache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Capture Xcode version
        id: xcode
        shell: bash
        run: echo "version=$(xcodebuild -version | awk '/Xcode/ { print $2 }')" >> "$GITHUB_OUTPUT"

      # Reuse the WendyAgentMac DerivedData and Go build cache archived by the
      # latest push or manual run on main; see the restore script's SECURITY
      # note and swift-tests.yml for the trust model. Pull requests never archive.
      - name: Restore E2E build cache from main
        # Best effort: a missing or unusable archive means a cold build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_CACHE_WORKFLOW_FILE: swift-e2e-tests.yml
          BUILD_CACHE_TRUSTED_EVENTS: push workflow_dispatch
        shell: bash
        run: |
          .github/scripts/restore-trusted-build-cache.sh \
            e2e-macos-build-xcode-${{ steps.xcode.outputs.version }} \
            swift/Build/Xcode swift/Build/Go

      - uses: ./.github/actions/swift-e2e-run
        with:
          tests: ${{ inputs.tests || '' }}
          target_id: local-macos
          runner_id: macos-26
          cli_os: macOS
          device_address: 127.0.0.1:50051
          agent_os: macOS
          transport: local
          setup: true
          managed_agent: true

      - name: Archive E2E build cache
        id: archive_e2e
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.workflow == 'Swift E2E Tests' }}
        shell: bash
        run: |
          set -euo pipefail
          # GNU tar keeps the nanosecond mtimes incremental builds compare.
          gtar --posix -cf - --exclude=swift/Build/Xcode/Logs swift/Build/Xcode swift/Build/Go \
            | zstd -T0 -3 -q -o "$RUNNER_TEMP/e2e-macos-build-xcode-${{ steps.xcode.outputs.version }}.tar.zst"

      - name: Upload E2E build cache
        if: ${{ !cancelled() && steps.archive_e2e.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-macos-build-xcode-${{ steps.xcode.outputs.version }}
          path: ${{ runner.temp }}/e2e-macos-build-xcode-${{ steps.xcode.outputs.version }}.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  swift-e2e-local-ubuntu:
    name: 'Local: Ubuntu 24'
    if: ${{ inputs.target_group == '' || inputs.target_group == 'all' || inputs.target_group == 'local' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: device-local-ubuntu-hosted
      cancel-in-progress: false
      queue: max
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The Linux wendy CLI links libusb via cgo (Thor flashing); the harness
      # builds the CLI on this runner.
      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y pkg-config libusb-1.0-0-dev
      - uses: ./.github/actions/swift-e2e-run
        with:
          tests: ${{ inputs.tests || '' }}
          target_id: local-ubuntu-24
          runner_id: ubuntu-24-04
          cli_os: linux
          device_address: 127.0.0.1:50051
          agent_os: linux
          transport: local
          setup: true
          managed_agent: true

  # Physical/future route ledger.
  # Keep disabled routes close to the hosted local jobs so re-enabling a route is
  # a small uncomment-and-add-to-analysis-needs change while runner labels stay explicit.
  # Physical routes are gated by target agent OS: Linux/WendyOS targets depend on
