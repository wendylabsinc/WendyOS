  swift-e2e-analyze:
    name: Analyze E2E Results
    if: ${{ always() && !cancelled() }}
    needs:
      - swift-e2e-local-macos
      - swift-e2e-local-ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLAUDE_CODE_VERSION: '2.1.199'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Ensure Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          for dir in "$HOME/.swiftly/bin" "$HOME/.local/share/swiftly/bin" /usr/share/swift/usr/bin; do
            if [[ -d "$dir" ]]; then
              echo "$dir" >> "$GITHUB_PATH"
              export PATH="$dir:$PATH"
            fi
          done
          if command -v swift >/dev/null 2>&1; then
            swift --version
            exit 0
          fi

          echo "==> Swift not preinstalled; installing via swiftly"
          swiftly_version="1.1.3"
          architecture="$(uname -m)"
          case "$architecture" in
            x86_64)
              swiftly_sha256="4c4adb7b7ad7910f38c52b94a938c309586fe395e1fe1538c397384ee36bfff0"
              ;;
            aarch64)
              swiftly_sha256="cc4f912fff6c7f53704fc6d22f9e8ee7fdf6bd574ad276998f7502418bf5a45a"
              ;;
            *)
              echo "::error::No pinned swiftly checksum for architecture: ${architecture}"
              exit 1
              ;;
          esac
          temporary_dir="$(mktemp -d)"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${swiftly_version}-${architecture}.tar.gz" \
            -o "$temporary_dir/swiftly.tar.gz"
          echo "${swiftly_sha256}  $temporary_dir/swiftly.tar.gz" | sha256sum --check --strict
          tar -xzf "$temporary_dir/swiftly.tar.gz" -C "$temporary_dir"
          (
            cd "$temporary_dir"
            ./swiftly init --assume-yes --quiet-shell-followup --platform ubuntu24.04
          )
          swiftly_env="${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          # shellcheck disable=SC1090
          . "$swiftly_env"
          (
            cd "$HOME"
            swiftly install --use latest --assume-yes
          )
          rm -rf "$temporary_dir"
          echo "${SWIFTLY_BIN_DIR:-$HOME/.local/share/swiftly/bin}" >> "$GITHUB_PATH"
          swift --version

      - name: Capture Swift toolchain version
        id: swift-toolchain
        shell: bash
        run: |
          set -euo pipefail
          version="$(swift --version | head -n 1 | tr -cs '[:alnum:]._-' '-')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM package resolution
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            swift/WendyE2ETests/.build/checkouts
            swift/WendyE2ETests/.build/repositories
            ~/.cache/org.swift.swiftpm
          key: swift-e2e-swiftpm-${{ runner.os }}-${{ steps.swift-toolchain.outputs.version }}-${{ hashFiles('swift/WendyE2ETests/Package.resolved') }}
          restore-keys: |
            swift-e2e-swiftpm-${{ runner.os }}-${{ steps.swift-toolchain.outputs.version }}-
            swift-e2e-swiftpm-${{ runner.os }}-

      - name: Compute Swift E2E run ID
        id: e2e-run
        shell: bash
        run: |
          set -euo pipefail
          slug() {
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^[:alnum:]._-]+/-/g; s/-+/-/g; s/^-//; s/-$//'
          }

          workflow_id="$(slug "${GITHUB_WORKFLOW:-swift-e2e-tests}")"
          printf -v attempt_suffix '%04d' "${GITHUB_RUN_ATTEMPT:-1}"
          echo "run_artifact_id=${workflow_id}.gh${GITHUB_RUN_ID}.run.${attempt_suffix}" >> "$GITHUB_OUTPUT"
          echo "run_dir=${RUNNER_TEMP}/wendy/${workflow_id}.gh${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Prepare Swift E2E analysis workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            "${RUNNER_TEMP}/wendy-raw/${{ github.run_id }}" \
            "${{ steps.e2e-run.outputs.run_dir }}"

      - name: Download Swift E2E attempts
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/wendy-raw/${{ github.run_id }}
          pattern: swift-e2e-tests.gh${{ github.run_id }}.*

      - name: Normalize Swift E2E attempt artifact layout
        shell: bash
        run: |
          set -euo pipefail
          raw_dir="${RUNNER_TEMP}/wendy-raw/${{ github.run_id }}"

          # WORKAROUND: actions/download-artifact has no setting that makes matched
          # artifacts always extract the same way. A single matched artifact extracts
          # directly into `path`, while multiple matched artifacts extract into child
          # directories. Normalize the single-artifact case so aggregation always sees:
          #   <raw_dir>/<attempt-id>/attempt.json
          if [[ -f "${raw_dir}/attempt.json" ]]; then
            attempt_id="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["attemptID"])' "${raw_dir}/attempt.json")"
            if [[ -z "${attempt_id}" || "${attempt_id}" == *"/"* ]]; then
              echo "ERROR: invalid Swift E2E attempt ID: ${attempt_id}" >&2
              exit 1
            fi

            normalized_dir="${RUNNER_TEMP}/wendy-normalized/${{ github.run_id }}"
            rm -rf "${normalized_dir}"
            mkdir -p "${normalized_dir}/${attempt_id}"

            shopt -s dotglob nullglob
            entries=("${raw_dir}"/*)
            if [[ ${#entries[@]} -eq 0 ]]; then
              echo "ERROR: downloaded Swift E2E attempt artifact is empty: ${raw_dir}" >&2
              exit 1
            fi
            mv "${entries[@]}" "${normalized_dir}/${attempt_id}/"
            rm -rf "${raw_dir}"
            mv "${normalized_dir}" "${raw_dir}"
          fi

      - name: Aggregate Swift E2E attempts
        working-directory: swift
        shell: bash
        run: |
          set -euo pipefail
          attempt_dirs=()
          while IFS= read -r attempt_dir; do
            attempt_dirs+=("$attempt_dir")
          done < <(find "${RUNNER_TEMP}/wendy-raw/${{ github.run_id }}" -mindepth 1 -maxdepth 1 -type d | sort)
          if [[ ${#attempt_dirs[@]} -eq 0 ]]; then
            echo "ERROR: no Swift E2E attempt artifacts downloaded." >&2
            exit 1
          fi
          bash ./Scripts/E2EAggregate.sh \
            --output-dir "${RUNNER_TEMP}/wendy" \
            "${attempt_dirs[@]}"

      - name: Set up Node.js for review tools
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Claude Code
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Resolve AI review auth
        id: review-auth
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          SLACK_WEBHOOK_URL: ${{ secrets.WENDY_E2E_SLACK_WEBHOOK_URL || '' }}
        run: |
          set -euo pipefail

          auth_mode="none"
          failure_reason=""

          if [[ -n "${CLAUDE_CODE_OAUTH_TOKEN}" ]]; then
            echo "==> Probing Claude Code subscription auth"
            # Probe output can quote fragments of the failing credential or the
            # HTTP response; discard it entirely — only the exit status matters.
            if timeout 120 claude --model claude-haiku-4-5 --print 'Reply with: ok' \
              > /dev/null 2>&1; then
              auth_mode="subscription"
              echo "Claude Code subscription auth verified."
            else
              failure_reason="CLAUDE_CODE_OAUTH_TOKEN is configured but failed an auth probe (expired or revoked?)"
              echo "::warning::Swift E2E AI review: ${failure_reason}."
            fi
          else
            failure_reason="CLAUDE_CODE_OAUTH_TOKEN secret is not configured"
            echo "::warning::Swift E2E AI review: ${failure_reason}."
          fi

          if [[ "${auth_mode}" != "subscription" ]]; then
            if [[ -n "${ANTHROPIC_API_KEY}" ]]; then
              auth_mode="api-key"
              echo "::warning::Swift E2E AI review: falling back to ANTHROPIC_API_KEY (per-token billing)."
            else
              echo "::warning::Swift E2E AI review: no ANTHROPIC_API_KEY fallback configured; the review will be skipped."
            fi
          fi
          echo "auth_mode=${auth_mode}" >> "$GITHUB_OUTPUT"

          if [[ "${auth_mode}" == "subscription" ]]; then
            exit 0
          fi
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "WENDY_E2E_SLACK_WEBHOOK_URL is not configured; skipping Slack auth warning."
            exit 0
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fallback_note="Falling back to ANTHROPIC_API_KEY (per-token billing)."
          if [[ "${auth_mode}" == "none" ]]; then
            fallback_note="No ANTHROPIC_API_KEY fallback configured either; the AI review was skipped."
          fi
          jq -n \
            --arg reason "${failure_reason}" \
            --arg fallback "${fallback_note}" \
            --arg run_url "${run_url}" \
            '{
              attachments: [
                {
                  color: "#f59e0b",
                  blocks: [
                    {
                      type: "header",
                      text: {
                        type: "plain_text",
                        text: "⚠️ Swift E2E AI review subscription auth",
                        emoji: true
                      }
                    },
                    {
                      type: "section",
                      text: { type: "mrkdwn", text: "\($reason).\n\($fallback)" }
                    },
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: "Runbook: run `claude setup-token` while signed in with the CI Claude seat account, then update the `CLAUDE_CODE_OAUTH_TOKEN` GitHub Actions secret."
                      }
                    },
                    {
                      type: "actions",
                      elements: [
                        {
                          type: "button",
                          text: { type: "plain_text", text: "Open GitHub Actions" },
                          url: $run_url
                        }
                      ]
                    }
                  ]
                }
              ]
            }' \
            | curl --fail --silent --show-error \
                -X POST \
                -H 'Content-type: application/json' \
                --data @- \
                "${SLACK_WEBHOOK_URL}" \
            || echo "::warning::Failed to post the Slack auth warning."

      - name: Verify AI review harness
        shell: bash
        run: |
          set -euo pipefail
          if command -v codex >/dev/null 2>&1; then
            codex --version
          fi
          if command -v claude >/dev/null 2>&1; then
            claude --version
          fi
          if ! command -v codex >/dev/null 2>&1 && ! command -v claude >/dev/null 2>&1; then
            echo "::error::Codex or Claude Code must be preinstalled on the AI runner"
            exit 1
          fi

      - name: Perform Swift E2E AI Review
        timeout-minutes: 15
        continue-on-error: true
        working-directory: swift
        shell: bash
        env:
          DIFF_BASE_REF: ${{ inputs.diff_base_ref || '' }}
          # Expose exactly one credential, chosen by the auth probe above.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.review-auth.outputs.auth_mode == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ steps.review-auth.outputs.auth_mode == 'api-key' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          set -euo pipefail
          review_args=(--run-dir "${{ steps.e2e-run.outputs.run_dir }}")

          resolve_diff_base_ref() {
            local ref="$1"
            local candidate
            local candidates=("$ref")

            if [[ "$ref" != refs/* ]]; then
              candidates+=("origin/$ref" "refs/remotes/origin/$ref" "refs/tags/$ref")
            elif [[ "$ref" == refs/heads/* ]]; then
              candidates+=("refs/remotes/origin/${ref#refs/heads/}")
            fi

            for candidate in "${candidates[@]}"; do
              if git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then
                printf '%s' "$candidate"
                return 0
              fi
            done
            return 1
          }

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            review_args+=(--diff "origin/main...HEAD")
          elif [[ -n "${DIFF_BASE_REF}" ]]; then
            resolved_base="$(resolve_diff_base_ref "${DIFF_BASE_REF}" || true)"
            if [[ -z "${resolved_base}" ]]; then
              if git fetch --force --tags origin "${DIFF_BASE_REF}"; then
                resolved_base="$(resolve_diff_base_ref "${DIFF_BASE_REF}" || true)"
                if [[ -z "${resolved_base}" ]] && git rev-parse --verify --quiet "FETCH_HEAD^{commit}" >/dev/null; then
                  resolved_base="FETCH_HEAD"
                fi
              fi
            fi
            if [[ -z "${resolved_base}" ]]; then
              echo "ERROR: unable to resolve diff base ref: ${DIFF_BASE_REF}" >&2
              exit 1
            fi
            review_args+=(--diff "${resolved_base}...HEAD")
          fi
          bash ./Scripts/E2EReview.sh "${review_args[@]}"

      - name: Render Swift E2E Report
        if: always()
        working-directory: swift
        shell: bash
        run: |
          set -euo pipefail
          bash ./Scripts/E2EReport.sh \
            --run-dir "${{ steps.e2e-run.outputs.run_dir }}"

      - name: Upload Swift E2E Report
        id: upload_e2e_report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.e2e-run.outputs.run_artifact_id }}
          path: ${{ steps.e2e-run.outputs.run_dir }}/**
          if-no-files-found: warn
          retention-days: 14

      - name: Post Swift E2E PR Review
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          REPO: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          HEAD_LABEL: ${{ github.event.pull_request.head.label || github.head_ref || github.ref_name }}
          COMMENT_PATH: ${{ steps.e2e-run.outputs.run_dir }}/review.md
          REPORT_ARTIFACT_NAME: ${{ steps.e2e-run.outputs.run_artifact_id }}
          REPORT_ARTIFACT_URL: ${{ steps.upload_e2e_report.outputs['artifact-url'] }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');

            const commentPath = process.env.COMMENT_PATH;
            if (!fs.existsSync(commentPath)) {
              core.info(`No Swift E2E review aggregate found at ${commentPath}; skipping.`);
              return;
            }

            const [owner, repo] = process.env.REPO.split('/');
            const headRef = process.env.HEAD_REF;
            const headLabel = process.env.HEAD_LABEL;
            let prNumber = process.env.PR_NUM;

            if (!prNumber) {
              const qualifiedHead = headLabel?.includes(':') ? headLabel : `${context.repo.owner}:${headRef}`;
              const heads = [qualifiedHead, headLabel, headRef].filter((value, index, values) =>
                value && values.indexOf(value) === index
              );
              for (const head of heads) {
                const { data: pulls } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  head,
                  per_page: 1,
                });
                if (pulls.length > 0) {
                  prNumber = String(pulls[0].number);
                  break;
                }
              }
            }

            if (!prNumber) {
              core.info(`No open PR found for ${headRef}; skipping Swift E2E review comment.`);
              return;
            }

            let body = fs.readFileSync(commentPath, 'utf8');
            const artifactURL = process.env.REPORT_ARTIFACT_URL;
            if (artifactURL) {
              const artifactName = process.env.REPORT_ARTIFACT_NAME || 'Swift E2E report';
              body = `${body.trimEnd()}\n\n---\n\nReport artifact: [${artifactName}](${artifactURL})\n`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: Number(prNumber),
              per_page: 100,
            });
            const existing = comments.filter((comment) =>
              comment.body?.startsWith('# Swift E2E Review')
            );

            for (const comment of existing) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: comment.id,
              });
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: Number(prNumber),
              body,
            });

      - name: Post Swift E2E Slack Review
        if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WENDY_E2E_SLACK_WEBHOOK_URL || '' }}
          REPORT_ARTIFACT_NAME: ${{ steps.e2e-run.outputs.run_artifact_id }}
          REPORT_ARTIFACT_URL: ${{ steps.upload_e2e_report.outputs['artifact-url'] }}
          DIFF_BASE_REF: ${{ inputs.diff_base_ref || '' }}
          TESTS: ${{ inputs.tests || '' }}
          E2E_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "WENDY_E2E_SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            exit 0
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          artifact_url="${REPORT_ARTIFACT_URL:-}"
          artifact_name="${REPORT_ARTIFACT_NAME:-Swift E2E report}"
          review_mode="full"
          if [[ -n "${DIFF_BASE_REF}" ]]; then
            review_mode="diff"
          fi
          tested_ref="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          short_sha="${GITHUB_SHA:0:12}"
          tests_label="${TESTS:-WendyE2ETests}"

          case "${E2E_RESULT:-unknown}" in
            success)
              status_title="Passed"
              status_emoji="✅"
              status_color="#22c55e"
              ;;
            failure)
              status_title="Failed"
              status_emoji="❌"
              status_color="#ef4444"
              ;;
            cancelled)
              status_title="Cancelled"
              status_emoji="⏹️"
              status_color="#f59e0b"
              ;;
            skipped)
              status_title="Skipped"
              status_emoji="⏭️"
              status_color="#94a3b8"
              ;;
            *)
              status_title="Unknown"
              status_emoji="❔"
              status_color="#64748b"
              ;;
          esac

          jq -n \
            --arg color "${status_color}" \
            --arg title "${status_emoji} ${status_title}" \
            --arg mode "${review_mode}" \
            --arg ref "${tested_ref}" \
            --arg sha "${short_sha}" \
            --arg trigger "${GITHUB_EVENT_NAME}" \
            --arg actor "${GITHUB_ACTOR}" \
            --arg tests "${tests_label}" \
            --arg diff_base "${DIFF_BASE_REF}" \
            --arg run_url "${run_url}" \
            --arg artifact_url "${artifact_url}" \
            --arg artifact_name "${artifact_name}" \
            '{
              attachments: [
                {
                  color: $color,
                  blocks: (
                    [
                      {
                        type: "header",
                        text: {
                          type: "plain_text",
                          text: $title,
                          emoji: true
                        }
                      },
                      {
                        type: "section",
                        fields: [
                          { type: "mrkdwn", text: "*Mode:*\n\($mode)" },
                          { type: "mrkdwn", text: "*Tests:*\n\($tests)" },
                          { type: "mrkdwn", text: "*Ref:*\n\($ref)" },
                          { type: "mrkdwn", text: "*Commit:*\n`\($sha)`" },
                          { type: "mrkdwn", text: "*Trigger:*\n\($trigger)" },
                          { type: "mrkdwn", text: "*Actor:*\n\($actor)" }
                        ]
                      }
                    ]
                    + (
                      if $diff_base != "" then
                        [
                          {
                            type: "context",
                            elements: [
                              { type: "mrkdwn", text: "*Diff base:* `\($diff_base)`" }
                            ]
                          }
                        ]
                      else [] end
                    )
                    + [
                      {
                        type: "actions",
                        elements: (
                          [
                            {
                              type: "button",
                              text: { type: "plain_text", text: "Open GitHub Actions" },
                              url: $run_url
                            }
                          ]
                          + (
                            if $artifact_url != "" then
                              [
                                {
                                  type: "button",
                                  text: { type: "plain_text", text: "Open E2E Report" },
                                  url: $artifact_url
                                }
                              ]
                            else [] end
                          )
                        )
                      }
                    ]
                    + (
                      if $artifact_url != "" then
                        [
                          {
                            type: "context",
                            elements: [
                              { type: "mrkdwn", text: "Report artifact: <\($artifact_url)|\($artifact_name)>" }
                            ]
                          }
                        ]
                      else [] end
                    )
                  )
                }
              ]
            }' \
            > slack-payload.json
          curl --fail --silent --show-error \
            -X POST \
            -H 'Content-type: application/json' \
            --data @slack-payload.json \
            "${SLACK_WEBHOOK_URL}"
