name: Swift Tests

# Build caching: every run restores the SwiftPM build directory and Xcode
# DerivedData archived by the latest scheduled or manual run on main, so it
# recompiles only first-party code instead of every dependency. Only those
# trusted runs archive; pull requests, including forks, never do. Archives are
# run artifacts, not actions/cache entries, because other workflows running in
# main's context could write main-scoped cache entries (see
# .github/scripts/restore-trusted-build-cache.sh). Restored outputs are only
# reusable at the same absolute path, so archives are also scoped to the
# self-hosted runner name.
#
# SECURITY: Pull requests reuse dependency outputs compiled by main's own
# workflow. The wendy-mac group must enforce the isolation described in
# .github/CI_SECURITY.md between PR jobs and release credentials.
# The restore verifies GitHub's recorded SHA-256 digest of each archive and
# rejects entries that could escape the workspace before and after extracting
# it into a staging directory. First-party code is always rebuilt.

on:
  workflow_call:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

concurrency:
  group: swift-tests-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  XCODE_VERSION: '26.3'

jobs:
  test:
    name: Run WendyAgentCore Tests
    runs-on:
      group: wendy-mac
      labels: [self-hosted, macOS, ARM64]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-macos-ci

      - name: Install build cache tools
        shell: bash
        run: |
          missing=()
          for formula in gh gnu-tar zstd; do
            brew list --versions "$formula" >/dev/null 2>&1 || missing+=("$formula")
          done
          if (( ${#missing[@]} )); then brew install "${missing[@]}"; fi

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Capture selected Xcode version
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(xcodebuild -version | awk '/Xcode/ { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache from main
        # Best effort: a missing or unusable archive means a cold build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_CACHE_WORKFLOW_FILE: swift-tests.yml
        shell: bash
        run: .github/scripts/restore-trusted-build-cache.sh swiftpm-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }} swift/Build/SwiftPM

      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: '1.75.0'
          setup_only: true
          pr_comment: false

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '34.0'
          repo-token: ${{ github.token }}

      - name: Check shared gRPC API contracts
        run: bash swift/Scripts/GenerateProto.sh --check-shared-grpc-api-contracts

      - name: Test Mac network-access migration
        run: bash swift/Scripts/NetworkAccessPreferences_test.sh

      - name: Run swift test
        working-directory: swift
        shell: bash
        run: bash ./Scripts/Test.sh

      - name: Archive SwiftPM build cache
        id: archive_swiftpm
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          # GNU tar keeps the nanosecond mtimes incremental builds compare.
          gtar --posix -cf - swift/Build/SwiftPM \
            | zstd -T0 -3 -q -o "$RUNNER_TEMP/swiftpm-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}.tar.zst"

      - name: Upload SwiftPM build cache
        if: ${{ !cancelled() && steps.archive_swiftpm.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: swiftpm-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}
          path: ${{ runner.temp }}/swiftpm-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  build:
    permissions:
      actions: read
      contents: read
    name: Build WendyAgentMac app
    runs-on:
      group: wendy-mac
      labels: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-macos-ci

      - name: Install build cache tools
        shell: bash
        run: |
          missing=()
          for formula in gh gnu-tar zstd; do
            brew list --versions "$formula" >/dev/null 2>&1 || missing+=("$formula")
          done
          if (( ${#missing[@]} )); then brew install "${missing[@]}"; fi

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Capture selected Xcode version
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(xcodebuild -version | awk '/Xcode/ { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode build cache from main
        # Best effort: a missing or unusable archive means a cold build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_CACHE_WORKFLOW_FILE: swift-tests.yml
        shell: bash
        run: |
          .github/scripts/restore-trusted-build-cache.sh \
            xcode-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }} \
            swift/Build/CI/PackageCache swift/Build/CI/SourcePackages swift/Build/Xcode

      - name: Resolve Swift package dependencies
        working-directory: swift
        env:
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/swift/Build/CI/PackageCache
          SOURCE_PACKAGES_DIR: ${{ github.workspace }}/swift/Build/CI/SourcePackages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_CACHE_DIR" "$SOURCE_PACKAGES_DIR"

          xcodebuild -resolvePackageDependencies \
            -workspace WendyAgent.xcworkspace \
            -scheme WendyAgentMac \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -packageCachePath "$PACKAGE_CACHE_DIR" \
            -skipMacroValidation

      - name: Build WendyAgentMac app
        id: build_wendy_agent_mac_app
        working-directory: swift
        env:
          DERIVED_DATA_PATH: ${{ github.workspace }}/swift/Build/Xcode
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/swift/Build/CI/PackageCache
          SOURCE_PACKAGES_DIR: ${{ github.workspace }}/swift/Build/CI/SourcePackages
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild build \
            -workspace WendyAgent.xcworkspace \
            -scheme WendyAgentMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -packageCachePath "$PACKAGE_CACHE_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipMacroValidation

      - name: Archive Xcode build cache
        id: archive_xcode
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          # GNU tar keeps the nanosecond mtimes incremental builds compare.
          gtar --posix -cf - --exclude=swift/Build/Xcode/Logs \
            swift/Build/CI/PackageCache swift/Build/CI/SourcePackages swift/Build/Xcode \
            | zstd -T0 -3 -q -o "$RUNNER_TEMP/xcode-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}.tar.zst"

      - name: Upload Xcode build cache
        if: ${{ !cancelled() && steps.archive_xcode.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xcode-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}
          path: ${{ runner.temp }}/xcode-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Test macOS provisioning validation
        working-directory: swift
        shell: bash
        run: python3 ./Scripts/ValidateMacProvisioning_test.py

      - name: Test launch agent supervision
        working-directory: swift
        env:
          APP_PATH: ${{ github.workspace }}/swift/Build/Xcode/Build/Products/Debug/WendyAgentMac.app
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint "$APP_PATH/Contents/Library/LaunchAgents/sh.wendy.WendyAgentMac.plist"
          bash ./Scripts/TestLaunchAgentSupervision.sh
