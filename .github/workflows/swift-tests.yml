name: Swift Tests

# Build caching: every run restores the SwiftPM build directory and Xcode
# DerivedData archived by the latest scheduled or manual run on main, so it
# recompiles only first-party code instead of every dependency. Only those
# trusted runs archive; pull requests, including forks, never do. Archives are
# run artifacts, not actions/cache entries, because other workflows running in
# main's context could write main-scoped cache entries (see
# .github/scripts/restore-trusted-build-cache.sh). Restored outputs are only
# reusable at the same absolute path, which hosted runners keep.
#
# SECURITY: Pull requests reuse dependency outputs compiled by main's own
# workflow on ephemeral GitHub-hosted runners, the same trust as main's source.
# The restore verifies GitHub's recorded SHA-256 digest of each archive and
# rejects entries that could escape the workspace before and after extracting
# it into a staging directory. First-party code is always rebuilt.

on:
  pull_request:
    paths:
      - 'swift/**'
      - 'Proto/**'
      - '.github/workflows/**'
      - '.github/scripts/restore-trusted-build-cache.sh'
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

concurrency:
  group: swift-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  XCODE_VERSION: '26.3'

jobs:
  test:
    name: Run WendyAgentCore Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Capture selected Xcode version
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(xcodebuild -version | awk '/Xcode/ { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache from main
        # Best effort: a missing or unusable archive means a cold build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_CACHE_WORKFLOW_FILE: swift-tests.yml
        shell: bash
        run: .github/scripts/restore-trusted-build-cache.sh swiftpm-build-xcode-${{ steps.xcode.outputs.version }} swift/Build/SwiftPM

      - name: Run swift test
        working-directory: swift
        shell: bash
        run: bash ./Scripts/Test.sh

      - name: Archive SwiftPM build cache
        id: archive_swiftpm
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          # GNU tar keeps the nanosecond mtimes incremental builds compare.
          gtar --posix -cf - swift/Build/SwiftPM \
            | zstd -T0 -3 -q -o "$RUNNER_TEMP/swiftpm-build-xcode-${{ steps.xcode.outputs.version }}.tar.zst"

      - name: Upload SwiftPM build cache
        if: ${{ !cancelled() && steps.archive_swiftpm.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: swiftpm-build-xcode-${{ steps.xcode.outputs.version }}
          path: ${{ runner.temp }}/swiftpm-build-xcode-${{ steps.xcode.outputs.version }}.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  build:
    name: Build WendyAgentMac app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Capture selected Xcode version
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(xcodebuild -version | awk '/Xcode/ { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode build cache from main
        # Best effort: a missing or unusable archive means a cold build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_CACHE_WORKFLOW_FILE: swift-tests.yml
        shell: bash
        run: |
          .github/scripts/restore-trusted-build-cache.sh \
            xcode-build-xcode-${{ steps.xcode.outputs.version }} \
            swift/Build/CI/PackageCache swift/Build/CI/SourcePackages swift/Build/Xcode

      - name: Resolve Swift package dependencies
        working-directory: swift
        env:
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/swift/Build/CI/PackageCache
          SOURCE_PACKAGES_DIR: ${{ github.workspace }}/swift/Build/CI/SourcePackages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_CACHE_DIR" "$SOURCE_PACKAGES_DIR"

          xcodebuild -resolvePackageDependencies \
            -workspace WendyAgent.xcworkspace \
            -scheme WendyAgentMac \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -packageCachePath "$PACKAGE_CACHE_DIR" \
            -skipMacroValidation

      - name: Build WendyAgentMac app
        id: build_wendy_agent_mac_app
        working-directory: swift
        env:
          DERIVED_DATA_PATH: ${{ github.workspace }}/swift/Build/Xcode
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/swift/Build/CI/PackageCache
          SOURCE_PACKAGES_DIR: ${{ github.workspace }}/swift/Build/CI/SourcePackages
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild build \
            -workspace WendyAgent.xcworkspace \
            -scheme WendyAgentMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -packageCachePath "$PACKAGE_CACHE_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipMacroValidation

      - name: Archive Xcode build cache
        id: archive_xcode
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          # GNU tar keeps the nanosecond mtimes incremental builds compare.
          gtar --posix -cf - --exclude=swift/Build/Xcode/Logs \
            swift/Build/CI/PackageCache swift/Build/CI/SourcePackages swift/Build/Xcode \
            | zstd -T0 -3 -q -o "$RUNNER_TEMP/xcode-build-xcode-${{ steps.xcode.outputs.version }}.tar.zst"

      - name: Upload Xcode build cache
        if: ${{ !cancelled() && steps.archive_xcode.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xcode-build-xcode-${{ steps.xcode.outputs.version }}
          path: ${{ runner.temp }}/xcode-build-xcode-${{ steps.xcode.outputs.version }}.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Test macOS provisioning validation
        working-directory: swift
        shell: bash
        run: python3 ./Scripts/ValidateMacProvisioning_test.py

      - name: Test launch agent supervision
        working-directory: swift
        env:
          APP_PATH: ${{ github.workspace }}/swift/Build/Xcode/Build/Products/Debug/WendyAgentMac.app
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint "$APP_PATH/Contents/Library/LaunchAgents/sh.wendy.WendyAgentMac.plist"
          bash ./Scripts/TestLaunchAgentSupervision.sh

  lint:
    name: Lint Swift Sources
    # Lint reports to the pull request; scheduled cache runs have none.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    container: swift:6.2.3
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Swift Lint
        id: lint
        working-directory: swift
        shell: bash
        run: |
          set +e
          set -o pipefail
          bash ./Scripts/Lint.sh 2>&1 | tee lint_output.txt
          status=${PIPESTATUS[0]}
          {
            echo "lint_output<<EOF"
            cat lint_output.txt
            echo "EOF"
            echo "exit_code=$status"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove Previous Lint Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const targetHeader = '## Swift Lint Failed';
            for (const comment of comments) {
              if (comment.user?.type === 'Bot' && comment.body?.includes(targetHeader)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

      - name: Comment on PR
        if: steps.lint.outputs.exit_code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          LINT_OUTPUT: ${{ steps.lint.outputs.lint_output }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const lintOutput = process.env.LINT_OUTPUT?.trim();
            const formattedOutput = lintOutput ? `\`\`\`\n${lintOutput}\n\`\`\`` : '_No linter output captured._';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Swift Lint Failed
            
            The Swift linter found issues with your code. Please run the following commands to fix them:
            
            \`\`\`
            cd swift
            make format
            \`\`\`
            
            <details>
            <summary>Lint issues</summary>
            
            ${formattedOutput}
            
            </details>
            
            Then commit and push the changes.`
            });

      - name: Fail workflow on lint issues
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1
