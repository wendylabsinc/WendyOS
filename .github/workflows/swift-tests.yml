name: Swift Tests

# Build caching: every run restores the SwiftPM build directory and Xcode
# DerivedData archived by the latest scheduled or manual run on main, so it
# recompiles only first-party code instead of every dependency. Only those
# trusted runs archive; pull requests, including forks, never do. Archives are
# run artifacts, not actions/cache entries, because other workflows running in
# main's context could write main-scoped cache entries (see
# .github/scripts/restore-trusted-build-cache.sh). Restored outputs are only
# reusable at the same absolute path, so archives are also scoped to the
# self-hosted runner name.
#
# SECURITY: Pull requests reuse dependency outputs compiled by main's own
# workflow. The wendy-mac group must enforce the isolation described in
# .github/CI_SECURITY.md between PR jobs and release credentials.
# The restore verifies GitHub's recorded SHA-256 digest of each archive and
# rejects entries that could escape the workspace before and after extracting
# it into a staging directory. First-party code is always rebuilt.

on:
  workflow_call:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

concurrency:
  group: swift-tests-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: Run WendyAgentCore Tests
    runs-on:
      group: wendy-mac
      labels: [self-hosted, macOS, ARM64]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-macos-ci

      - name: Install build cache tools
        shell: bash
        run: |
          missing=()
          for formula in gh gnu-tar zstd; do
            brew list --versions "$formula" >/dev/null 2>&1 || missing+=("$formula")
          done
          if (( ${#missing[@]} )); then brew install "${missing[@]}"; fi

      - name: Verify documented Swift Agent configuration
        timeout-minutes: 4
        run: python3 .github/scripts/check-swift-agent-docs.py --evidence "$RUNNER_TEMP/swift-agent-docs"

      - name: Retain compiled Agent documentation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: swift-agent-docs
          path: |
            ${{ runner.temp }}/swift-agent-docs/result.json
            ${{ runner.temp }}/swift-agent-docs/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Capture active Xcode version
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(xcodebuild -version | awk '/Xcode/ { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache from main
        # Best effort: a missing or unusable archive means a cold build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_CACHE_WORKFLOW_FILE: swift-tests.yml
        shell: bash
        run: .github/scripts/restore-trusted-build-cache.sh swiftpm-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }} swift/Build/SwiftPM

      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: '1.75.0'
          setup_only: true
          pr_comment: false

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '34.0'
          repo-token: ${{ github.token }}

      - name: Check shared gRPC API contracts
        run: bash swift/Scripts/GenerateProto.sh --check-shared-grpc-api-contracts

      - name: Test Mac network-access migration
        run: bash swift/Scripts/NetworkAccessPreferences_test.sh

      - name: Require real Mac Agent acknowledgement and exit watchdog
        run: python3 .github/scripts/test-mac-agent-termination.py --output "$RUNNER_TEMP/mac-agent-termination"

      - name: Retain Mac Agent termination evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mac-agent-termination
          path: |
            ${{ runner.temp }}/mac-agent-termination/*.json
            ${{ runner.temp }}/mac-agent-termination/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Require Location decisions and the real unanswered timeout
        timeout-minutes: 10
        run: |
          python3 .github/scripts/run-owned-media-test.py --timeout 60 -- bash swift/Scripts/TestLocationPermissionRequest.sh
          python3 .github/scripts/test-mac-location-permission.py "$RUNNER_TEMP/location-permission"

      - name: Preserve Location permission evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: location-permission
          path: |
            ${{ runner.temp }}/location-permission/**/*.log
            ${{ runner.temp }}/location-permission/**/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Create temporary test Keychain
        id: keychain
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, secrets, shlex, subprocess, tempfile

          # File-Keychain preferences are per user, not per shell/session.
          # Refuse to interfere with another runner using this account.
          commands = subprocess.check_output(["ps", "-U", str(os.getuid()), "-o", "comm="], text=True).splitlines()
          listeners = sum(pathlib.Path(command.strip()).name == "Runner.Listener" for command in commands)
          workers = sum(pathlib.Path(command.strip()).name == "Runner.Worker" for command in commands)
          print(f"Runner processes for test account: {listeners} listener(s), {workers} worker(s).", flush=True)
          if listeners != 1 or workers != 1:
              raise SystemExit("Temporary default Keychain requires an account with exactly one runner.")

          def security(*args):
              result = subprocess.run(["security", *args], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit(f"security {args[0]} failed ({result.returncode})")
              return result.stdout

          original = {
              "default": shlex.split(security("default-keychain", "-d", "user")),
              "search": shlex.split(security("list-keychains", "-d", "user")),
          }
          state = pathlib.Path(tempfile.mkdtemp(prefix="swift-keychain-", dir=os.environ["RUNNER_TEMP"]))
          (state / "original.json").write_text(json.dumps(original))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"directory={state}", file=output)
          password = secrets.token_hex(32)
          print(f"::add-mask::{password}", flush=True)
          keychain = str(state / "test.keychain-db")
          security("create-keychain", "-p", password, keychain)
          security("set-keychain-settings", "-lut", "21600", keychain)
          security("unlock-keychain", "-p", password, keychain)
          security("default-keychain", "-d", "user", "-s", keychain)
          security("list-keychains", "-d", "user", "-s", keychain)
          assert shlex.split(security("default-keychain", "-d", "user")) == [keychain]
          assert shlex.split(security("list-keychains", "-d", "user")) == [keychain]
          print("Temporary Keychain unlocked; it is the only test default/search entry.")
          PYTHON

      - name: Run swift test
        working-directory: swift
        shell: bash
        run: bash ./Scripts/Test.sh

      - name: Restore Keychain preferences and delete test Keychain
        if: ${{ always() && steps.keychain.outputs.directory != '' }}
        timeout-minutes: 2
        env:
          KEYCHAIN_DIRECTORY: ${{ steps.keychain.outputs.directory }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, shlex, shutil, subprocess

          state = pathlib.Path(os.environ["KEYCHAIN_DIRECTORY"])
          original = json.loads((state / "original.json").read_text())
          errors = []
          for args in [
              ["default-keychain", "-d", "user", "-s", *original["default"]],
              ["list-keychains", "-d", "user", "-s", *original["search"]],
              *([["delete-keychain", str(state / "test.keychain-db")]] if (state / "test.keychain-db").exists() else []),
          ]:
              result = subprocess.run(["security", *args], check=False)
              if result.returncode:
                  errors.append(f"{args[0]} exited {result.returncode}")
          for command, expected in [("default-keychain", original["default"]), ("list-keychains", original["search"])]:
              actual = subprocess.check_output(["security", command, "-d", "user"], text=True)
              if shlex.split(actual) != expected:
                  errors.append(f"{command} was not restored")
          if (state / "test.keychain-db").exists():
              errors.append("temporary Keychain still exists")
          if errors:
              raise SystemExit("; ".join(errors))
          shutil.rmtree(state)
          print("Original default/search list restored and verified; temporary Keychain deleted.")
          PYTHON

      - name: Set up Go for the watch transport fixture
        uses: ./.github/actions/setup-go-ci
        with:
          cache-name: swift-watch

      - name: Install watch CLI build dependencies
        run: brew install pkg-config libusb

      - name: Require live watch redeployment and interrupt cleanup
        timeout-minutes: 25
        run: bash .github/scripts/test-watch-session.sh "$RUNNER_TEMP/watch-session" "$GITHUB_WORKSPACE/swift/Build/SwiftPM"

      - name: Retain watch transport evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: watch-session
          path: ${{ runner.temp }}/watch-session/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Archive SwiftPM build cache
        id: archive_swiftpm
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          # GNU tar keeps the nanosecond mtimes incremental builds compare.
          gtar --posix -cf - swift/Build/SwiftPM \
            | zstd -T0 -3 -q -o "$RUNNER_TEMP/swiftpm-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}.tar.zst"

      - name: Upload SwiftPM build cache
        if: ${{ !cancelled() && steps.archive_swiftpm.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: swiftpm-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}
          path: ${{ runner.temp }}/swiftpm-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  build:
    permissions:
      actions: read
      contents: read
    name: Build WendyAgentMac app
    runs-on:
      group: wendy-mac
      labels: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-macos-ci

      - name: Install build cache tools
        shell: bash
        run: |
          missing=()
          for formula in gh gnu-tar zstd; do
            brew list --versions "$formula" >/dev/null 2>&1 || missing+=("$formula")
          done
          if (( ${#missing[@]} )); then brew install "${missing[@]}"; fi

      - name: Capture active Xcode version
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(xcodebuild -version | awk '/Xcode/ { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode build cache from main
        # Best effort: a missing or unusable archive means a cold build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_CACHE_WORKFLOW_FILE: swift-tests.yml
        shell: bash
        run: |
          .github/scripts/restore-trusted-build-cache.sh \
            xcode-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }} \
            swift/Build/CI/PackageCache swift/Build/CI/SourcePackages swift/Build/Xcode

      - name: Resolve Swift package dependencies
        working-directory: swift
        env:
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/swift/Build/CI/PackageCache
          SOURCE_PACKAGES_DIR: ${{ github.workspace }}/swift/Build/CI/SourcePackages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_CACHE_DIR" "$SOURCE_PACKAGES_DIR"

          xcodebuild -resolvePackageDependencies \
            -workspace WendyAgent.xcworkspace \
            -scheme WendyAgentMac \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -packageCachePath "$PACKAGE_CACHE_DIR" \
            -skipMacroValidation

      - name: Build WendyAgentMac app
        id: build_wendy_agent_mac_app
        working-directory: swift
        env:
          DERIVED_DATA_PATH: ${{ github.workspace }}/swift/Build/Xcode
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/swift/Build/CI/PackageCache
          SOURCE_PACKAGES_DIR: ${{ github.workspace }}/swift/Build/CI/SourcePackages
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild build \
            -workspace WendyAgent.xcworkspace \
            -scheme WendyAgentMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -packageCachePath "$PACKAGE_CACHE_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipMacroValidation

      - name: Archive Xcode build cache
        id: archive_xcode
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          # GNU tar keeps the nanosecond mtimes incremental builds compare.
          gtar --posix -cf - --exclude=swift/Build/Xcode/Logs \
            swift/Build/CI/PackageCache swift/Build/CI/SourcePackages swift/Build/Xcode \
            | zstd -T0 -3 -q -o "$RUNNER_TEMP/xcode-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}.tar.zst"

      - name: Upload Xcode build cache
        if: ${{ !cancelled() && steps.archive_xcode.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xcode-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}
          path: ${{ runner.temp }}/xcode-build-${{ runner.name }}-xcode-${{ steps.xcode.outputs.version }}.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Test macOS provisioning validation
        working-directory: swift
        shell: bash
        run: python3 ./Scripts/ValidateMacProvisioning_test.py

      - name: Test launch agent supervision
        working-directory: swift
        env:
          APP_PATH: ${{ github.workspace }}/swift/Build/Xcode/Build/Products/Debug/WendyAgentMac.app
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint "$APP_PATH/Contents/Library/LaunchAgents/sh.wendy.WendyAgentMac.plist"
          bash ./Scripts/TestLaunchAgentSupervision.sh
