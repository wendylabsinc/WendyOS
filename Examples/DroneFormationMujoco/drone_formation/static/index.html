<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drone formation · MuJoCo</title>
<style>
  :root {
    --slate: #171c23;
    --slate-2: #1e242d;
    --slate-3: #242b35;
    --cream: #f1eee7;
    --muted: #a9b0ba;
    --font: Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--slate); color: var(--cream); font-family: var(--font); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .hud { position: fixed; pointer-events: none; font-weight: 500; letter-spacing: -0.01em; }
  [hidden] { display: none !important; }
  .panel { background: rgba(23, 28, 35, 0.78); border: 1px solid rgba(241, 238, 231, 0.12); padding: 16px 20px; backdrop-filter: blur(6px); }
  #title { top: 24px; left: 24px; }
  #title h1 { margin: 0; font-size: 26px; font-weight: 500; }
  #title p { margin: 4px 0 0; font-size: 17px; color: var(--muted); }
  #wind { bottom: 24px; left: 24px; display: flex; align-items: center; gap: 18px; }
  #wind svg { width: 56px; height: 56px; flex: none; }
  #formation { bottom: 24px; right: 24px; text-align: right; }
  .label { font-size: 16px; color: var(--muted); }
  .big { font-size: 34px; line-height: 1.1; margin-top: 2px; }
  .small { font-size: 18px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  #link { top: 24px; right: 24px; text-align: right; font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; font-size: 20px; color: var(--muted); pointer-events: none; }
  @media (max-width: 700px) {
    #title { top: 14px; left: 14px; } #title h1 { font-size: 20px; } #title p { font-size: 14px; }
    #wind { left: 14px; bottom: 14px; gap: 12px; } #wind svg { width: 40px; height: 40px; }
    #formation { right: 14px; bottom: 14px; } .big { font-size: 24px; } .small, .label { font-size: 14px; }
    #link { display: none; } .panel { padding: 10px 12px; }
  }
</style>
</head>
<body>
<canvas id="view" aria-label="Live 3D view of the drone swarm. Drag to orbit, right-drag to pan, scroll to zoom."></canvas>
<div id="status" role="status">Connecting to the simulator…</div>
<div class="hud panel" id="title"><h1>Drone formation</h1><p>12 Crazyflies in MuJoCo</p></div>
<div class="hud" id="link"><div id="link-mujoco">MuJoCo</div><div id="link-rtf">Real time</div></div>
<div class="hud panel" id="wind">
  <svg viewBox="-30 -30 60 60" aria-hidden="true">
    <circle r="27" fill="none" stroke="rgba(241,238,231,0.25)" stroke-width="2"/>
    <g id="wind-arrow"><path d="M -16 0 L 14 0 M 6 -8 L 15 0 L 6 8" fill="none" stroke="#f1eee7" stroke-width="3.5" stroke-linecap="square"/></g>
  </svg>
  <div><div class="label">Wind</div><div class="big" id="wind-pattern">Calm</div><div class="small" id="wind-speed">0.0 m/s</div></div>
</div>
<div class="hud panel" id="formation">
  <div class="label">Formation</div><div class="big" id="formation-name">Parked</div><div class="small" id="formation-error">On the pads</div>
</div>
<script type="importmap">
  { "imports": { "three": "./three/three.module.js", "three/addons/": "./three/addons/" } }
</script>
<script type="module">
  import { DroneViewer } from './viewer.js';
  const viewer = new DroneViewer(document.querySelector('#view'), document.querySelector('#status'));
  window.viewer = viewer;
  viewer.start();
</script>
</body>
</html>
