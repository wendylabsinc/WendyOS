syntax = "proto3";

package wendycloud.v1;

import "google/protobuf/timestamp.proto";

service AppService {
  rpc UpsertApp(UpsertAppRequest) returns (App);
  // Register a CLI deployment before starting code on an enrolled device.
  // Requires operator app-create and deployment-create permission. Never grants notifications.
  rpc RegisterAppDeployment(RegisterAppDeploymentRequest) returns (App);
  rpc GetApp(GetAppRequest) returns (App);
  rpc UpdateApp(UpdateAppRequest) returns (App);
  rpc DeleteApp(DeleteAppRequest) returns (DeleteAppResponse);
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
}

message App {
  string id = 1;
  int32 organization_id = 2;
  string name = 3;
  string details = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Interim owner/admin-controlled grant allowing this app to send notifications.
  // WDY-2058 will replace this with capability-scoped app authorization.
  bool can_send_notifications = 7;
}

message UpsertAppRequest {
  string id = 1;
  int32 organization_id = 2;
  optional string name = 3;
  optional string details = 4;
}

message GetAppRequest {
  string id = 1;
  int32 organization_id = 2;
}

message UpdateAppRequest {
  string id = 1;
  int32 organization_id = 2;
  optional string name = 3;
  optional string details = 4;
  // Interim owner/admin-controlled grant allowing this app to send notifications.
  // WDY-2058 will replace this with capability-scoped app authorization.
  optional bool can_send_notifications = 5;
}

message DeleteAppRequest {
  string id = 1;
  int32 organization_id = 2;
}

message DeleteAppResponse {
  bool success = 1;
}

message ListAppsRequest {
  int32 organization_id = 1;
  // Offset/limit based pagination (offset = starting row, limit = page size)
  optional int32 offset = 2;
  optional int32 limit = 3;
  optional string filter = 4;  // Filter by name or details
}

message ListAppsResponse {
  repeated App apps = 1;
  int32 total = 2;
}

// Creates the app and its device assignment if missing, atomically. Both must
// belong to organization_id. Existing app metadata, notification grants, releases,
// and desired states are preserved, including stopped/absent assignments.
// Campaigns use the reserved app ID "campaign:<campaign-name>".
message RegisterAppDeploymentRequest {
  string id = 1;
  int32 organization_id = 2;
  int32 asset_id = 3;
  string name = 4;
  string details = 5;
}
