syntax = "proto3";

package wendy.agent.services.v1;

service WendyVideoService {
    rpc ListVideoDevices(ListVideoDevicesRequest) returns (ListVideoDevicesResponse);
    rpc StreamVideo(StreamVideoRequest) returns (stream VideoFrame);
    rpc SetCameraCredentials(SetCameraCredentialsRequest) returns (SetCameraCredentialsResponse);
    rpc ForgetCamera(ForgetCameraRequest) returns (ForgetCameraResponse);
    rpc RefreshCameras(RefreshCamerasRequest) returns (RefreshCamerasResponse);
    rpc TestCameraCredentials(TestCameraCredentialsRequest) returns (TestCameraCredentialsResponse);
    // GetCameraControls reports the tunable V4L2 controls of a local (USB/CSI)
    // camera with their current value and range. SetCameraControls sets them.
    // Both reject network cameras: an RTSP camera exposes no V4L2 controls here.
    rpc GetCameraControls(GetCameraControlsRequest) returns (GetCameraControlsResponse);
    rpc SetCameraControls(SetCameraControlsRequest) returns (SetCameraControlsResponse);
    rpc ResetCameraControls(ResetCameraControlsRequest) returns (ResetCameraControlsResponse);
}

message VideoDevice {
    uint32 id              = 1; // numeric suffix of /dev/videoN; network cameras use the reserved 200-255 band
    string name            = 2; // human-readable name from sysfs, or the model for network cameras
    string path            = 3; // e.g. "/dev/video0"; empty for a network camera with no loopback node
    VideoTransport transport = 4; // interface (csi, usb, ip, unknown)
    string driver          = 5; // kernel driver name from sysfs (e.g. "uvcvideo", "tegra-capture-vi"); empty if unknown
    string libcamera_id    = 6; // libcamera camera-name; empty when libcamera enumeration unavailable or ambiguous
    string address          = 7; // network camera address, e.g. "10.98.0.50"; empty for local cameras
    string model            = 8; // model reported by discovery, e.g. "RLC-520A"
    string mac              = 9; // stable identity for network cameras; empty for local cameras
    bool has_credentials    = 10; // the agent holds a login for this camera
    bool online             = 11; // the most recent probe reached this camera
    string topic            = 12; // ROS 2 image topic, e.g. "/camera/image_raw"; empty for other transports
    // Stable identity for a LOCAL camera, the counterpart of `mac` above, and
    // the name to pass to StreamVideoRequest.stable_id.
    //
    // `id` and `path` are the kernel's enumeration order, which is a property
    // of the boot and not of the camera: replugging or a reboot can renumber
    // /dev/videoN, and a caller that pinned a number then silently streams a
    // different camera. `name` and `driver` only identify the MODEL, so they
    // cannot separate two cameras of the same type.
    //
    // One camera has one stable_id. The value carries the scheme it came from,
    // because the two names udev publishes are not equally durable:
    //
    //   by-id:<name>    vendor + product + serial; survives a reboot AND a
    //                   move to another USB port. Reported whenever udev has
    //                   one.
    //   by-path:<name>  the USB port topology; survives a reboot but NOT a
    //                   move. Reported only when there is no by-id name --
    //                   two same-model cameras sharing a factory serial
    //                   collide on a single by-id link, and the camera that
    //                   loses it has nothing else that separates the two.
    //
    // Empty when the device has no /dev/v4l entry -- CSI and network cameras,
    // or a kernel without the udev symlinks.
    string stable_id        = 13; // e.g. "by-id:usb-Acme_Camera_SN123-video-index0"
}

enum VideoTransport {
    VIDEO_TRANSPORT_UNKNOWN = 0;
    VIDEO_TRANSPORT_USB     = 1;
    VIDEO_TRANSPORT_CSI     = 2;
    VIDEO_TRANSPORT_IP      = 3;
    VIDEO_TRANSPORT_ROS2    = 4;
}

message ListVideoDevicesRequest {}

message ListVideoDevicesResponse {
    repeated VideoDevice devices = 1;
}

message StreamVideoRequest {
    uint32 device_id  = 1; // numeric suffix N in /dev/videoN; 0 maps to /dev/video0
    // For local cameras width/height/framerate configure capture. For network
    // cameras the camera decides its own format, so width only selects which of
    // its streams to open (sub or main) and height/framerate are ignored.
    uint32 width      = 2; // pixels; 0 = device default
    uint32 height     = 3; // pixels; 0 = device default
    uint32 framerate  = 4; // fps; 0 = device default
    // The requested delivery codec. The default, VIDEO_CODEC_H264 (0), delivers
    // encoded video exactly as before this field existed. VIDEO_CODEC_RAW instead
    // delivers the camera's capture frames uncompressed: every VideoFrame then
    // carries exactly one complete frame with codec VIDEO_CODEC_RAW and raw_format
    // describing its layout. Other subscribers of the same camera keep receiving
    // encoded video: raw and encoded consumers share one capture, so an analytic
    // reader (a thermal module's per-pixel temperatures, for instance) and a
    // viewer no longer compete for the node.
    //
    // VIDEO_CODEC_RAW is offered only for local cameras the agent captures in a
    // raw pixel format; a camera streaming MJPEG or native H.264, a network
    // camera, or one shared through PipeWire has no raw frames to give, and the
    // request fails with FailedPrecondition (reason RAW_UNAVAILABLE) rather than
    // waiting forever. A codec the agent cannot produce for a camera is refused
    // the same way rather than silently downgraded.
    VideoCodec codec  = 5;
    // Address the camera by the stable_id ListVideoDevices reported for it,
    // scheme tag included, instead of by device_id.
    //
    // When set this WINS over device_id and is resolved at request time. That
    // is the point: the number is resolved when the stream is opened rather
    // than baked into a config that outlives the boot it was written on.
    //
    // A "by-path:" name resolves too, even for a camera whose reported
    // stable_id is a "by-id:" one: pinning a stream to a physical port is a
    // legitimate thing to ask for, as long as the caller asks for it rather
    // than inheriting it.
    //
    // No match is an error, deliberately. Falling back to device_id would
    // stream whatever the kernel happened to put at that number, which is the
    // silent-wrong-camera failure this field exists to remove.
    string stable_id  = 6; // empty = address by device_id, as before
}

// Credentials for a network camera. Stored on the device, never returned by any
// RPC: listings report only has_credentials.
message SetCameraCredentialsRequest {
    uint32 device_id = 1;
    string username  = 2;
    string password  = 3;
}

message SetCameraCredentialsResponse {}

message ForgetCameraRequest {
    uint32 device_id = 1;
}

message ForgetCameraResponse {}

message RefreshCamerasRequest {}

message RefreshCamerasResponse {
    repeated VideoDevice devices = 1;
}

// TestCameraCredentials validates a network camera's stored login by probing
// its RTSP port directly, without starting a capture pipeline. Local (V4L2)
// device IDs are rejected: there is nothing to validate for them.
message TestCameraCredentialsRequest {
    uint32 device_id = 1;
}

message TestCameraCredentialsResponse {
    enum Result {
        RESULT_UNSPECIFIED = 0;
        RESULT_OK           = 1; // the camera accepted the stored credentials
        RESULT_AUTH_FAILED  = 2; // the camera rejected the stored credentials
        RESULT_UNREACHABLE  = 3; // the camera's RTSP port could not be reached
    }
    Result result   = 1;
    string address  = 2; // the address probed, e.g. "10.98.0.50"
    string detail   = 3; // human-readable outcome; camera credentials are redacted
}

enum VideoCodec {
    VIDEO_CODEC_H264 = 0; // raw H.264 annexb NAL units (default)
    VIDEO_CODEC_VP8  = 1; // VP8 inside a WebM container (webmmux streamable=true)
    VIDEO_CODEC_RAW  = 2; // one uncompressed capture frame per message; layout in VideoFrame.raw_format
}

// RawFormat describes the bytes of a VIDEO_CODEC_RAW frame: the V4L2 pixel
// format the camera was captured in and the geometry needed to index it. It is
// the camera's own layout, untouched — for a thermal module whose mode stacks
// metadata rows onto the picture, those rows are included.
message RawFormat {
    uint32 width          = 1; // pixels
    uint32 height         = 2; // rows, including any non-picture rows the mode carries
    string fourcc         = 3; // V4L2 pixel format, e.g. "YUYV" (2 bytes per pixel)
    uint32 bytes_per_line = 4; // stride; data is exactly bytes_per_line * height bytes
}

message VideoFrame {
    bytes      data         = 1; // chunk of encoded video; concatenate chunks in order; format described by codec. For VIDEO_CODEC_RAW, one whole frame.
    uint64     timestamp_ns = 2; // wall-clock timestamp in nanoseconds
    VideoCodec codec        = 3; // codec used; default 0 = H264
    RawFormat  raw_format   = 4; // set on VIDEO_CODEC_RAW frames only
}

// A tunable V4L2 control on a local camera -- exposure, gain, white balance and
// the like. The agent owns the /dev/videoN node (StreamVideo multiplexes it),
// so it is the only place these can be set to stick: a second process cannot,
// and a setting made out of band is lost the next time the pipeline reopens the
// device. The motivating case is a scene the camera's auto-exposure gets wrong
// -- a flame or lamp that blows out to white -- where forcing manual exposure
// keeps the highlight from clipping.
message CameraControl {
    string name          = 1; // stable slug, e.g. "auto_exposure", "exposure_time_absolute", "brightness", "gain", "backlight_compensation"
    int32  value         = 2; // the driver's current value
    int32  minimum       = 3; // inclusive
    int32  maximum       = 4; // inclusive
    int32  step          = 5;
    int32  default_value = 6;
    bool   mutable       = 7; // false when the driver reports it read-only or disabled right now
}

// What a caller ASKS for. Deliberately not CameraControl: that message answers
// "what does the driver report", and five of its seven fields are the driver's
// answer rather than the caller's request. One message doing both jobs means a
// writer fills in minimum/maximum/step/default/mutable that the server then
// ignores -- the comments carry the contract instead of the types.
message CameraControlSetting {
    string name  = 1;
    int32  value = 2;
}
message GetCameraControlsRequest {
    uint32 device_id = 1; // numeric suffix N in /dev/videoN; the reserved network-camera band is rejected
}

message GetCameraControlsResponse {
    repeated CameraControl controls = 1;
}

message SetCameraControlsRequest {
    uint32 device_id = 1;
    repeated CameraControlSetting controls = 2;
    // Re-apply these whenever the capture pipeline reopens the device, and
    // across agent restarts, so a stream reconnect or a reboot does not revert
    // to the firmware default. When false the values are applied once, now.
    bool persist = 3;
}

message SetCameraControlsResponse {
    repeated CameraControlResult results = 1;
}

// Put controls back to the driver's own defaults and STOP persisting them.
//
// A separate RPC rather than a flag on Set, because it is a different verb:
// Set says "make it this", Reset says "forget I ever said anything". It changes
// the persisted state as well as the value, so a caller that models it as
// "set to the default" would leave the control pinned to that default forever
// -- which is the thing being undone.
//
// The default comes from the driver (QUERYCTRL), so the camera answers rather
// than the caller having to know.
message ResetCameraControlsRequest {
    uint32 device_id = 1;
    // Controls to reset by name. EMPTY MEANS EVERY PERSISTED CONTROL, which is
    // the useful case after a tuning session went wrong: the caller wants the
    // camera back as it shipped and should not have to enumerate what it
    // changed to get there.
    repeated string names = 2;
}

message ResetCameraControlsResponse {
    repeated CameraControlResult results = 1;
}

message CameraControlResult {
    string name    = 1;
    bool   applied = 2;
    string detail  = 3; // when not applied, why -- e.g. "unknown control" or the errno text
}
