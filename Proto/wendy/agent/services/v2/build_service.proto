syntax = "proto3";

package wendy.agent.services.v2;

option go_package = "github.com/wendylabsinc/wendy/go/proto/gen/agentpb/v2;agentpbv2";

// WendyBuildService lets a CLI delegate a container image build to this device,
// so a developer's laptop does not have to be the machine that builds.
//
// BuildImage is remote code execution by design — that is the feature — so
// three things are non-negotiable here: the device must be explicitly opted in
// as a builder (see builder_enabled); every field of a BuildSpec is re-validated
// on the server rather than trusted from the client, even an in-org one; and the
// caller must be a *person*.
//
// That last one means a user certificate, or the local admin socket, whose
// filesystem permissions are themselves the credential. A device certificate is
// refused, and so is the unauthenticated pre-provisioning plaintext port.
// SetBuildHostEnabled below already makes the same demand; if BuildImage did
// not, the opt-in gate would admit the very certificate type its own toggle
// rejects, leaving a compromised device in the org with code execution on the
// build host.
service WendyBuildService {
  rpc GetBuildCapabilities(GetBuildCapabilitiesRequest) returns (GetBuildCapabilitiesResponse);
  rpc BuildImage(stream BuildImageRequest) returns (stream BuildImageProgress);

  // SetBuildHostEnabled turns the builder role on or off, so opting a device in
  // does not require shell access to touch a file on it.
  //
  // This RPC requires a *user* certificate and refuses asset (device) ones. The
  // distinction is the whole point: a human with an org login can already
  // deploy arbitrary containers to this device with `wendy run`, so letting
  // them flip the builder role grants nothing they did not have. A device
  // certificate cannot, which is the threat that matters — one compromised
  // device in the org quietly conscripting its peers into build farms. Without
  // that split the gate would be decorative, since anyone able to call
  // BuildImage could simply call this first.
  rpc SetBuildHostEnabled(SetBuildHostEnabledRequest) returns (SetBuildHostEnabledResponse);
}

message SetBuildHostEnabledRequest {
  bool enabled = 1;
}

message SetBuildHostEnabledResponse {
  // Echoes the state now in effect, so a caller can confirm without a second
  // round trip.
  bool enabled = 1;
}

message GetBuildCapabilitiesRequest {}

message GetBuildCapabilitiesResponse {
  // False when buildkitd is absent — notably on a Mac agent, where containers
  // run under Apple Container, which has no BuildKit underneath.
  bool buildkit_available = 1;
  string buildkit_version = 2;
  string os = 3;
  string cpu_architecture = 4;
  // Platforms this host builds without emulation, e.g. "linux/arm64".
  repeated string native_platforms = 5;
  // Platforms reachable only through binfmt/QEMU. Building these works but is
  // slow enough that the CLI says so rather than letting it look like a hang.
  repeated string emulated_platforms = 6;
  // False unless this device is configured as a build host. Default off: being
  // reachable must not be the same as volunteering to run other people's builds.
  bool builder_enabled = 7;

  // True when this agent reads BuildSpec.push_targets, so one build can be
  // delivered to several devices.
  //
  // A client MUST check this before sending push_targets, and refuse rather
  // than degrade. proto3 discards unknown fields, so an older agent receives a
  // spec whose push_targets it cannot see and whose push_target is empty: it
  // would build and deliver nowhere, or take a default, while the client
  // reported a fleet deploy. That is the wrong-machine failure this feature's
  // two-explicit-flags design already refuses to allow, so it is closed here
  // rather than left to the client to notice.
  bool multi_target_delivery = 8;

  // Where buildkitd keeps its cache, and how much room that filesystem has.
  //
  // Reported because the default is dangerous on an image-based OS. buildkitd's
  // --root defaults to /var/lib/buildkit, which on WendyOS is the A/B root
  // filesystem -- 12 GB with ~4.6 GB free on a Jetson AGX Thor, next to a /data
  // partition with 862 GB. A single TensorRT build cache fills the partition the
  // OS boots from, so the failure is a damaged device rather than a failed build.
  //
  // An agent that implements this inspection sets
  // buildkit_root_inspection_supported. For such an agent, an empty root or
  // zero total means inspection failed and a client must not start a build.
  // An older agent leaves the support flag false, allowing a newer CLI to keep
  // the pre-existing compatibility behavior without mistaking a failed
  // inspection by a newer agent for success.
  string buildkit_root = 9;
  uint64 buildkit_root_free_bytes = 10;
  uint64 buildkit_root_total_bytes = 11;
  bool buildkit_root_inspection_supported = 12;

  // True when this agent delivers images by chunks into a device's content
  // store and honours BuildSpec.chunking. A client MUST check this before
  // sending CHUNKING_MODE_FORCE — see that field.
  bool chunk_delivery = 13;
}

// ChunkManifest reconstructs a byte stream from chunks already written through
// WendyContainerService.WriteChunks, which is a generic sha256-addressed store.
// Order is significant.
message ChunkManifest {
  repeated bytes chunk_hashes = 1;  // raw 32-byte sha256 digests, in order
  int64 total_size = 2;             // expected reassembled size, for validation
}

// DockerfileBuild builds through BuildKit's dockerfile.v0 frontend.
message DockerfileBuild {
  // Filename within the context, e.g. "Dockerfile" or "Dockerfile.generated".
  // Must not escape the context root.
  string dockerfile = 1;
  map<string, string> build_args = 2;
}

// PushTarget names where a finished image goes, as a mesh peer rather than a
// hostname.
//
// It is an asset id and not a name on purpose. Resolving
// "device-<id>.cloud.wendy.dev" requires the mesh DNS server, which only exists
// on WendyOS hosts — an adopted Linux box (where systemd-resolved owns
// 127.0.0.53) cannot resolve it, so a perfectly reachable peer looked
// unreachable. The agent's peer dialer needs only the id, and it is also a
// tighter capability: an id can only ever address a device in this org, whereas
// a free-form host could address anything. See WDY-2356.
message PushTarget {
  int32 asset_id = 1;
  uint32 registry_port = 2;
  // "repository:tag" only — never a host component.
  string repository = 3;
  // mTLS gRPC port of this target's agent. The CLI copies the port from the
  // connection that actually reached this device; zero is a legacy client and
  // makes the build host use its configured/default target-agent port.
  uint32 agent_port = 4;
}

// ChunkingMode is how the finished image reaches each device. It carries the
// CLI's --chunking flag to the build host, so the flag means the same thing
// whether the laptop delivers the image or the build host does.
enum ChunkingMode {
  // Not set: a CLI that predates the field. Treated as AUTO.
  CHUNKING_MODE_UNSPECIFIED = 0;
  // By chunks into the device's content store when its agent can receive
  // them; through its registry otherwise, and the build log says so.
  CHUNKING_MODE_AUTO = 1;
  // By chunks only. A device whose agent cannot receive them is a delivery
  // failure, never a quiet registry push: the mode exists so a chunk-delivery
  // problem is surfaced rather than masked by a slower path.
  CHUNKING_MODE_FORCE = 2;
  // Through the device's registry only, one buildctl pass per device, as this
  // feature delivered before chunked delivery existed.
  CHUNKING_MODE_OFF = 3;
}

message BuildSpec {
  // App identifier. Also selects the stable per-app context directory, whose
  // path BuildKit uses as its local-source cache key — see the agent's
  // contextDir for why that path must not vary between builds.
  string app_id = 1;
  // Target platform, e.g. "linux/arm64".
  string platform = 2;
  // The build context as an uncompressed tar, addressed by chunk.
  ChunkManifest context = 4;
  // Where the finished image is pushed. Superseded by push_targets; still read
  // when that is empty, so a CLI built before fleet delivery keeps working.
  PushTarget push_target = 7;

  // Every device the finished image is delivered to.
  //
  // One build, many devices. The build is the expensive stage and it does not
  // vary per device: deploying one change to four cameras meant four identical
  // builds, four context uploads and four TensorRT compiles. Delivery is
  // layer-diffed, so the second device onwards usually transfers almost
  // nothing.
  //
  // Each target is pinned separately — PushTLS takes an asset id — so N targets
  // means N independently authenticated hops, not one hop trusted N times.
  //
  // A server reading this MUST prefer it over push_target and fall back only
  // when it is empty. A client MUST NOT set both.
  repeated PushTarget push_targets = 8;

  // How the image is delivered to each target. An agent that predates chunked
  // delivery cannot see this field and pushes through the registry regardless,
  // so a client sending CHUNKING_MODE_FORCE MUST check
  // GetBuildCapabilitiesResponse.chunk_delivery first, for the reason
  // multi_target_delivery is checked: proto3 discards what the receiver does
  // not know, and a silent registry push is exactly what FORCE forbids.
  ChunkingMode chunking = 9;

  // Field 3 was push_reference, a "host:port/repo:tag" string resolved through
  // DNS. Replaced by push_target — see that message for why.
  reserved 3;

  oneof definition {
    DockerfileBuild dockerfile_build = 5;
    // Field 6 is reserved for LlbBuild — the Stagefile path, which compiles to
    // LLB on the CLI and solves here. It depends on the Stagefile LLB backend
    // (PR #1606). Reserving it now means that path needs no protocol change.
  }
  reserved 6;
}

message BuildImageRequest {
  // The first message on the stream carries the spec. Later messages are
  // reserved for future incremental input and are rejected today.
  BuildSpec spec = 1;
}

message BuildImageProgress {
  oneof event {
    // One line of BuildKit plain-mode progress output, forwarded verbatim so
    // the CLI's existing renderer consumes it unchanged.
    string log_line = 1;
    BuildImageResult result = 2;
  }
}

message BuildImageResult {
  // Digest of the pushed image, e.g. "sha256:...". This may be empty when the
  // build host's BuildKit version does not report a structured result digest.
  string image_digest = 1;

  // One entry per delivery attempt, in the order the targets were given.
  //
  // Delivery outcomes are per device and are NOT collapsed into the stream's
  // status. A fleet deploy where one device failed is not a failed build and
  // not a successful deploy, and the distinction has to survive to the CLI:
  // reporting the whole command as success because the build worked is how a
  // device silently misses a change. Empty for a single-target build, which
  // keeps reporting through the stream status as before.
  repeated DeliveryResult deliveries = 2;
}

// DeliveryResult is what happened when the finished image was pushed to one
// device. A failure here is specific to that device — its agent, its mesh
// reachability, its disk — and says nothing about the others.
message DeliveryResult {
  int32 asset_id = 1;
  bool delivered = 2;
  // Empty when delivered. Carries the reason otherwise, already phrased for a
  // developer: the CLI prints it next to the device name rather than
  // interpreting it.
  string error = 3;
}
