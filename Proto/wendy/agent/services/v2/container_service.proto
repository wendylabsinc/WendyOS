syntax = "proto3";
package wendy.agent.services.v2;
option go_package = "github.com/wendylabsinc/wendy/proto/gen/agentpb/v2;agentpbv2";

import "wendy/agent/services/v2/shared.proto";

service WendyContainerService {
    rpc StartContainer(StartContainerRequest) returns (stream ContainerStreamResponse);
    rpc AttachContainer(stream AttachContainerRequest) returns (stream ContainerStreamResponse);
    rpc StopContainer(StopContainerRequest) returns (StopContainerResponse);
    rpc DeleteContainer(DeleteContainerRequest) returns (DeleteContainerResponse);
    rpc ListContainers(ListContainersRequest) returns (stream ListContainersResponse);
    rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
    rpc RemoveVolume(RemoveVolumeRequest) returns (RemoveVolumeResponse);
    rpc ListContainerStats(ListContainerStatsRequest) returns (ListContainerStatsResponse);
    // Releases Wendy's explicit GC pins from pushed layer blobs and unpacked
    // snapshots. Containerd's reference graph continues to preserve current
    // images and active containers; only cache data becomes collectible.
    rpc PruneCache(PruneCacheRequest) returns (PruneCacheResponse);
}

message StartContainerRequest {
    string app_name = 1;
}

message AttachContainerRequest {
    oneof request_type {
        string app_name = 1;
        bytes stdin_data = 2;
    }
}

message ContainerStreamResponse {
    oneof response_type {
        Started started = 1;
        ConsoleOutput stdout_output = 2;
        ConsoleOutput stderr_output = 3;
    }

    message Started {}

    message ConsoleOutput {
        bytes data = 1;
    }
}

message StopContainerRequest {
    string app_name = 1;
}

message StopContainerResponse {}

message DeleteContainerRequest {
    string app_name = 1;
    bool delete_image = 2;
    bool delete_volumes = 3;
}

message DeleteContainerResponse {}

message ListContainersRequest {}

message ListContainersResponse {
    AppContainer container = 1;
}

message ListVolumesRequest {}

message VolumeInfo {
    string name = 1;
    string path = 2;
    int64 size_bytes = 3;
    string created_at = 4;
    repeated string used_by = 5;
}

message ListVolumesResponse {
    repeated VolumeInfo volumes = 1;
}

message RemoveVolumeRequest {
    string name = 1;
}

message RemoveVolumeResponse {}

message ContainerStats {
    string app_name = 1;
    int64 memory_bytes = 2;
    int64 storage_bytes = 3;
}

message ListContainerStatsRequest {}

message ListContainerStatsResponse {
    repeated ContainerStats stats = 1;
}

message PruneCacheRequest {
    // Reports what would be released without changing containerd metadata.
    bool dry_run = 1;
    // Minimum age of a Wendy cache pin before it is released. Absent: the
    // agent's default grace period (24h). 0: release every pin regardless of
    // age (`wendy device cache prune --all`). WDY-3127.
    optional uint64 min_age_seconds = 2;
}

message PruneCacheResponse {
    // Number and aggregate compressed size of pushed layer blobs whose Wendy
    // GC-root pin was (or would be, for dry_run) released.
    uint64 content_blobs = 1;
    uint64 content_bytes = 2;
    // Number and aggregate filesystem usage of unpacked snapshots whose Wendy
    // GC-root pin was (or would be, for dry_run) released.
    uint64 snapshots = 3;
    uint64 snapshot_bytes = 4;
    // Newly written cache entries are retained for this many seconds to avoid
    // disrupting an in-flight deployment between layer RPCs.
    uint64 minimum_age_seconds = 5;
    // Bytes freed on the container-storage filesystem across the synchronous
    // containerd GC pass the agent forces after releasing pins. Absent on
    // dry runs and when the agent could not force GC or measure the delta.
    optional uint64 reclaimed_bytes = 6;
}
