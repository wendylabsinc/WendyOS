syntax = "proto3";
import "wendy/agent/apps/v1/recording.proto";
package wendy.agent.services.v2;
option go_package = "github.com/wendylabsinc/wendy/go/proto/gen/agentpb/v2;agentpbv2";

// DataService owns the single device-local episode recorder. Canonical times
// are signed CLOCK_BOOTTIME nanoseconds relative to the recording request.
//
// CONTROL PLANE ONLY. This service is registered on the agent's device mutual
// Transport Layer Security server, alongside the provisioning, WiFi, container
// and update services, and is never exposed to applications. An app reaches the
// agent solely through a per-app private unix socket, which serves the
// app-facing wendy.agent.apps.v1 package and nothing else; no entitlement makes
// any method below callable by an application.
//
// The four Campaign methods in particular are command-line-facing: they are
// what `wendy data campaign deploy`, `wendy data campaign list`, `wendy data
// campaign inspect` and `wendy data campaign trigger` call over that mutually
// authenticated channel. They are operator commands for managing capture
// campaigns on a device, not an application programming interface for apps.
service DataService {
  // Bounded, durable event inbox. An empty cursor starts at the current tail;
  // replay=true reads retained history. Expired cursors report a gap explicitly.
  rpc Events(DataEventsRequest) returns (DataEventsResponse);
  // Operator-only snapshot of retained durable records, including those
  // received while no episode was active. Does not delete or acknowledge upload.
  rpc ExportRecording(DataRecordingExportRequest) returns (stream wendy.agent.apps.v1.StoredRecord);
  // Reclaim only a successfully exported snapshot after the receiver syncs it.
  rpc AcknowledgeRecordingExport(DataRecordingExportAckRequest) returns (DataRecordingExportAckResponse);
  rpc Sources(DataSourcesRequest) returns (DataSourcesResponse);
  rpc Start(DataStartRequest) returns (DataEpisode);
  rpc Stop(DataStopRequest) returns (DataEpisode);
  rpc Status(DataStatusRequest) returns (DataStatusResponse);
  rpc Episodes(DataEpisodesRequest) returns (DataEpisodesResponse);
  rpc Inspect(DataInspectRequest) returns (DataInspectResponse);
  rpc Download(DataDownloadRequest) returns (stream DataDownloadChunk);
  rpc CampaignDeploy(DataCampaignDeployRequest) returns (DataCampaign);
  rpc Campaigns(DataCampaignsRequest) returns (DataCampaignsResponse);
  rpc CampaignInspect(DataCampaignInspectRequest) returns (DataCampaign);
  rpc CampaignTrigger(DataCampaignTriggerRequest) returns (DataEpisode);
  // Data documents (specs/2026-10-12-data-documents-design.md §9.2).
  // DocumentApply validates and stores a document of any kind and hands it to
  // its runner. A collection takes the CampaignDeploy path.
  rpc DocumentApply(DataDocumentApplyRequest) returns (DataDocumentApplyResponse);
  // DocumentRemove removes an inference or watch document and everything it
  // owns, owned documents first, and returns once their inference has stopped
  // (at most 10 s, then DEADLINE_EXCEEDED). NOT_FOUND if absent;
  // FAILED_PRECONDITION for a collection.
  rpc DocumentRemove(DataDocumentRemoveRequest) returns (DataDocumentRemoveResponse);
  // DocumentRenew pushes a leased watch's deadline to now + lease. NOT_FOUND
  // once removed or expired; FAILED_PRECONDITION for a document without a lease.
  rpc DocumentRenew(DataDocumentRenewRequest) returns (DataDocumentRenewResponse);
  // Documents lists documents of every kind with their status; kind and name
  // narrow it. NOT_FOUND when a named document does not exist.
  rpc Documents(DataDocumentsRequest) returns (DataDocumentsResponse);
}

message DataEventsRequest {
  string app_id = 1;
  string event = 2;
  string cursor = 3;
  bool replay = 4;
  // Select the separate durable immediate Wendy Data notification journal.
  // This includes notify:on detection/event; Cloud episode_committed is separate.
  bool notifications_only = 5;
  // With notifications_only: only these watches' notifications. A leased
  // watch's notifications are returned only to a request that names it.
  repeated string watches = 6;
}
message DataEventsResponse {
  bytes events_json = 1;
  string cursor = 2;
  bool gap = 3;
  // Echoes notifications_only so clients can detect agents that predate it.
  bool notifications = 4;
}

message DataSource {
  string id = 1;
  string kind = 2;
  string clock_domain = 3;
  bool healthy = 4;
  string detail = 5;
}
message DataSourcesRequest {}
message DataSourcesResponse { repeated DataSource sources = 1; }

message DataCalibration { string source = 1; bytes contents = 2; string filename = 3; }
message DataStartRequest {
  string name = 1;
  repeated string sources = 2;
  repeated string exclude_sources = 3;
  // Refuse to start unless fresh UTC evidence bounds the device clock to within
  // this many nanoseconds.
  //
  // ZERO MEANS NO REQUIREMENT, not "demand a perfect clock". It is the value
  // every caller that does not care sends, including every client that predates
  // the field, so a server that read it as a bound would refuse to start at all.
  //
  // Signed, and a negative value is invalid rather than meaningful: see the
  // signedness note on DataDownloadChunk.
  int64 require_utc_uncertainty_nanos = 4;
  repeated DataCalibration calibrations = 5;
}
message DataStopRequest {}
message DataStatusRequest {}
message DataEpisodesRequest {}
message DataInspectRequest { string episode = 1; bool verify = 2; }
message DataDownloadRequest { string episode = 1; string path = 2; int64 offset = 3; }

message DataEpisode {
  string id = 1;
  string name = 2;
  string state = 3;
  int64 started_unix_nanos = 4;
  int64 size_bytes = 5;
  string boot_id = 6;
}
message DataStatusResponse { DataEpisode active = 1; }
message DataEpisodesResponse { repeated DataEpisode episodes = 1; }
message DataInspectResponse { bytes manifest_json = 1; repeated string verification_errors = 2; }
// One chunk of one file of an episode.
//
// size and sha256 describe the WHOLE FILE, not this chunk, and both are
// repeated on every chunk of the stream rather than sent once. A receiver
// therefore learns the file's length and digest from the first chunk and can
// check every later chunk against the same pair; it must not read them as a
// description of the bytes in this message, and must not accumulate them.
//
// This message is not the file list. What an episode contains is the manifest
// JSON (DataInspectResponse.manifest_json), whose files array carries each
// path, its size and its sha256; a downloader reads that first and then asks
// for each path in turn. Nothing in this stream enumerates paths.
//
// Signedness, stated once for the whole file: every numeric field here is
// int64, sizes and durations included. That differs from the cloud ingest
// contract, where a size or a byte count is uint64 and only a point on a
// timeline is signed. Devices already ship this contract, so the types stay as
// they are; the rule for a reader is that size, offset and any duration in this
// file are non-negative, and a negative value is a protocol error to reject
// rather than a range to interpret.
message DataDownloadChunk {
  string path = 1;
  // Byte offset of data within the file. Chunks arrive in order with no gaps,
  // starting at the offset the request asked to resume from.
  int64 offset = 2;
  bytes data = 3;
  // Total size of the whole file, repeated on every chunk.
  int64 size = 4;
  // Lowercase hex SHA-256 of the whole file, repeated on every chunk.
  string sha256 = 5;
  bool eof = 6;
}

message DataCampaignDeployRequest { bytes campaign_yaml = 1; }
message DataCampaignsRequest {}
message DataCampaignInspectRequest { string name = 1; }
message DataCampaignTriggerRequest { string name = 1; string reason = 2; }
message DataCampaign {
  string name = 1;
  string fleet = 2;
  string state = 3;
  string revision = 4;
  int64 deployed_unix_nanos = 5;
  bytes plan_json = 6;
  repeated string warnings = 7;
}
message DataCampaignsResponse { repeated DataCampaign campaigns = 1; }

message DataDocumentApplyRequest { bytes document_yaml = 1; }
message DataDocumentApplyResponse { DataDocument document = 1; }
message DataDocumentRemoveRequest { string kind = 1; string name = 2; }
message DataDocumentRemoveResponse {
  repeated string removed = 1;        // "<kind>/<name>", in the order removed
}
message DataDocumentRenewRequest { string kind = 1; string name = 2; }
message DataDocumentRenewResponse { int64 expires_unix_nanos = 1; }
message DataDocumentsRequest { string kind = 1; string name = 2; }
message DataDocumentsResponse { repeated DataDocument documents = 1; }

message DataDocument {
  string kind = 1;
  uint32 version = 2;
  string name = 3;
  string owner = 4;
  string revision = 5;
  string state = 6;                   // collection: campaign state; inference: job state; watch: waiting | active | error
  string state_detail = 7;
  int64 deployed_unix_nanos = 8;
  int64 expires_unix_nanos = 9;       // leased watches only
  bytes document_json = 10;           // the stored document, like DataCampaign.plan_json
  repeated string warnings = 11;
  bytes status_json = 12;             // kind-specific status
}

message DataRecordingExportRequest {
  string app_id = 1;
  string service = 2;
  string stream = 3;
  // Export the oldest chunk of whole segments, capped at 16 MiB plus one
  // segment or 64 segments. Seal it and return an opaque token in the
  // wendy-recording-checkpoint response trailer on successful completion.
  // Export alone never reclaims records. An empty snapshot has no token.
  bool checkpoint = 4;
}
message DataRecordingExportAckRequest {
  string app_id = 1;
  string service = 2;
  string stream = 3;
  string checkpoint = 4;
}
message DataRecordingExportAckResponse {}
