syntax = "proto3";
package wendy.agent.services.v2;
option go_package = "github.com/wendylabsinc/wendy/proto/gen/agentpb/v2;agentpbv2";

service WendyDeviceInfoService {
    rpc GetDeviceInfo(GetDeviceInfoRequest) returns (GetDeviceInfoResponse);
    rpc ListHardwareCapabilities(ListHardwareCapabilitiesRequest) returns (ListHardwareCapabilitiesResponse);
}

message GetDeviceInfoRequest {}

message GetDeviceInfoResponse {
    string version = 1;
    optional string os_version = 2;
    string os = 3;
    string cpu_architecture = 4;
    optional string public_key = 5;
    repeated string featureset = 6;
    optional string device_type = 7;
    optional bool has_gpu = 8;
    optional string gpu_vendor = 9;
    optional string jetpack_version = 10;
    optional string cuda_version = 11;
    optional int64 disk_used_bytes = 12;
    optional int64 disk_total_bytes = 13;
    // Usage for every real (disk-backed) filesystem mounted on the device. The
    // root filesystem is included here as well; disk_used_bytes/disk_total_bytes
    // are retained for backwards compatibility. Empty when the agent cannot
    // enumerate mounts.
    repeated DiskPartition partitions = 14;
    // GPU architecture identifier. Format is vendor-specific (e.g. "sm_87" for NVIDIA).
    optional string gpu_arch = 15;
    // Total physical memory (RAM) in bytes, from /proc/meminfo. Zero when the
    // agent cannot read it (a real host never has 0 bytes of RAM).
    int64 mem_total_bytes = 16;
    // Number of online logical CPU cores, from /proc/stat. Zero when the
    // agent cannot read it.
    uint32 cpu_count = 17;
    // Whether the device has an on-SoC neural accelerator the agent can reach.
    optional bool has_npu = 18;
    // NPU vendor identifier (e.g. "qualcomm"). Only present when has_npu is true.
    optional string npu_vendor = 19;
    // Filesystem containing /var/lib/containerd. Absent when inspection fails.
    optional DiskPartition container_storage = 20;
    // One entry per detected GPU with the host compute backends an app can use
    // on it. Empty on agents predating this field and on hosts without a GPU;
    // an agent that reports has_gpu=true always lists at least one entry, so
    // has_gpu with an empty list identifies an older agent.
    repeated GpuCapabilities gpu_capabilities = 21;
    // Runtimes an app can use on the NPU (e.g. "qnn" for the Qualcomm Hexagon
    // reached over FastRPC). Only populated when has_npu is true; empty when the
    // vendor's runtime is unrecognized, or on agents predating this field.
    repeated string npu_backends = 22;
    // Board model from /proc/device-tree/model (e.g. "NVIDIA Jetson AGX Orin
    // Developer Kit"). May be empty: hosts without a device tree (x86, macOS)
    // and agents predating this field.
    optional string board_model = 23;
    // Device-tree compatible strings from /proc/device-tree/compatible, most
    // specific first; the last entry names the SoC (e.g. "nvidia,tegra264" on
    // Jetson Thor). May be empty, as board_model.
    repeated string soc_compatible = 24;
    // Board serial number from /proc/device-tree/serial-number. May be empty:
    // many boards do not publish one.
    optional string serial_number = 25;
    // Running kernel release, from /proc/sys/kernel/osrelease (uname -r). May
    // be empty on non-Linux hosts.
    optional string kernel_version = 26;
    // Seconds since boot, from /proc/uptime. May be empty on non-Linux hosts.
    optional uint64 uptime_seconds = 27;
    // MAC address (aa:bb:cc:dd:ee:ff) of the first up, non-virtual interface
    // with a routable address. May be empty when no such interface exists.
    optional string primary_mac = 28;
    // Routable IPv4/IPv6 addresses of every up, non-virtual interface, without
    // a prefix suffix. May be empty.
    repeated string ip_addresses = 29;
    // Raw L4T version ("38.2.1") parsed from /etc/nv_tegra_release, unmapped,
    // so a reader need not rely on the agent's L4T-to-JetPack table. May be
    // empty: non-Jetson hosts and L4T releases without that file.
    optional string l4t_version = 30;
}

// Usage information for a single mounted filesystem.
message DiskPartition {
    // Mount point (e.g. "/", "/boot", "/data").
    string mountpoint = 1;
    // Filesystem type (e.g. "ext4", "vfat").
    string filesystem = 2;
    // Backing block device (e.g. "/dev/mmcblk0p2").
    string device = 3;
    // Bytes currently used on the filesystem.
    int64 used_bytes = 4;
    // Total bytes on the filesystem.
    int64 total_bytes = 5;
}

message ListHardwareCapabilitiesRequest {
    optional string category_filter = 1;
}

message ListHardwareCapabilitiesResponse {
    repeated HardwareCapability capabilities = 1;

    message HardwareCapability {
        string category = 1;
        string device_path = 2;
        string description = 3;
        map<string, string> properties = 4;
    }
}

// A detected GPU and the host compute backends an app can use on it.
message GpuCapabilities {
    // Host compute backends usable on this GPU: cuda, rocm, or metal. Empty when
    // the GPU is present but no supported backend was detected. An on-SoC neural
    // accelerator is not a GPU backend; see npu_backends.
    repeated string compute_backends = 1;
    // GPU vendor (nvidia, amd, intel, apple, broadcom, arm, qualcomm, vivante,
    // virtio). Empty when the driver is not recognized.
    string vendor = 2;
    // Device node or sysfs path that identified the GPU on Linux
    // (e.g. /dev/dri/card0, /dev/nvidia0, /dev/kfd). Empty on macOS.
    string path = 3;
}
