syntax = "proto3";
package wendy.agent.services.v2;
option go_package = "github.com/wendylabsinc/wendy/go/proto/gen/agentpb/v2;agentpbv2";

// User administration of an enrolled device's local mesh. Only a user in the
// device's tenant may change carrier or Internet-sharing policy.
service WendyLocalMeshAdminService {
  rpc ConfigureLocalMesh(ConfigureLocalMeshRequest) returns (LocalMeshStatus);
  rpc GetLocalMeshStatus(GetLocalMeshStatusRequest) returns (LocalMeshStatus);
  // Read-only local observations, authorized to a user in this device's tenant.
  rpc GetLocalMeshTopology(GetLocalMeshTopologyRequest) returns (LocalMeshTopology);
}

message ConfigureLocalMeshRequest {
  // Presence means update; omitted fields preserve the saved value.
  // Master switch for joining/relaying the mesh. Carrier choices are retained
  // while disabled. Roaming and uplink sharing require participation.
  optional bool participate = 1;
  optional bool roam = 2;
  optional bool share_uplink = 3;
  optional bool nan = 4;
  optional bool ble = 5;
  optional bool ethernet = 6;
  optional bool infrastructure_wifi = 7;
}

message GetLocalMeshStatusRequest {}
message GetLocalMeshTopologyRequest {
  // Optional public service descriptions from the same verified manifests.
  // Omitted for normal device discovery to keep recurring observations small.
  bool include_services = 1;

}

// A local observation, not a global graph or proof of end-to-end reachability.
// Each repeated field is bounded to 1024 entries. No certificates, signatures,
// endpoint credentials, or signed announcement bodies are returned.
message LocalMeshTopology {
  string self_principal = 1;
  string self_tenant_id = 2;
  string self_device_id = 3;
  string self_mesh_address = 4;
  // Time of the node's last coherent snapshot, not the RPC response time.
  int64 captured_at_unix_ms = 5;
  bool runtime_available = 6;
  LocalMeshStatus status = 7;
  repeated LocalMeshPeerLink peers = 8;
  repeated LocalMeshRoute routes = 9;
  repeated LocalMeshAnnouncement announcements = 10;
  bool truncated = 11;
  // True only when this reporter implements and handled include_services.
  bool services_included = 12;

}

message LocalMeshPeerLink {
  // Local incarnation ID; parallel carriers to one principal remain distinct.
  uint64 link_id = 1;
  string principal = 2;
  string device_id = 3;
  string mesh_address = 4;
  // ethernet, infrastructure-wifi, tcp, nan, ble, quic, or tls-stream.
  // The carrier reports this; a route metric is never used to infer transport.
  string transport = 5;
  uint32 cost = 6;
}

message LocalMeshRoute {
  string prefix = 1;
  uint64 origin_router_id = 2;
  uint32 sequence_number = 3;
  uint32 metric = 4;
  uint64 link_id = 5;
  string next_hop_principal = 6;
  string next_hop_address = 7;
  bool local = 8;
  bool unreachable = 9;
  string origin_principal = 10;
  int64 signed_route_expires_at_unix_ms = 11;
  // Exact prefix/router/sequence had a trusted signed origin lease at snapshot
  // capture, and the lease has not expired at response time. This does not
  // authenticate next-hop metrics or prove that a relay forwards traffic.
  bool origin_authorized = 12;
}

message LocalMeshAnnouncement {
  string principal = 1;
  string device_id = 2;
  string name = 3;
  int64 issued_at_unix_ms = 4;
  int64 expires_at_unix_ms = 5;
  uint64 revision = 6;
  string prefix = 7;
  uint64 origin_router_id = 8;
  uint32 sequence_number = 9;
  // verified-at-snapshot: signature and certificate trust were accepted when
  // the node captured this entry. No current/global trust assertion is made.
  string trust_state = 10;
  // Public agent hints from the same verified announcement. The caller must
  // authenticate the destination independently; these do not grant identity.
  uint32 agent_port = 11;
  string agent_transport = 12;
  string platform = 13;
  repeated string caps = 14;
  // Inherits this announcement's device identity, revision and expiry.
  // Populated only on request and bounded across the response.
  repeated LocalMeshService services = 15;
}

message LocalMeshService {
  string mesh = 1;
  string app_id = 2;
  string service_id = 3;
  string type = 4;
  string instance = 5;
  uint32 port = 6;
  repeated string txt = 7;
}

message LocalMeshConfiguration {
  bool participate = 1;
  bool roam = 2;
  bool share_uplink = 3;
  bool nan = 4;
  bool ble = 5;
  string tcp_listen = 6;
  uint32 configured_tcp_peers = 7;
  bool ethernet = 8;
  bool infrastructure_wifi = 9;
}

message LocalMeshStatus {
  LocalMeshConfiguration configured = 1;
  // Persisted intent is not proof that radios, routes or a donor are healthy.
  bool runtime_available = 2;
  string state = 3;
  string detail = 4;
  uint32 authenticated_peers = 5;
  string gateway_principal = 6;
}
