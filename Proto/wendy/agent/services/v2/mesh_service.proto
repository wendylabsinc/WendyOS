syntax = "proto3";

package wendy.agent.services.v2;

option go_package = "github.com/wendylabsinc/wendy/go/proto/gen/agentpb/v2;agentpbv2";

// WendyMeshService carries running-app TCP streams on an authenticated agent
// connection. Canonical same-tenant device and primary operator identities are
// admitted; the current running-app ingress registry owns port authorization.
// The first response is an empty MeshDialData acknowledging the actual admitted
// destination connection; later responses carry data and directional half-close.
service WendyMeshService {
  rpc MeshDial(stream MeshDialMessage) returns (stream MeshDialData);
}

// First client message on a MeshDial stream: which local TCP port to connect.
message MeshDialOpen {
  uint32 port = 1;
}

message MeshDialData {
  bytes payload = 1;
  bool half_close = 2;
}

// Client → server framing: first message must be `open`, all subsequent
// messages must be `data`.
message MeshDialMessage {
  oneof content {
    MeshDialOpen open = 1;
    MeshDialData data = 2;
  }
}
