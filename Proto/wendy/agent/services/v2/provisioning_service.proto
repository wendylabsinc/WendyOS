syntax = "proto3";
package wendy.agent.services.v2;
option go_package = "github.com/wendylabsinc/wendy/proto/gen/agentpb/v2;agentpbv2";

service WendyProvisioningService {
    rpc StartProvisioning(StartProvisioningRequest) returns (StartProvisioningResponse);
    // OIDC accounts: the device enrolls directly with PKI using a provisioned EAB.
    rpc StartACMEProvisioning(StartACMEProvisioningRequest) returns (StartACMEProvisioningResponse);
    rpc IsProvisioned(IsProvisionedRequest) returns (IsProvisionedResponse);
    // Unprovision resets the device to an unprovisioned state: it deletes the
    // stored enrollment certificates and provisioning state, then restarts the
    // agent so it comes back up serving plaintext on the unprovisioned port.
    rpc Unprovision(UnprovisionRequest) returns (UnprovisionResponse);
    // Deprecated prerelease path: Cloud now owns revocation.
    // Always returns UNIMPLEMENTED; not an alternate unenrollment workflow.
    rpc RevokeACMECertificate(RevokeACMECertificateRequest) returns (RevokeACMECertificateResponse) { option deprecated = true; }
    // Deprecated prerelease account probe. Always returns UNIMPLEMENTED.
    rpc CheckACMERevocation(RevokeACMECertificateRequest) returns (RevokeACMECertificateResponse) { option deprecated = true; }
}

message IsProvisionedRequest {}

message IsProvisionedResponse {
    oneof response_type {
        NotProvisionedResponse not_provisioned = 1;
        ProvisionedResponse provisioned = 2;
    }
}

message NotProvisionedResponse {
    // Read-only capability for direct StartACMEProvisioning enrollment.
    // Absent on older agents; clients must not assume those agents can enroll.
    // This is not a guarantee of network availability or successful issuance.
    optional bool acme_enrollment_supported = 1;
    // Public device-signed completion evidence, only after durable local erasure.
    bytes unenrollment_completion = 2;
    // Why acme_enrollment_supported is false on this host, for the operator
    // (e.g. a Mac below the macOS version that can verify ML-DSA chains).
    // Empty when enrollment is supported or the agent gives no reason.
    string acme_enrollment_unavailable_reason = 3;
}

message ProvisionedResponse {
    string cloud_host = 1;
    int32 organization_id = 2;
    int32 asset_id = 3;
    // Set for direct PKI enrollment; legacy numeric IDs remain unset.
    string principal_uri = 4;
    // Deprecated prerelease flag: clients that trusted it sent caller-serialized
    // deletion fields. Current Agents always report false so those clients stop
    // before Cloud mutation; clients gate only on cloud_authenticated_reset_supported.
    bool cloud_unenrollment_supported = 5;
    // Distinguishes verified Cloud authorization from unsafe prerelease resets
    // that accepted caller-serialized deletion fields. Clients require this
    // before starting the UUID reset workflow; older Agents fail closed.
    bool cloud_authenticated_reset_supported = 6;
    // The certificate's device UUID, also used as Cloud's asset UUID.
    // Available immediately after enrollment, without a Cloud roster refresh.
    // Empty for a legacy identity that has no UUID device principal.
    string asset_uuid = 7;
    // Explicit local credential erasure authenticated by a same-tenant operator.
    // This does not revoke certificates or remove Cloud records.
    bool local_reset_supported = 8;
}

message StartProvisioningRequest {
    int32 organization_id = 1;
    string enrollment_token = 2;
    string cloud_host = 3;
    int32 asset_id = 4;
}

message StartProvisioningResponse {}

message UnprovisionRequest {
    // Required for direct PKI identities; checked atomically before reset.
    string expected_principal_uri = 1;
    string expected_certificate_sha256 = 2;
    // Issuer-signed OCSP revocation evidence for the exact installed leaf.
    bytes revocation_proof = 3;
    // Serialized wendycloud.v2.DeletedAsset; exact tenant/device binding required.
    bytes cloud_deletion = 4;
    // Purpose-specific Cloud JWS from DeleteAsset. Agent obtains the key from
    // its enrolled Cloud's authenticated JWKS, not from this request. Must bind
    // the exact operator, installed identity, tombstone and signed deletion.
    bytes cloud_reset_authorization = 5;
    // Explicitly erase only the local enrollment, without Cloud lifecycle or PKI
    // revocation proof. Requires same-tenant operator mTLS and the exact installed
    // principal/fingerprint. Never implies that Cloud unenrollment completed.
    bool local_only = 6;
}

message UnprovisionResponse {
    bytes unenrollment_completion = 1;
    // Set only after a requested local-only reset durably erased credentials.
    bool local_reset_completed = 2;
}

message RevokeACMECertificateRequest {
    string expected_principal_uri = 1;
    string expected_certificate_sha256 = 2;
}

message RevokeACMECertificateResponse {
    string principal_uri = 1;
    string certificate_sha256 = 2;
    string certificate_serial = 3;
}

// EAB credentials are delivered once and must never be logged or returned.
message StartACMEProvisioningRequest {
    string cloud_host = 1;
    string directory_url = 2;
    string device_id = 3;
    string eab_key_id = 4;
    string eab_hmac_key = 5;
}

message StartACMEProvisioningResponse {
    string principal_uri = 1;
}
