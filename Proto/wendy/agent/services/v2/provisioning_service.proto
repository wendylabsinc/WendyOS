syntax = "proto3";
package wendy.agent.services.v2;
option go_package = "github.com/wendylabsinc/wendy/proto/gen/agentpb/v2;agentpbv2";

service WendyProvisioningService {
    rpc StartProvisioning(StartProvisioningRequest) returns (StartProvisioningResponse);
    rpc IsProvisioned(IsProvisionedRequest) returns (IsProvisionedResponse);
    // Unprovision resets the device to an unprovisioned state: it deletes the
    // stored enrollment certificates and provisioning state, then restarts the
    // agent so it comes back up serving plaintext on the unprovisioned port.
    rpc Unprovision(UnprovisionRequest) returns (UnprovisionResponse);
}

message IsProvisionedRequest {}

message IsProvisionedResponse {
    oneof response_type {
        NotProvisionedResponse not_provisioned = 1;
        ProvisionedResponse provisioned = 2;
    }
}

message NotProvisionedResponse {}

message ProvisionedResponse {
    string cloud_host = 1;
    int32 organization_id = 2;
    int32 asset_id = 3;
}

message StartProvisioningRequest {
    int32 organization_id = 1;
    string enrollment_token = 2;
    string cloud_host = 3;
    int32 asset_id = 4;

    // Set by "wendy device enroll" on the approved path. Leaving it unset
    // keeps the legacy cloud-relay behaviour, so an older CLI talking to a
    // newer agent is unaffected.
    AcmeEnrollment acme = 5;
}

// AcmeEnrollment is a device enrollment credential minted by Wendy Cloud's
// DeviceEnrollmentService and staged here for the agent to redeem ITSELF
// against pki-core. When it is set the four legacy fields above are unused:
// no certificate and no private key crosses this RPC, and the agent obtains
// its own leaf over ACME rather than being handed one.
message AcmeEnrollment {
    // The tenant's ACME directory,
    // https://<host>/<tenant-uuid>/acme/directory. The tenant is a canonical
    // lower-case UUID and rides inside this URL, so there is no tenant field.
    string directory_url = 1;
    // Stamped into the issued SPIFFE identity server-side. It must equal the
    // DeviceID bound to the EAB row or newOrder returns 403.
    string device_id = 2;
    // The EAB key row id, used as the ACME JWS "kid". Single use.
    string eab_key_id = 3;
    // HEX-encoded, not the base64url every other ACME CA hands out. Relayed
    // verbatim; the agent decodes it.
    string eab_hmac_key = 4;
}


message StartProvisioningResponse {}

message UnprovisionRequest {}

message UnprovisionResponse {}
