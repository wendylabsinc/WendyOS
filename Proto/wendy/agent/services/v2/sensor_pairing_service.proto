syntax = "proto3";
package wendy.agent.services.v2;
option go_package = "github.com/wendylabsinc/wendy/go/proto/gen/agentpb/v2;agentpbv2";

service WendySensorPairingService {
  rpc AddSensorPairing(AddSensorPairingRequest) returns (AddSensorPairingResponse);
  rpc RemoveSensorPairing(RemoveSensorPairingRequest) returns (RemoveSensorPairingResponse);
  rpc ListSensorPairings(ListSensorPairingsRequest) returns (ListSensorPairingsResponse);
  // DiscoverSensorSources browses this device's own network for sensor
  // sources, so a client can pair from anywhere: WendyOS agents
  // (_wendyos._udp) and Wendy Lite boards (_wendy-lite._tcp) that advertise
  // the "sensors" capability. The device never lists itself. Addresses are as
  // seen from this device. Identity fields come from mDNS TXT records and are
  // unauthenticated hints; the pairing transport verifies the source's
  // certificate when it connects. Agents that predate this RPC return
  // UNIMPLEMENTED.
  rpc DiscoverSensorSources(DiscoverSensorSourcesRequest) returns (DiscoverSensorSourcesResponse);
}

message SensorPairing {
  int32 source_asset_id = 1;
  int32 org_id = 2;
  string name = 3;
  repeated string sensor_allowlist = 4;
  bool connected = 5;
  string transport = 6;   // "tcp" (default) or "grpc"
  string source_principal_uri = 7; // direct PKI device identity; mutually exclusive with source_asset_id
}
message AddSensorPairingRequest {
  int32 source_asset_id = 1;
  string source_address = 2;   // resolved LAN addr host:port
  string name = 3;
  repeated string sensor_allowlist = 4;
  string transport = 5;   // "tcp" (default) or "grpc"
  string source_principal_uri = 6; // direct PKI device identity; requires "wendycom"
}
message AddSensorPairingResponse { SensorPairing pairing = 1; }
message RemoveSensorPairingRequest {
  int32 source_asset_id = 1;
  string source_principal_uri = 2;
}
message RemoveSensorPairingResponse {}
message ListSensorPairingsRequest {}
message ListSensorPairingsResponse {
  repeated SensorPairing pairings = 1;
  bool supports_principal_pairing = 2;
}
message DiscoverSensorSourcesRequest {
  // How long to browse, in milliseconds. 0 uses the agent's default (5s);
  // larger values are capped (10s). The agent also finishes early enough to
  // answer before the call's deadline.
  uint32 timeout_ms = 1;
}
// One sensor source as this device sees it on its own network.
message DiscoveredSensorSource {
  string id = 1;                  // TXT id/wendyosdevice, or a fallback name
  string display_name = 2;
  string hostname = 3;            // mDNS hostname, e.g. "board.local"
  string ip_address = 4;          // primary address this device resolved
  repeated string addresses = 5;  // every address this device saw, ip_address first
  int32 port = 6;                 // advertised service port
  bool is_mtls = 7;               // "tls" TXT (WendyOS) or "mtls" TXT (Wendy Lite)
  int32 asset_id = 8;             // legacy cloud asset id; 0 when absent
  int32 org_id = 9;               // legacy cloud org id; 0 when absent
  string tenant_uuid = 10;        // advertised PKI tenant (canonical UUID)
  string principal_uri = 11;      // advertised device principal, validated against tenant_uuid
  repeated string caps = 12;      // advertised capabilities; always includes "sensors"
  bool wendy_lite = 13;           // seen on _wendy-lite._tcp rather than _wendyos._udp
}
message DiscoverSensorSourcesResponse {
  repeated DiscoveredSensorSource sources = 1;
}
