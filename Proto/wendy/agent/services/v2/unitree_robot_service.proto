syntax = "proto3";
package wendy.agent.services.v2;
option go_package = "github.com/wendylabsinc/wendy/go/proto/gen/agentpb/v2;agentpbv2";

// Data and simple commands over an existing paired Go2 connection. Never logs
// in or opens another robot connection; the robot key
// stays in the agent. Registered only on the authenticated agent transport and
// the private admin socket, with the pairing-owner scope check.
service WendyUnitreeRobotService {
  // A MOVE holds for 500 ms; the agent sends StopMove unless another MOVE
  // refreshes it. Any other command cancels a pending move.
  rpc Command(UnitreeCommandRequest) returns (UnitreeCommandResponse);

  // Streams robot topics and/or camera video while the call is open. The robot
  // is asked to send each topic, LiDAR and video only while someone streams it.
  // Ends when the robot disconnects; callers reconnect. Slow readers lose
  // messages instead of delaying the robot connection.
  rpc Stream(UnitreeStreamRequest) returns (stream UnitreeStreamMessage);
}

enum UnitreeCommand {
  UNITREE_COMMAND_UNSPECIFIED = 0;
  UNITREE_COMMAND_MOVE = 1;
  UNITREE_COMMAND_STOP = 2;
  UNITREE_COMMAND_STAND_UP = 3;
  UNITREE_COMMAND_LIE_DOWN = 4;
  UNITREE_COMMAND_HELLO = 5;
  // Stops first, then changes the robot's onboard obstacle-avoidance switch.
  UNITREE_COMMAND_SET_OBSTACLE_AVOIDANCE = 6;
}

message UnitreeCommandRequest {
  string serial = 1;
  UnitreeCommand command = 2;
  // MOVE only. Finite values, the Go2 simulator's limits: |forward| <= 0.8 m/s,
  // |lateral| <= 0.5 m/s (positive is left), |yaw| <= 1.0 rad/s.
  double forward = 3;
  double yaw = 4;
  double lateral = 5;
  // SET_OBSTACLE_AVOIDANCE only. False selects direct Sport API movement.
  bool obstacle_avoidance_enabled = 6;
}

message UnitreeCommandResponse {}

message UnitreeStreamRequest {
  string serial = 1;
  // Robot topic names such as "rt/lf/lowstate"; at most 32.
  repeated string topics = 2;
  // Also stream the front camera.
  bool video = 3;
}

message UnitreeStreamMessage {
  oneof kind {
    UnitreeTopicMessage topic = 1;
    UnitreeVideoFrame video = 2;
  }
}

// One robot message exactly as received.
message UnitreeTopicMessage {
  string topic = 1;
  // Text messages: the JSON envelope {"type":"msg","topic":...,"data":...}.
  // Binary messages (LiDAR): the whole framed buffer.
  bytes data = 2;
  bool binary = 3;
  int64 received_unix_nanos = 4;
}

// One H.264 access unit in Annex-B format.
message UnitreeVideoFrame {
  bytes annexb = 1;
  uint32 rtp_timestamp = 2;
  int64 received_unix_nanos = 3;
}
