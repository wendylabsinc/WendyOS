syntax = "proto3";
package wendy.lite.sensorlink;

message VideoFormat {
  enum Codec { CODEC_UNSPECIFIED = 0; MJPEG = 1; H264 = 2; }
  Codec codec = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 fps = 4;
}
message AudioFormat {
  enum Codec { CODEC_UNSPECIFIED = 0; PCM_S16LE = 1; OPUS = 2; }
  Codec codec = 1;
  uint32 sample_rate = 2;
  uint32 channels = 3;
}
message SensorFormat {
  string schema = 1;      // type id, e.g. "wendy.imu.v1"
  uint32 rate_hz = 2;
  uint32 sample_bytes = 3;
}
message SensorDescriptor {
  uint32 channel_id = 1;
  uint32 input_id = 2; // only one channel of a given input_id can be used at a time
  string name = 3;
  oneof format {
    VideoFormat video = 4;
    AudioFormat audio = 5;
    SensorFormat sensor = 6;
  }
}
message SensorManifest {
  repeated SensorDescriptor sensors = 1;
}
message GetSensorManifest {}
message Subscribe { repeated uint32 channel_id = 1; }
message Unsubscribe { repeated uint32 channel_id = 1; }
message SensorData {
  uint32 channel_id = 1;
  uint32 frame_seq = 2; // wraps at 32 bits
  uint32 chunk_seq = 3;
  uint64 ts_us = 4;
  uint32 flags = 5;   // bit0 = keyframe, bit1 = last chunk in frame
  bytes payload = 6;
}
message Ping { uint64 ts_us = 1; }

// Every message on the wire is an Envelope, so framing needs only one type.
message Envelope {
  oneof msg {
    SensorManifest manifest = 1;
    Subscribe subscribe = 2;
    SensorData data = 3;
    Ping ping = 4;
  }
}
