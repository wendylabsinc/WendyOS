syntax = "proto3";

// First and only non-payload client message on a relay stream. Identifies
// the target device by its asset UUID. The development relay trusts this
// value; a deployed broker must authorize the caller for that asset first.
message WendyComRelayOpen {
    string asset_id = 1;
}

// One bare protobuf-encoded WendyComMessage body — no 8-byte link header.
// The broker adds/strips the header and owns the channel byte.
message WendyComRelayPayload {
    bytes bytes = 1;
}

message WendyComRelayMessage {
    oneof msg {
        WendyComRelayOpen    open    = 1;
        WendyComRelayPayload payload = 2;
    }
}
