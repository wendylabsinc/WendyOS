syntax = "proto3";

enum WendyConfWifiSecurity {
    WENDY_CONF_WIFI_SECURITY_UNSPECIFIED = 0;
    WENDY_CONF_WIFI_SECURITY_OPEN        = 1;
    WENDY_CONF_WIFI_SECURITY_WPA2        = 2;
    WENDY_CONF_WIFI_SECURITY_WPA3        = 3;
}

message WendyConfWifiNetwork {
    string                ssid     = 1;
    string                password = 2;
    int32                 priority = 3; // higher wins; 0 = unspecified
    bool                  hidden   = 4;
    WendyConfWifiSecurity security = 5;
}

// Optional — absent means no WiFi pre-configuration.
message WendyConfWifi {
    repeated WendyConfWifiNetwork networks = 1;
}

// Optional — absent means device boots unenrolled.
message WendyConfCloudProvisioning {
    bool   enrolled   = 1;
    string cloud_host = 2;
    int32  org_id     = 3;
    int32  asset_id   = 4;
    bytes  key        = 5;
    bytes  cert       = 6;
    bytes  chain      = 7;
}

// Operator-authorized Tier C bootstrap. Contains no device private key.
message WendyConfEnrollment {
    string tenant_id = 1;
    string device_id = 2;
    string token = 3;
    string csr_url = 4; // https://csr.<deployment>/v1/<tenant>
    string time_url = 5; // https://codesign.<deployment>/v1/time
    string broker_host = 6;
    uint32 broker_port = 7;
    bytes signed_time = 8; // nonce-bound RFC 3161 response, verified on-device
    // Explicit operator trust provisioning over physical USB/UART only.
    // All three PEM CA bundles are required when provision_trust is true.
    bytes device_roots = 9;
    bytes tsa_roots = 10;
    bytes https_roots = 11;
    bool provision_trust = 12;
}

message WendyConf {
    optional string            device_name  = 1;
    WendyConfWifi              wifi         = 2;
    WendyConfCloudProvisioning provisioning = 3;
    WendyConfEnrollment enrollment = 4;
}
