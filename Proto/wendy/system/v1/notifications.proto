syntax = "proto3";

package wendy.system.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/wendylabsinc/wendy/go/proto/gen/systempb";

// NotificationService is available only through an app's private app-facing
// socket. The agent/daemon binds calls to the app identity represented by that
// socket; requests intentionally carry no app, device, or organization ID.
service NotificationService {
  // Creates one Notification resource in Cloud. notification_id is the caller-chosen
  // resource UUID; any reuse of its canonical UUID after successful creation,
  // including an otherwise identical request, fails with ALREADY_EXISTS.
  // Local validation and rate-limit failures occur before forwarding and do not claim
  // the UUID, so the caller may retry it after correcting the request or waiting.
  rpc Send(SendRequest) returns (SendResponse);
}

enum NotificationSeverity {
  NOTIFICATION_SEVERITY_UNSPECIFIED = 0;
  NOTIFICATION_SEVERITY_INFO = 1;
  NOTIFICATION_SEVERITY_WARNING = 2;
  NOTIFICATION_SEVERITY_ERROR = 3;
  NOTIFICATION_SEVERITY_CRITICAL = 4;
}

enum OrganizationRole {
  ORGANIZATION_ROLE_UNSPECIFIED = 0;
  ORGANIZATION_ROLE_OWNER = 1;
  ORGANIZATION_ROLE_ADMIN = 2;
  ORGANIZATION_ROLE_BILLING_MANAGER = 3;
  ORGANIZATION_ROLE_MEMBER = 4;
  ORGANIZATION_ROLE_VIEWER = 5;
}

message NotificationAudience {
  // Selectors have union semantics. The agent normalizes and deduplicates them
  // and accepts at most 100 selectors total before forwarding to Cloud.
  repeated string user_ids = 1;
  // Legacy Cloud v1 numeric team IDs.
  repeated int32 team_ids = 2;
  repeated OrganizationRole roles = 3;
  // Canonical Cloud v2 team UUIDs. Do not set both team_ids and team_uuids.
  repeated string team_uuids = 4;
}

message SendRequest {
  NotificationAudience audience = 1;
  string title = 2;
  string body = 3;
  NotificationSeverity severity = 4;
  string deep_link = 5;
  // Caller-chosen Notification resource UUID v4. Cloud stores and returns its
  // canonical lowercase form. After successful creation, any canonical reuse fails
  // with ALREADY_EXISTS rather than replaying the earlier success.
  string notification_id = 6;
  optional google.protobuf.Struct metadata = 7;
}

message SendResponse {
  // Canonical lowercase UUID v4 of the newly created Notification resource.
  string notification_id = 1;

}
