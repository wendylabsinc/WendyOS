syntax = "proto3";

package wendycloud.tunnel.lite.v1;

import "wendyauth/v1/envelope.proto";
import "wendycloud/tunnel/v2/tunnel.proto";

// WDY-3512. Device TCP control records and the compact grant are defined in
// docs/lite-relay-v1.md. Only TunnelBroker implements this service.
service WendyComRelayService {
  // Open is required first. The broker authorizes tunnel:connect through the
  // organization's resolved role policy and verifies the operator-signed
  // principal request through pki-core before claiming a device connection.
  // The first response is either a route to the owning broker or a grant.
  // After a grant, payloads carry opaque inner TLS bytes. The CLI sends the
  // compact grant as the first application record after mutual TLS, then sends
  // established only after the device acknowledges successful verification.
  // Client half-close closes TCP output only; device output continues draining.
  rpc WendyComRelay(stream WendyComRelayMessage) returns (stream WendyComRelayMessage);
}

message WendyComRelayOpen {
  // The tunnel-v2 canonical request and signing profile are reused unchanged.
  // service MUST be "wendycom"; request_id is a fresh random 16-byte value.
  wendycloud.tunnel.v2.TunnelPrincipalRequestBody request_body = 1;
  // Mandatory kind "tunnel-principal-request+jws", with an x5c leaf reference.
  wendyauth.v1.SignedArtifact principal_request = 2;
}

message WendyComRelayPayload {
  // 1..65536 opaque bytes, including inner TLS handshake records.
  bytes bytes = 1;
}

message WendyComRelayGrant {
  // Exact signed WLG3 record, including signature. No JWS
  // or JSON wrapping.
  bytes record = 1;
}

message WendyComRelayRoute {
  // Authenticated discovery result from server-side presence, never caller input.
  // The CLI opens a new authenticated stream at this endpoint. No socket has
  // been claimed and no principal request replay nonce has been consumed yet.
  string endpoint = 1;
}

message WendyComRelayEstablished {}

message WendyComRelayMessage {
  oneof msg {
    WendyComRelayOpen open = 1;
    WendyComRelayPayload payload = 2;
    WendyComRelayGrant grant = 3;
    WendyComRelayRoute route = 4;
    WendyComRelayEstablished established = 5;
  }
}

// Cloud API discovery only. TCP ownership, admission and relay run in TunnelBroker.
service WendyComRelayDiscoveryService {
  // Authorizes tunnel:connect before disclosing a live broker endpoint.
  rpc Resolve(ResolveRequest) returns (WendyComRelayRoute);
}
message ResolveRequest {
  string asset_id = 1;
}
