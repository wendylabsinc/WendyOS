syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "wendy/options.proto";
import "wendycloud/v2/signed_request.proto";

enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  ASSET_KIND_DRONE       = 1;
  ASSET_KIND_CAR         = 2;
  ASSET_KIND_QUADRUPED   = 3;
  ASSET_KIND_STATIONARY  = 4;
}

service AssetService {
  // Signed; payload_type "wendycloud.v2.CreateAssetRequest".
  rpc CreateAsset(SignedRequest) returns (Asset) {
    option (wendy.signed_request) = true;
  }
  rpc GetAsset(GetAssetRequest) returns (Asset);
  // Signed; payload_type "wendycloud.v2.UpdateAssetRequest".
  rpc UpdateAsset(SignedRequest) returns (Asset) {
    option (wendy.signed_request) = true;
  }
  // Signed; payload_type "wendycloud.v2.DeleteAssetRequest".
  // For a PKI-bound device, SignedRequest.pki_management_request carries the
  // operator's management-request+jws (op revoke_principal) for exactly
  // spiffe://wendy.sh/tenant/<organization_id>/device/<device_id>, signed by
  // the same operator leaf as this request. Cloud relays revocation before
  // retaining deletion evidence; device:delete suffices (no global cert-revoke).
  // Assets without a device binding do not require the management request.
  // See docs/contract-ledger.md for rollout and compatibility requirements.
  rpc DeleteAsset(SignedRequest) returns (DeleteAssetResponse) {
    option (wendy.signed_request) = true;
  }
  // Server-streamed pagination using offset/limit (matches OrganizationService)
  rpc ListAssets(ListAssetsRequest) returns (stream ListAssetsResponse);
  rpc ListAssetsByApp(ListAssetsByAppRequest) returns (stream ListAssetsByAppResponse);
  rpc ListAssetChildren(ListAssetChildrenRequest) returns (stream ListAssetChildrenResponse);
  rpc GetAssetLineage(GetAssetLineageRequest) returns (GetAssetLineageResponse);
  // Filter assets using JQ filter with pagination
  rpc FilterAssets(FilterAssetsRequest) returns (stream FilterAssetsResponse);
}

message Asset {
  string id = 1;
  string organization_id = 2;
  optional string parent_asset_id = 3;
  string name = 4;
  string details = 5;
  string asset_type = 6;

  // Blob storage fields
  optional string blob_storage_url = 7;
  optional string blob_content_type = 8;
  optional int64 blob_size_bytes = 9;
  optional google.protobuf.Struct blob_metadata = 10;

  // Compute device fields
  bool is_compute_device = 11;
  optional string device_type = 12;
  optional string architecture = 13;
  optional int32 cpu_cores = 14;
  optional int32 ram_mb = 15;
  optional int32 storage_gb = 16;
  optional string os_type = 17;
  optional string os_version = 18;
  optional string ip_address = 19;
  optional string mac_address = 20;

  // Tags for filtering and organization
  repeated string tags = 23;

  // Geographic coordinates
  optional double latitude = 24;
  optional double longitude = 25;
  optional double altitude = 26;

  // Presence: set when the device has an active or recent broker connection
  optional google.protobuf.Timestamp last_heartbeat = 27;

  AssetKind kind = 28;
  optional double heading = 29;

  // Connection location: populated from the IP of the most recent broker connection
  optional string connection_ip = 30;
  optional string connection_city = 31;
  optional string connection_country = 32;
  optional double connection_latitude = 33;
  optional double connection_longitude = 34;

  // Device binding: the UUID pki-core stamped into the device's
  // /device/<uuid> SPIFFE identity at enrollment. Since WDY-3919 a device has
  // ONE id: this equals `id` for every compute device, and cloud resolves an
  // mTLS device identity by `id`. Deprecated: equals the asset id; removed
  // after the cloud release that ships WDY-3919 (expand -> migrate ->
  // contract). New readers use `id`.
  optional string pki_device_name = 35 [deprecated = true];

  // Hardware facts the device reports about itself (WDY-3544), beside the
  // older columns above (device_type = board model, architecture, cpu_cores,
  // ram_mb, storage_gb, os_type, os_version). Absent means the device never
  // reported it. Descriptive only: they authorize nothing.
  // First /proc/device-tree/compatible entry naming the SoC, e.g. "nvidia,tegra264".
  optional string soc_compatible = 36;
  optional string serial_number = 37;
  // uname -r.
  optional string kernel_version = 38;
  // NVIDIA L4T release, e.g. "38.2.0". Absent on non-NVIDIA boards.
  optional string l4t_version = 39;
  // Vendor-specific GPU architecture, e.g. "sm_110".
  optional string gpu_arch = 40;

  // Name of the site the device belongs to, e.g. "Plant 3" (WDY-3581). A
  // cloud with WDY-3590 always fills it; absent only from an older cloud.
  // Descriptive grouping only: authorizes nothing.
  // 41-44 are claimed by open PRs #101/#102.
  optional string site = 45;
  // ID of that site (SiteService, WDY-3590); absent only from an older cloud.
  optional string site_id = 46;

  // Optional cosmetic label (WDY-3919): any characters, not unique, shown in
  // lists. `name` stays the tenant-unique DNS label that selects the device.
  optional string display_name = 47;

  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

message CreateAssetRequest {
  string organization_id = 1;
  optional string parent_asset_id = 2;
  string name = 3;
  string details = 4;
  string asset_type = 5;

  optional string blob_storage_url = 6;
  optional string blob_content_type = 7;
  optional int64 blob_size_bytes = 8;
  optional google.protobuf.Struct blob_metadata = 9;

  bool is_compute_device = 10;
  optional string device_type = 11;
  optional string architecture = 12;
  optional int32 cpu_cores = 13;
  optional int32 ram_mb = 14;
  optional int32 storage_gb = 15;
  optional string os_type = 16;
  optional string os_version = 17;
  optional string ip_address = 18;
  optional string mac_address = 19;
  repeated string tags = 20;

  optional double latitude = 21;
  optional double longitude = 22;
  optional double altitude = 23;
  optional double heading  = 24;

  // See Asset.pki_device_name. When set it becomes the asset `id` (a canonical
  // lowercase UUID); a UUID already in use is ALREADY_EXISTS.
  optional string pki_device_name = 25;

  // See Asset.display_name.
  optional string display_name = 26;
}

message GetAssetRequest {
  string id = 1;
  // Optional exact tenant/PKI selector; both required when id is empty.
  // Authorized tombstones return NOT_FOUND with a typed DeletedAsset detail.
  // Plain NOT_FOUND is never deletion proof.
  optional string organization_id = 2;
  optional string device_id = 3;
}

message UpdateAssetRequest {
  string id = 1;
  optional string name = 2;
  optional string details = 3;
  optional string blob_storage_url = 4;
  optional string blob_content_type = 5;
  optional int64 blob_size_bytes = 6;
  optional google.protobuf.Struct blob_metadata = 7;
  optional string device_type = 8;
  optional string architecture = 9;
  optional int32 cpu_cores = 10;
  optional int32 ram_mb = 11;
  optional int32 storage_gb = 12;
  optional string os_type = 13;
  optional string os_version = 14;
  optional string ip_address = 15;
  optional string mac_address = 16;
  repeated string tags = 17;

  optional double latitude = 18;
  optional double longitude = 19;
  optional double altitude = 20;
  optional string asset_type = 21;
  optional double heading = 22;

  // See Asset.pki_device_name. The device UUID is the asset id and never
  // changes: only the asset's own id is accepted, anything else (including
  // empty) is FAILED_PRECONDITION. Unenroll by deleting the asset.
  optional string pki_device_name = 23;

  // Site NAME, see Asset.site. Absent leaves it unchanged; empty string moves
  // the device to the organization's oldest site (a device always has one);
  // anything else names a site of the organization, INVALID_ARGUMENT if none
  // has that name (WDY-3581, WDY-3590).
  optional string site = 24;
  // Set true to apply tags as given, even when empty (clears all tags).
  // False keeps the older rule: a non-empty tags replaces them, an empty one
  // leaves them unchanged. Same convention as
  // SetOrgPublicRoutingRequest.update_port_denylist (WDY-3581).
  bool update_tags = 25;
  // See Asset.display_name. Absent leaves it unchanged; empty clears it.
  optional string display_name = 26;
}

message DeleteAssetRequest {
  string id = 1;
  // Optional compare-and-delete guard for device unenrollment.
  optional string expected_device_id = 2;
  // Opt-in: request purpose-bound Cloud reset authorization for this installed
  // leaf after committed deletion. Requires current device:delete, exact device
  // guard and the operator's exact-body signature; absent keeps deletion-only.
  optional string reset_certificate_sha256 = 3;
}

message DeletedAsset {
  string id = 1;
  string organization_id = 2;
  string device_id = 3;
  google.protobuf.Timestamp deleted_at = 4;
}

message DeleteAssetResponse {
  bool success = 1;
  // Opt-in compact ML-DSA-65 JWS, typ asset-reset-authorization+jws, aud
  // wendy-agent/unprovision. Bound to committed DeletedAsset bytes and the
  // exact operator-signed request (including installed-leaf hash). Not a bearer
  // credential; Agent must independently verify Cloud key trust, operator proof,
  // installed identity, revocation and fresh time before erasure. Empty means
  // no reset authority, even if success=true. Current-authorized replay can
  // obtain fresh proof; it never rewrites the first tombstone actor/time.
  bytes reset_authorization = 2;
}

message ListAssetsRequest {
  string organization_id = 1;
  optional bool is_compute_device = 2;
  // Offset/limit based pagination (offset = starting row, limit = page size)
  optional int32 offset = 3;
  optional int32 limit = 4;
  optional string filter = 5;  // Filter by name, details, asset_type, device_type, serial_number, site name, or tags
  optional bool online_only = 6;  // If true, only return assets with active broker presence
  // Server-side ordering (applied across all matching assets, before pagination).
  optional string order_by = 7;   // "id" | "name" | "status" | "type"; defaults to "id"
  optional string order_dir = 8;  // "asc" | "desc"; defaults to "asc"
}

message ListAssetsResponse {
  // One asset per streamed response and total count for the full query
  Asset asset = 1;
  int32 total = 2;
}

message ListAssetChildrenRequest {
  string parent_asset_id = 1;
  // Offset/limit based pagination
  optional int32 offset = 2;
  optional int32 limit = 3;
}

message ListAssetChildrenResponse {
  Asset asset = 1;
  int32 total = 2;
}

message GetAssetLineageRequest {
  string asset_id = 1;
}

message GetAssetLineageResponse {
  // The root asset (top-most parent)
  Asset root_asset = 1;
  // All assets in the lineage tree (including root and all descendants)
  repeated Asset all_assets = 2;
  // The asset ID that was requested (for highlighting)
  string requested_asset_id = 3;
}

message ListAssetsByAppRequest {
  string organization_id = 1;
  string app_id = 2;
  optional bool is_compute_device = 3;
  // Offset/limit based pagination (offset = starting row, limit = page size)
  optional int32 offset = 4;
  optional int32 limit = 5;
  optional string filter = 6;  // Filter by name, details, asset_type, device_type, or tags
}

message ListAssetsByAppResponse {
  // One asset per streamed response and total count for the full query
  Asset asset = 1;
  int32 total = 2;
}

message FilterAssetsRequest {
  string organization_id = 1;
  optional string jq_filter = 2;  // JQ filter expression (e.g., ".asset_type == \"compute_device\"")
  // Offset/limit based pagination
  optional int32 offset = 3;
  optional int32 limit = 4;
}

message FilterAssetsResponse {
  // One asset per streamed response and total count for the full query
  Asset asset = 1;
  int32 total = 2;
}
