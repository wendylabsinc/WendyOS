syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/timestamp.proto";
import "wendy/options.proto";
import "wendycloud/v2/signed_request.proto";

// DevicePostboxService is the device-facing half of the §5.3 postbox: a device
// polls its own hash-chained entry log and the notarized checkpoint that binds
// its head. Cloud is a queue here — it must not re-encode or canonicalize the
// JWS or the checkpoint (both bind exact bytes), interpret or filter entries,
// or synthesize a checkpoint. Authorization happened at accept.
//
// Devices pull; cloud never dials. There is no cloud-side high-water mark: the
// device holds the mark and rejects anything below it (WDY-2919, spec on
// WDY-2489).
service DevicePostboxService {
  rpc PullChanges(PullChangesRequest) returns (PullChangesResponse);
  // Q8 decided (sem 2026-10-19 01:42). The device signs the
  // newest entry it has verified with its own device key and sends it here, to
  // cloud, over its own mTLS. Cloud can withhold an ack, never forge one: the
  // alarm for a withheld tail is a stale last signed ack, raised operator side.
  // pki-core is not involved.
  // Device-signed (wendy.device_signed_request): `x5c` = the device leaf,
  // which must be the mTLS peer. payload_type "wendycloud.v2.PostboxHeadAck".
  // Operators read the stored ack with PostboxAckService.GetLastHeadAck.
  rpc AckHead(SignedRequest) returns (AckHeadResponse) {
    option (wendy.device_signed_request) = true;
  }
  // WDY-4015 item 1 (sem 2026-10-23 22:27, corrected 22:30): the device asks
  // for a CA it is missing, normally the Operator Authority CA that issued the
  // `x5c` leaf of a PostboxEntry.request_jws. Nothing is attached to the entry.
  // The tenant comes from the mTLS leaf, as for PullChanges. Cloud-asserted:
  // the device caches a returned certificate only if it is a CA issued
  // directly by the tenant CA the device already holds, and refuses any other.
  // An entry whose issuer the device cannot resolve is held, not consumed.
  // Vectors: conformance/postbox-entry.
  rpc GetOrgCAs(GetOrgCAsRequest) returns (GetOrgCAsResponse);
}

// Operator-side read of a device's last signed head ack (Q8, sem 2026-10-19
// 01:42): the console staleness alarm. Cloud stores the newest AckHead request
// per device verbatim and serves it with the chain, so it can withhold or serve
// a stale ack but never forge a fresh one. The client verifies the ack itself,
// the same way as a RecipientKey: the JWS over the payload with the `x5c` leaf;
// that leaf through `chain_der` to its own PINNED platform root (never the
// served chain alone), valid at the ack's signed `iat`; the issuing CA fixes
// the algorithm (Device Identity CA: ML-DSA-65 only; Lite Device CA: ES256
// only); the leaf's SPIFFE URI equals the requested `device` and its tenant
// equals organization_id; operation
// "wendycloud.v2.DevicePostboxService/AckHead"; payload_type
// "wendycloud.v2.PostboxHeadAck"; body_sha256; then it decodes the payload.
// The alarm runs on the signed PostboxHeadAck.observed_at, never on the
// cloud-asserted fields. Vectors: conformance/reqsig (head_ack_read_vectors).
//
// Monotonicity (WDY-4014), per device: the client keeps (persisted per
// device) the highest signed entry_id, its signed entry_hash and the highest
// signed observed_at it has accepted for that device. A read whose signed
// entry_id or observed_at is lower than the kept value is refused (a replayed
// older ack or a rolled-back store), never displayed. An equal entry_id with
// the same signed entry_hash is the same ack served again and is accepted; an
// equal entry_id with a different signed entry_hash is refused (equivocation:
// the device acked two different entries at one id, so the postbox forked). A
// client that lost its kept values is at first contact: an older ack then
// passes, and only the observed_at staleness alarm covers it.
service PostboxAckService {
  // Gate: the caller is an operator of organization_id's tenant with read
  // access to the device, and the device's tenant equals organization_id. An
  // unknown device, a device of another tenant and a caller without access all
  // get the same generic refusal.
  // Signed; payload_type "wendycloud.v2.GetLastHeadAckRequest".
  rpc GetLastHeadAck(SignedRequest) returns (GetLastHeadAckResponse) {
    option (wendy.signed_request) = true;
  }
}

message GetLastHeadAckRequest {
  string organization_id = 1;  // tenant UUID
  string device = 2;           // the device's SPIFFE URI
}

message GetLastHeadAckResponse {
  // The device's newest accepted AckHead request, byte for byte as it arrived.
  // Unset: the device has never acked (the console shows that, not "fresh").
  SignedRequest ack = 1;
  // Intermediates from the ack's signing leaf up to and including the tenant
  // CA, DER. The leaf itself is the `x5c` in `ack`.
  repeated bytes chain_der = 2;
  // Cloud-asserted, not signed: when cloud accepted the ack, and the device's
  // current postbox head. Display hints; a head above the acked entry_id shows
  // how far the device is behind, and cloud can lie about both. A head below
  // the signed entry_id (0 included) contradicts the device's own statement:
  // the client refuses the response.
  google.protobuf.Timestamp received_at = 3;
  int64 postbox_head_entry_id = 4;
  // Cloud-asserted, not signed (WDY-4014): the entry_hash cloud holds for the
  // entry the ack names (the signed PostboxHeadAck.entry_id). The client
  // compares it with the signed PostboxHeadAck.entry_hash: byte-equal, or the
  // client refuses the ack. Absent with `ack` set is a refusal too. Absent when
  // `ack` is unset. This and postbox_head_entry_hash catch cloud's own store
  // disagreeing with what the device acked, and a third party substituting
  // either side; they do not catch a lying cloud, which copies the signed hash.
  // The signed entry_hash is the authority.
  optional bytes acked_entry_hash = 5;
  // Cloud-asserted, not signed (WDY-4014): the entry_hash of the entry at
  // postbox_head_entry_id. When postbox_head_entry_id equals the signed
  // entry_id it must be byte-equal to the signed entry_hash, else the client
  // refuses; above it, a display hint like the head id. Absent when `ack` is
  // unset.
  optional bytes postbox_head_entry_hash = 6;
}

// Neither the tenant nor the target is on the wire: both are derived from the
// mTLS-proven identity — tenant from the leaf, target from the canonical
// spiffe://wendy.sh/tenant/<tenant>/device/<uuid> built from the asset id,
// which is the device UUID (WDY-3919). A caller-supplied target would let one device read another
// device's chain, which no server-side check makes safer than the identity the
// certificate already proves.
message PullChangesRequest {
  // Exclusive lower bound: the device's own high-water mark. 0 pulls from the
  // start of the chain.
  int64 after_entry_id = 1;
  // Page size. The server caps it; a full page means MORE ENTRIES REMAIN, so
  // page on has_more rather than treating one page as "all changes".
  uint32 limit = 2;
}

message PullChangesResponse {
  repeated PostboxEntry entries = 1;
  // pki-core's notarized checkpoint for this chain, byte-for-byte as pki-core
  // signed it. Empty when the chain has not been notarized yet (notarization is
  // asynchronous, and a self-hosted cloud may have no notarizer at all); the
  // device decides how to treat that rather than the poll being refused.
  bytes checkpoint = 2;
  // True when more entries exist above the last one returned.
  bool has_more = 3;
}

message PostboxEntry {
  int64 entry_id = 1;
  bytes request_jws = 2;   // the operator's signed request, verbatim
  bytes tsr_response = 3;  // RFC 3161 timestamp token taken at accept
  bytes prev_hash = 4;
  bytes entry_hash = 5;
  // The signed request's payload bytes (the JWS binds them by body_sha256) and
  // their fully-qualified message name, so the device decodes exactly what was
  // signed.
  bytes request_payload = 6;
  string payload_type = 7;
}

// The newest entry a device has verified (DevicePostboxService.AckHead).
// Signed by the device; the device identity comes from the signing leaf.
message PostboxHeadAck {
  int64 entry_id = 1;
  bytes entry_hash = 2;
  google.protobuf.Timestamp observed_at = 3;
}

message AckHeadResponse {}

message GetOrgCAsRequest {
  // The DER issuer Name of the certificate the device cannot chain (the
  // operator leaf's issuer; pki-core's ML-DSA leaves carry no authority key
  // identifier, so the name is the lookup key). Empty: every CA the device's
  // tenant CA has issued.
  bytes issuer = 1;
}

message GetOrgCAsResponse {
  // DER, each a CA issued by the device's tenant CA: those whose subject
  // equals `issuer` (several across a rotation), or all of them. A non-empty
  // `issuer` that matches none is NOT_FOUND, never an empty list.
  repeated bytes ca_der = 1;
}
