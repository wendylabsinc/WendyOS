syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/timestamp.proto";
import "wendy/options.proto";
import "wendycloud/v2/deployments.proto";
import "wendycloud/v2/signed_request.proto";

// Encrypted artifact registry (Apps & Deployments spec v2, approved
// 2026-10-19 01:15; lean registry design approved 2026-10-18 14:28). Scope:
// OCI artifacts for tier A/B devices. Tier C (wendy-lite) firmware is not OCI
// and gets its own contract (sem 2026-10-18 16:37).
//
// Invariants this file encodes:
// - The registry is blind. It stores ciphertext, wraps and signed public-key
//   registrations. No RPC carries a plaintext key, and no server produces a
//   wrap: wraps are made by an operator client and arrive inside a request that
//   operator signed. A compromised registry can withhold or delete, never grant.
// - Authority is the operator signature. A device acts on its own signed
//   assignment (ArtifactRegistryService.AssignDevice) and checks every byte it
//   fetches here against digests that assignment signs. A wrong blob or a wrong
//   wrap fails closed on the device.
// - Device pull authorization is the live assignment: device from the mTLS
//   leaf, tenant from its SAN, never from the request.
//
// Not in this file: the registry <-> cloud assignment check (both live in the
// cloud repo, internal API); the custodian ceremony and the accepted
// custodian key ids (config, not wire, Q9).
//
// Operator keys are per DEVICE (sem 2026-10-20 21:29, decision 5 closed): every
// operator device or browser generates and registers its own key, so one user
// holds several live keys. A device that already holds a wrap re-wraps onward
// (GetMyWraps, then AddWraps) for a device the same user signs in on later.

// ==================== Key directory ====================

// Recipient encryption public keys live in cloud's database next to the users
// and devices that generated them (Q2, sem 2026-10-18 23:45). pki-core is not
// involved: no key hash in certificates, no enrollment-body change. Each key is
// registered in a request its principal signed with its own certificate, and
// that signed statement is served back with the key, so cloud is an untrusted
// courier: it can withhold a key, never substitute one.
service KeyDirectoryService {
  // An operator registers its user encryption key at sign-in, next to
  // OperatorSessionService.RegisterOperatorLeaf. Signed with `x5c` (operator
  // leaf): the stored request is the binding. One key per operator DEVICE (sem
  // 2026-10-20 21:29): each device or browser of the user registers its own
  // key, and the user may hold several live keys. A registration adds a key; it
  // never replaces another device's key. Replacement applies to one device's
  // own key only. TODO(ruling): how a device's old key is retired when that
  // device rotates (no wire field ties two key ids to one device yet).
  // Signed; payload_type "wendycloud.v2.RegisterEncryptionKeyRequest".
  rpc RegisterUserEncryptionKey(SignedRequest) returns (RegisterEncryptionKeyResponse) {
    option (wendy.signed_request) = true;
  }
  // A device registers the encryption key it generated at enrollment, over its
  // own mTLS. Device-signed (wendy.device_signed_request): `x5c` = the device
  // leaf, which must be the mTLS peer.
  // payload_type "wendycloud.v2.RegisterEncryptionKeyRequest".
  // TODO(ungrounded): when the agent sends this relative to enrollment (first
  // call after enrollment is assumed) is not ruled; until it has, the device is
  // reported in GetRecipientKeysResponse.unbound and cannot be targeted.
  rpc RegisterDeviceEncryptionKey(SignedRequest) returns (RegisterEncryptionKeyResponse) {
    option (wendy.device_signed_request) = true;
  }
  rpc GetRecipientKeys(GetRecipientKeysRequest) returns (GetRecipientKeysResponse);
}

// Every principal registers KEM_SUITE_MLKEM768_X25519 (Q5). Cloud refuses any
// other suite.
message RegisterEncryptionKeyRequest {
  string organization_id = 1;  // tenant UUID
  KemSuite suite = 2;
  bytes public_key = 3;
}

message RegisterEncryptionKeyResponse {
  string key_id = 1;  // SHA-256 (hex) of public_key
}

message GetRecipientKeysRequest {
  string organization_id = 1;
  repeated string principals = 2;  // device or user SPIFFE URIs
}

// The client trusts `registration` and `chain_der` only as far as they chain
// to its own pinned platform root; cloud serves them and is untrusted. It
// verifies the JWS over the payload bytes with the `x5c` leaf, chains that
// leaf through `chain_der` to the tenant CA (valid at the JWS `iat`), and
// anchors the tenant CA to the client-pinned platform root, never to the
// cloud-served chain alone (a compromised cloud could serve its own CA). It
// checks the CA's tenant equals organization_id, the leaf identity equals
// `principal`, payload_type is "wendycloud.v2.RegisterEncryptionKeyRequest",
// the JWS operation is the matching Register* method, then decodes the payload
// and recomputes key_id = SHA-256(public_key) locally. For a device key the
// issuing CA fixes the algorithm: a leaf under the Device Identity CA signs
// ML-DSA-65 only, a leaf under the Lite Device CA ES256 only; anything else is
// refused (conformance/reqsig/README.md, device-signer profile).
message RecipientKey {
  string principal = 1;
  SignedRequest registration = 2;  // verbatim as registered
  // Intermediates from the signing leaf up to and including the tenant CA,
  // DER. The leaf itself is the `x5c` in `registration`.
  repeated bytes chain_der = 3;
}

message GetRecipientKeysResponse {
  // One entry per live key. A user principal appears once per registered
  // operator device key; the client wraps to each of them.
  repeated RecipientKey keys = 1;
  // Principals with no live registration (never registered, revoked, deleted):
  // the client refuses to target them.
  repeated string unbound = 2;
}

// ==================== Operator side ====================

// Operator-facing registry API (CLI, console). Bearer + DPoP; state-changing
// calls are SignedRequests and audited with the signer.
service ArtifactRegistryService {
  // Opens the upload of one release's artifact. Records the clear manifest,
  // sets AppRelease.image_digest to manifest_digest, and returns the ciphertext
  // this upload still has to send. The release is servable once every blob is
  // present and a CUSTODIAN wrap exists at release scope.
  // Signed; payload_type "wendycloud.v2.PublishArtifactRequest".
  rpc PublishArtifact(SignedRequest) returns (PublishArtifactResponse) {
    option (wendy.signed_request) = true;
  }
  // Client stream: one header, then data. Not signed: client-streaming RPCs
  // are never signed (conformance/reqsig/README.md); authorized by the
  // upload_id that the signed PublishArtifact returned. The registry checks the
  // promised ciphertext digest and size; it cannot check plaintext.
  // Write-once per digest.
  rpc PutBlob(stream PutBlobRequest) returns (PutBlobResponse);
  // Attaches wraps and sealed content keys made client-side: release scope at
  // publish (publisher, pre-granted users, custodian), deployment scope at
  // deployment create, operator invite and rotation. Device wraps travel in
  // DeviceAssignment instead.
  // Signed; payload_type "wendycloud.v2.AddWrapsRequest".
  rpc AddWraps(SignedRequest) returns (AddWrapsResponse) {
    option (wendy.signed_request) = true;
  }
  // Deletes wrap rows; needs no key. Operator removal.
  // Signed; payload_type "wendycloud.v2.RemoveWrapsRequest".
  rpc RemoveWraps(SignedRequest) returns (RemoveWrapsResponse) {
    option (wendy.signed_request) = true;
  }
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  // Wraps addressed to the CALLER's own keys only (recipient from the
  // authenticated principal, never from the request), so an operator client
  // can unwrap a key to wrap it onward. A user has one key per device; each
  // device opens the wraps at its own recipient_key_id.
  rpc GetMyWraps(GetMyWrapsRequest) returns (GetMyWrapsResponse);

  // One signed statement per target device (Q7, sem 2026-10-19 01:15: one
  // signature per device, not per deployment), postbox-relayed verbatim to that
  // device. It is the device's authority to apply AND its pull authorization.
  // Cloud refuses it unless the deployment has a SealedContentKey and a
  // CUSTODIAN wrap at deployment_key_id. For a registry-backed release,
  // CreateDeployment records the deployment only; devices receive it here.
  // Signed; payload_type "wendycloud.v2.DeviceAssignment".
  rpc AssignDevice(SignedRequest) returns (AssignDeviceResponse) {
    option (wendy.signed_request) = true;
  }
  // Postbox-relayed to the device; cloud drops the assignment, so pulls stop.
  // Signed; payload_type "wendycloud.v2.UnassignDeviceRequest".
  rpc UnassignDevice(SignedRequest) returns (UnassignDeviceResponse) {
    option (wendy.signed_request) = true;
  }
}

// Everything the device checks comes from here, under the operator signature:
// it targets this one device, pins the release digest and the deployment key,
// and carries the device's own wrap of that key. Rotation = a new assignment
// per device at the new key id (Q6).
message DeviceAssignment {
  string organization_id = 1;
  string deployment_id = 2;
  string device = 3;  // the target device's SPIFFE URI
  string app_id = 4;
  string app_release_id = 5;
  string manifest_digest = 6;
  string deployment_key_id = 7;
  Running desired_state = 8;
  KeyWrap device_wrap = 9;  // recipient = device, scope = deployment at deployment_key_id
  // The assignment's instruction validity (WDY-4015 item 3): this message's
  // valid_until, under the same rules (conformance/postbox-entry/README.md).
  google.protobuf.Timestamp expires_at = 10;
}

message AssignDeviceResponse {
  int64 postbox_entry_id = 1;
}

message UnassignDeviceRequest {
  string organization_id = 1;
  string deployment_id = 2;
  string device = 3;
  // Instruction validity (WDY-4015 item 3, sem 2026-10-23 22:27), under the
  // operator's signature: required when cloud relays the request to a device
  // postbox. Rules: conformance/postbox-entry/README.md.
  google.protobuf.Timestamp valid_until = 4;
}

message UnassignDeviceResponse {
  int64 postbox_entry_id = 1;
}

message PublishArtifactRequest {
  string organization_id = 1;
  string app_release_id = 2;
  ArtifactManifest manifest = 3;
}

message PublishArtifactResponse {
  string upload_id = 1;
  // Ciphertext digests of THIS upload not yet received (resume). No dedup
  // across releases (Q10): each release has its own content key, so identical
  // layers are stored once per release.
  repeated string missing_ciphertext_digests = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Users whose current permissions already reach every release of this app.
  // The publishing client wraps the content key to each of them at release
  // scope at publish, not on request (Q1 amendment, sem 2026-10-18 16:37).
  repeated RecipientKey auto_grant_keys = 4;
}

message PutBlobRequest {
  oneof part {
    PutBlobHeader header = 1;  // first message only
    bytes data = 2;
  }
}

message PutBlobHeader {
  string upload_id = 1;
  string ciphertext_digest = 2;  // "sha256:<hex>"
  uint64 ciphertext_size = 3;
}

message PutBlobResponse {
  string ciphertext_digest = 1;
}

message GetArtifactRequest {
  string organization_id = 1;
  string app_release_id = 2;
}

message GetArtifactResponse {
  ArtifactManifest manifest = 1;
}

message GetMyWrapsRequest {
  string organization_id = 1;
  WrapScope scope = 2;
}

message GetMyWrapsResponse {
  repeated KeyWrap wraps = 1;
  repeated SealedContentKey sealed_content_keys = 2;
}

// ==================== Artifact format ====================

// The clear artifact manifest. Names, digests and sizes in clear are the
// accepted metadata residual; every blob, the OCI config blob included, is
// ciphertext.
message ArtifactManifest {
  // The release digest the operator signs: SHA-256 over oci_manifest, which
  // authenticates every plaintext_digest.
  string manifest_digest = 1;
  bytes oci_manifest = 2;  // byte-exact OCI image / OCI 1.1 artifact manifest
  ReleaseType kind = 3;    // CONTAINER, WASM or CONFIG
  repeated EncryptedBlob blobs = 4;
  string content_key_id = 5;  // SHA-256 (hex) of the content key
  AeadSuite aead = 6;
  uint32 chunk_size = 7;  // plaintext bytes per AEAD chunk; 65536 by default
}

// Dual digest. plaintext_digest is authenticated through manifest_digest;
// ciphertext_digest is the registry address and an early transport check,
// never authority.
message EncryptedBlob {
  string plaintext_digest = 1;
  string ciphertext_digest = 2;
  uint64 plaintext_size = 3;
  uint64 ciphertext_size = 4;
}

// Q4: AES-256-GCM. Q4 amendment, sem sees it: one content key covers every
// blob of a release, so chunks are NOT sealed under the content key directly
// (chunk 0 of two blobs would reuse key + nonce). Each blob gets its own key,
// HKDF-SHA256(content key, info = the blob's plaintext_digest); each chunk is
// sealed under that per-blob key with a nonce derived from (chunk index,
// last-chunk flag): truncation, reorder and splice fail authentication.
// Symmetric, so post-quantum safe as is.
// Byte layouts and vectors: conformance/registry/README.md (per-blob key,
// chunk nonce, framing; no chunk AAD).
enum AeadSuite {
  AEAD_SUITE_UNSPECIFIED = 0;
  AEAD_SUITE_AES_256_GCM_CHUNKED = 1;
}

// ==================== Keys and wraps ====================

// Q5: one suite for every recipient of an OCI artifact. P-256 wraps are dropped
// for OCI; the tier C firmware path is out of scope here (sem 2026-10-18
// 16:37).
enum KemSuite {
  KEM_SUITE_UNSPECIFIED = 0;
  // HPKE with the ML-KEM-768 + X25519 hybrid KEM, HKDF-SHA256, AES-256-GCM.
  // Tier A/B devices, users, the custodian.
  KEM_SUITE_MLKEM768_X25519 = 1;
}

enum RecipientKind {
  RECIPIENT_KIND_UNSPECIFIED = 0;
  RECIPIENT_KIND_DEVICE = 1;
  // One key per operator device (sem 2026-10-20 21:29): a user has one
  // recipient key per device or browser; recipient = the user's SPIFFE URI,
  // recipient_key_id = that device's key.
  RECIPIENT_KIND_USER = 2;
  // Wendy break-glass key; clients pin its public key per environment. Dev =
  // generated key pair; prod = 2-of-3 Shamir, same officers as the platform
  // root, separate key, no cloud-KMS second recipient in v1 (Q9). The ceremony
  // and the accepted custodian key ids are config, not wire. The registry
  // refuses a release or deployment with no CUSTODIAN wrap.
  // TODO(Q9): the prod custodian ceremony is defined before the registry goes
  // to prod (sem 2026-10-18 14:28).
  RECIPIENT_KIND_CUSTODIAN = 3;
}

// What a wrap opens. Deployment scope: the deployment key. Release scope: the
// content key itself, for release holders before any deployment exists (Q1).
message WrapScope {
  oneof scope {
    string deployment_id = 1;
    string app_release_id = 2;
  }
  // SHA-256 (hex) of the wrapped key; tells a stale wrap after rotation.
  string key_id = 3;
}

// One key sealed to one recipient public key (HPKE base mode). The HPKE info
// binds tenant, scope, key_id and recipient_key_id, so a wrap moved to another
// scope or recipient does not open. Info layout (AAD empty) and vectors:
// conformance/registry/README.md.
message KeyWrap {
  WrapScope scope = 1;
  RecipientKind recipient_kind = 2;
  string recipient = 3;         // SPIFFE URI; empty for the custodian
  string recipient_key_id = 4;  // SHA-256 (hex) of the recipient public key
  KemSuite suite = 5;
  bytes enc = 6;
  bytes ciphertext = 7;
}

// The content key sealed under a deployment key, once per deployment and
// deployment key: AES-256-GCM, 12-byte nonce, AAD length-prefixed over
// tenant, deployment_id, manifest_digest, content_key_id and
// deployment_key_id (conformance/registry/README.md).
// Q6: rotation changes the deployment key only. The rotating client seals the
// same content key under a new deployment key, re-wraps it to current members
// and re-assigns each device; blobs are not re-encrypted. A leaked content key
// means publishing a new release.
message SealedContentKey {
  string deployment_id = 1;
  string manifest_digest = 2;
  string content_key_id = 3;
  string deployment_key_id = 4;
  bytes nonce = 5;
  bytes ciphertext = 6;
}

message AddWrapsRequest {
  string organization_id = 1;
  repeated KeyWrap wraps = 2;
  repeated SealedContentKey sealed_content_keys = 3;  // deployment create and rotation
}

message AddWrapsResponse {
  uint32 stored = 1;
}

message RemoveWrapsRequest {
  string organization_id = 1;
  WrapScope scope = 2;
  repeated string recipient_key_ids = 3;
}

message RemoveWrapsResponse {
  uint32 removed = 1;
}

// ==================== Device side ====================

// Device-facing registry API over the device's own mTLS (tier A/B). Every call
// is refused unless a live assignment of this device references the deployment
// and the digest belongs to its release. When the assignment check cannot be
// made, the call is refused too (UNAVAILABLE): availability degrades, security
// does not (Q3).
service DeviceArtifactService {
  rpc GetDeploymentMaterial(GetDeploymentMaterialRequest) returns (GetDeploymentMaterialResponse);
  // Server stream of ciphertext, resumable by offset.
  rpc GetBlob(GetBlobRequest) returns (stream GetBlobResponse);
}

message GetDeploymentMaterialRequest {
  string deployment_id = 1;  // from the verified assignment
}

// The device's wrap is not here: it arrives in its signed DeviceAssignment.
message GetDeploymentMaterialResponse {
  ArtifactManifest manifest = 1;
  SealedContentKey sealed_content_key = 2;  // at the assignment's deployment_key_id
}

message GetBlobRequest {
  string deployment_id = 1;
  string ciphertext_digest = 2;
  uint64 offset = 3;
}

message GetBlobResponse {
  bytes data = 1;
}
