// TunnelBrokerService brokers mTLS-authenticated TCP tunnels between wendy-agent
// (device) and wendy CLI through the cloud relay.
//
// Authentication: all three RPCs require a valid mTLS client certificate.
//   - Agent RPCs (RegisterPresence, AgentTunnel): asset certificate (org_id + asset_id in SAN)
//   - CLI RPC (ClientTunnel): user certificate (org_id + user_id in SAN)
//
// Session lifecycle:
//   1. CLI sends ClientTunnelOpen (asset_id, host, port) as the first message on a
//      ClientTunnel stream. No session_id exists at this point.
//   2. Broker generates a session_id, parks the ClientTunnel stream, and pushes a
//      DialRequest (session_id, host, port) to the target agent via RegisterPresence.
//   3. Agent dials the local service, opens an AgentTunnel stream, and sends
//      TunnelData{session_id} (empty payload) as its first message to claim the session.
//   4. Broker pairs the two streams by session_id and begins relaying payload data
//      transparently in both directions. session_id is ignored in all subsequent messages.
//
// DATAGRAM sessions follow the same rendezvous (steps 1-4 above), except the
// agent dials nothing upfront: host/port on the open message are ignored, and
// the resulting session multiplexes many UDP flows (TunnelDatagram) and ICMP
// echoes (IcmpEchoRequest/IcmpEchoReply) over the single paired stream pair,
// keyed by flow_id.

syntax = "proto3";
package wendycloud.v2;

import "google/protobuf/timestamp.proto";

service TunnelBrokerService {
  // Agent: persistent control stream. Agent sends heartbeats; broker pushes a
  // DialRequest whenever a CLI opens a ClientTunnel targeting this asset.
  rpc RegisterPresence(stream AgentHeartbeat) returns (stream DialRequest);

  // Agent: data stream for one tunnel session. The first message must carry the
  // session_id from the DialRequest (empty payload) so the broker can pair this
  // stream with the waiting ClientTunnel stream. All subsequent messages carry
  // payload data; session_id is ignored after the join.
  rpc AgentTunnel(stream TunnelData) returns (stream TunnelData);

  // CLI: open a tunnel to a device. The first message must be ClientTunnelOpen;
  // the broker assigns a session_id and notifies the target agent via RegisterPresence.
  // Subsequent messages carry payload data relayed to/from the agent.
  rpc ClientTunnel(stream ClientTunnelMessage) returns (stream TunnelData);

  // Services backend: open a tunnel to a device. Authenticated via x-service-token
  // metadata header instead of mTLS. The first message must be ServiceTunnelOpen;
  // subsequent messages carry payload data relayed to/from the agent.
  rpc ServiceTunnel(stream ServiceTunnelMessage) returns (stream TunnelData);
}

message AgentHeartbeat {
  // Informational; broker records its own server-side heartbeat time via NOW().
  // Clients may omit this field; it is available for client-side diagnostics only.
  google.protobuf.Timestamp timestamp = 1;
}

// Transport protocol for a tunnel session. TCP (the zero value) preserves the
// original one-stream-per-TCP-connection behavior. DATAGRAM opens a long-lived
// multiplexed session carrying UDP datagrams (TunnelDatagram) and ICMP echoes
// (IcmpEchoRequest/IcmpEchoReply); host/port on the open message are ignored.
enum TunnelProtocol {
  TUNNEL_PROTOCOL_TCP      = 0;
  TUNNEL_PROTOCOL_DATAGRAM = 1;
}

// One UDP datagram within a DATAGRAM session. flow_id is client-assigned and
// unique within the session; the agent creates a connected loopback UDP socket
// per flow_id on first sight and expires it after 2 minutes idle.
message TunnelDatagram {
  uint32 flow_id = 1;
  uint32 port    = 2;  // destination port on the device (loopback); set on every frame
  bytes  payload = 3;  // exactly one datagram, max 65507 bytes
}

// Ping request within a DATAGRAM session. The agent answers immediately with
// an IcmpEchoReply — the agent itself is the host being pinged, so a reply is
// proof of liveness with a true end-to-end RTT. No ICMP socket is involved.
message IcmpEchoRequest {
  uint32 identifier = 1;
  uint32 sequence   = 2;
  bytes  payload    = 3;
  uint64 originate_unix_ns = 4;  // client send time
}

message IcmpEchoReply {
  uint32 identifier = 1;         // copied from request
  uint32 sequence   = 2;         // copied from request
  bytes  payload    = 3;         // echoed verbatim
  uint64 originate_unix_ns = 4;  // copied from request
  uint64 agent_unix_ns     = 5;  // agent receive time
}

message DialRequest {
  // Broker-assigned session identifier. The agent must echo this value in the
  // first TunnelData message on its AgentTunnel stream to claim the session.
  string session_id = 1;
  string host       = 2;
  uint32 port       = 3;
  TunnelProtocol protocol = 4;
}

message TunnelData {
  // Used only in AgentTunnel's first (join) message: the agent echoes the
  // session_id received in DialRequest so the broker can pair this stream with
  // the waiting ClientTunnel stream. Ignored in all subsequent messages.
  string session_id = 1;
  bytes  payload    = 2;
  bool   half_close = 3;
  // DATAGRAM sessions only; at most one of 4/5/6 set per frame.
  TunnelDatagram  datagram     = 4;
  IcmpEchoRequest icmp_request = 5;
  IcmpEchoReply   icmp_reply   = 6;
}

// Sent by the CLI to request a new tunnel connection. The broker generates a
// session_id upon receiving this message and delivers it to the target agent
// as a DialRequest via the agent's RegisterPresence stream.
message ClientTunnelOpen {
  string  asset_id = 1;
  string host     = 2;
  uint32 port     = 3;
  TunnelProtocol protocol = 4;  // port is ignored when DATAGRAM
}

// Sent by the CLI on a ClientTunnel stream. The first message must be `open`;
// all subsequent messages must be `data`.
message ClientTunnelMessage {
  oneof content {
    ClientTunnelOpen open = 1;
    TunnelData       data = 2;
  }
}

// Sent by the services backend to open a tunnel. Carries the target asset and
// endpoint; the broker generates a session and dispatches a DialRequest to the agent.
message ServiceTunnelOpen {
  string  asset_id = 1;
  string host     = 2;
  uint32 port     = 3;
  TunnelProtocol protocol = 4;
}

// Sent by the services backend on a ServiceTunnel stream. The first message must
// be `open`; all subsequent messages must be `data`.
message ServiceTunnelMessage {
  oneof content {
    ServiceTunnelOpen open = 1;
    TunnelData        data = 2;
  }
}
