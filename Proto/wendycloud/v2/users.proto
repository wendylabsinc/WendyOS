syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/timestamp.proto";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  bool is_super_admin = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateUserRequest {
  string email = 1;
  string name = 2;
  bool is_super_admin = 3;
}

message GetUserRequest {
  string id = 1;
}

message UpdateUserRequest {
  string id = 1;
  optional string name = 2;
  // Removed (WDY-3167): is_super_admin was the cross-user admin-promotion vector
  // and is accepted-and-ignored by the cloud handler. `id` is retained: the
  // handler uses it for self-update (edit own record when id == caller).
  reserved 3;
  reserved "is_super_admin";
}
