[project]
name = "wendy-agent-inference"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av==16.1.0",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==5.10.1",
  "timm==1.0.29",
  "Pillow==13.0.0",
  "numpy==2.2.6",
  "onnxruntime==1.23.2",
  "onnx==1.22.0",
  "huggingface-hub==1.5.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
