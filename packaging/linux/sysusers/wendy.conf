# The wendy udev rules (70-wendy-jetson.rules, 70-wendy-qualcomm.rules) grant
# USB flashing access to the plugdev group. Debian and Ubuntu ship plugdev;
# Arch and Fedora do not, and udev drops a whole rule line that names a missing
# group. This creates it as a system group where it is missing; an existing
# plugdev group is left as is.
g plugdev -
