[project]
name = "sh.wendy.regression"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sh_wendy_regression = "sh_wendy_regression:main"

# A build system makes uv install the package, and with it the script above
# that the Dockerfile's CMD runs. Without one, uv treats the project as
# "virtual" and 'uv run sh_wendy_regression' fails with "Failed to spawn".
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
