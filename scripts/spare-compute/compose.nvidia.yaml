# Use with compose.yaml on NVIDIA Linux hosts with enough RAM/VRAM for this model.
services:
  reviewer:
    extends:
      file: compose.yaml
      service: worker
    environment:
      MODES: review
      WORKER_CPUS: "1"
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    volumes:
      - review-state:/state
  model:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    init: true
    restart: "no"
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /cache
      HF_HOME: /cache/huggingface
    volumes:
      - type: bind
        source: ${MODEL_CACHE:?Set MODEL_CACHE to an absolute directory owned by UID 10001}
        target: /cache
        bind:
          create_host_path: false
    # No host port. Only the worker can reach this Compose network endpoint.
    command:
      - --model
      - ${MODEL_WEIGHTS:-Qwen/Qwen3.8-Flash-Next-FP8}
      - --served-model-name
      - ${MODEL_NAME:-Qwen/Qwen3.8-Flash-Next}
      - --tensor-parallel-size
      - ${MODEL_TENSOR_PARALLEL:-1}
      - --enable-expert-parallel
      - --reasoning-parser
      - qwen3
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - ${MODEL_GPU_MEMORY_FRACTION:-0.80}
    cpus: ${MODEL_CPUS:-4}
    cpu_shares: 128
    mem_limit: ${MODEL_MEMORY:-128g}
    memswap_limit: ${MODEL_MEMORY:-128g}
    shm_size: 8g
    pids_limit: 1024
    stop_grace_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  review-state:
