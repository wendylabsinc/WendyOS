syntax = "proto3";
package wendy.agent.services.v1;
// Wire-compatible projection of WendyShellService. Field numbers match
// go/proto/gen/agentpb/wendy_agent_v1_shell_service.pb.go.
message WindowSize { uint32 rows = 1; uint32 cols = 2; }
message HostShellRequest {
  message Start { repeated string command = 1; WindowSize term_size = 2; }
  oneof request_type { Start start = 1; bytes stdin_data = 2; WindowSize resize = 3; }
}
message HostShellResponse {
  oneof response_type { bytes stdout_data = 1; int32 exit_code = 2; }
}
